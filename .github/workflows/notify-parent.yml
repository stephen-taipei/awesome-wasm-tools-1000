name: Notify Parent Repo
on:
  push:
    branches: [main, dev]
  workflow_dispatch:
permissions: {}
jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger stephen.taipei deployment
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.GH_PAT }}
          repository: stephen-taipei/stephen.taipei
          event-type: submodule-updated
          client-payload: |
            {
              "submodule": ${{ toJSON(github.repository) }},
              "ref": ${{ toJSON(github.ref) }},
              "sha": ${{ toJSON(github.sha) }},
              "message": ${{ toJSON(github.event.head_commit.message || '') }}
            }
      - name: Log notification
        env:
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
          REF: ${{ github.ref }}
        run: printf 'Notified parent about %s at %s (%s)\n' "$REPOSITORY" "$COMMIT_SHA" "$REF"
