name: Codebase audit
on:
  push:
    branches: [audit/codebase-2026-09-24]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Resolve patched toolchain (audit bootstrap only)
        run: |
          npm install --save-dev 'vite@^7.3.5' 'parse5@^7.3.0' '@playwright/test@^1.56.1'
          npm update
          mkdir -p audit-results
          cp package.json package-lock.json audit-results/
          npm audit --json > audit-results/dependencies.json || true
          tar -czf audit-results/toolchain.tar.gz node_modules
      - name: Validate upgraded baseline
        run: npm run build
      - name: Preserve resolved toolchain
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codebase-audit-toolchain
          path: audit-results/
          retention-days: 3
