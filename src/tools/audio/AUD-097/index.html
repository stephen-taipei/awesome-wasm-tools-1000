<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AUD-097 音訊 BPM 偵測 - WASM Tools</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: linear-gradient(135deg, #1a1a2e, #16213e); min-height: 100vh; color: #e0e0e0; padding: 20px; }
    .container { max-width: 900px; margin: 0 auto; }
    header { text-align: center; margin-bottom: 30px; padding: 20px; background: rgba(255,255,255,0.05); border-radius: 16px; }
    h1 { font-size: 2rem; margin-bottom: 10px; background: linear-gradient(135deg, #ec4899, #db2777); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .subtitle { color: #a0a0a0; }
    .upload-area { border: 2px dashed #4a4a6a; border-radius: 16px; padding: 60px 40px; text-align: center; cursor: pointer; background: rgba(255,255,255,0.02); margin-bottom: 20px; }
    .upload-area:hover { border-color: #ec4899; }
    .upload-icon { font-size: 4rem; margin-bottom: 15px; }
    .file-input { display: none; }
    .action-buttons { display: flex; gap: 15px; justify-content: center; margin-bottom: 20px; }
    .btn { padding: 15px 35px; border: none; border-radius: 12px; font-size: 1rem; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 10px; }
    .btn-primary { background: linear-gradient(135deg, #ec4899, #db2777); color: white; }
    .btn:disabled { opacity: 0.5; }
    .result-panel { background: rgba(236,72,153,0.1); border: 1px solid rgba(236,72,153,0.3); border-radius: 16px; padding: 25px; margin-bottom: 20px; display: none; }
    .result-panel.show { display: block; }
    .result-title { color: #ec4899; font-size: 1.2rem; margin-bottom: 20px; }
    .bpm-display { text-align: center; margin-bottom: 30px; }
    .bpm-value { font-size: 5rem; font-weight: 800; background: linear-gradient(135deg, #ec4899, #db2777); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .bpm-label { font-size: 1.5rem; color: #a0a0a0; margin-top: 10px; }
    .confidence { margin-top: 10px; color: #94a3b8; }
    .tempo-info { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 15px; margin-top: 20px; }
    .tempo-item { background: rgba(255,255,255,0.05); padding: 15px; border-radius: 10px; text-align: center; }
    .tempo-label { font-size: 0.85rem; color: #a0a0a0; margin-bottom: 5px; }
    .tempo-value { font-size: 1.2rem; font-weight: 600; color: #ec4899; }
    .canvas-container { background: rgba(0,0,0,0.3); border-radius: 12px; padding: 15px; margin-top: 20px; }
    canvas { width: 100%; height: 120px; }
    footer { text-align: center; padding: 20px; color: #666; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>AUD-097 音訊 BPM 偵測</h1>
      <p class="subtitle">偵測音樂的節拍速度</p>
    </header>

    <div class="upload-area" id="uploadArea">
      <div class="upload-icon">🎵</div>
      <div>拖放音訊檔案到此處</div>
      <div style="color:#888;margin-top:10px;">支援 MP3, WAV, OGG 格式</div>
      <input type="file" id="fileInput" class="file-input" accept="audio/*">
    </div>

    <div class="action-buttons">
      <button class="btn btn-primary" id="detectBtn" disabled><span>🎵</span> 偵測 BPM</button>
    </div>

    <div class="result-panel" id="resultPanel">
      <div class="result-title">🎵 BPM 偵測結果</div>
      <div class="bpm-display">
        <div class="bpm-value" id="bpmValue">---</div>
        <div class="bpm-label">BPM</div>
        <div class="confidence" id="confidence"></div>
      </div>
      <div class="tempo-info">
        <div class="tempo-item">
          <div class="tempo-label">半速</div>
          <div class="tempo-value" id="halfBpm">---</div>
        </div>
        <div class="tempo-item">
          <div class="tempo-label">節拍間隔</div>
          <div class="tempo-value" id="beatInterval">---</div>
        </div>
        <div class="tempo-item">
          <div class="tempo-label">倍速</div>
          <div class="tempo-value" id="doubleBpm">---</div>
        </div>
      </div>
      <div class="canvas-container">
        <canvas id="tempoCanvas"></canvas>
      </div>
    </div>

    <footer><p>所有處理均在本地完成</p></footer>
  </div>

  <script src="./bpm-detector.js"></script>
</body>
</html>
