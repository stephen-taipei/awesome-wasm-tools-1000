<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AUD-076 音訊頻譜分析 - WASM Tools</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      min-height: 100vh;
      color: #e0e0e0;
      padding: 20px;
    }
    .container { max-width: 900px; margin: 0 auto; }
    header {
      text-align: center;
      margin-bottom: 30px;
      padding: 20px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 16px;
    }
    h1 {
      font-size: 2rem;
      margin-bottom: 10px;
      background: linear-gradient(135deg, #00c6fb, #005bea);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .subtitle { color: #a0a0a0; }
    .lang-switcher { margin-top: 15px; }
    .lang-btn { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); color: #fff; padding: 5px 15px; margin: 0 5px; border-radius: 5px; cursor: pointer; }
    .upload-area { border: 2px dashed #4a4a6a; border-radius: 16px; padding: 60px 40px; text-align: center; cursor: pointer; transition: all 0.3s ease; background: rgba(255, 255, 255, 0.02); margin-bottom: 20px; }
    .upload-area:hover { border-color: #00c6fb; background: rgba(0, 198, 251, 0.05); }
    .upload-area.dragover { border-color: #00c6fb; background: rgba(0, 198, 251, 0.1); }
    .upload-icon { font-size: 4rem; margin-bottom: 20px; }
    .file-input { display: none; }
    .spectrum-container { background: rgba(255, 255, 255, 0.05); border-radius: 16px; padding: 20px; margin-bottom: 20px; display: none; }
    .spectrum-container.show { display: block; }
    #spectrumCanvas { width: 100%; height: 300px; background: #000; border-radius: 8px; }
    .controls { display: flex; gap: 15px; justify-content: center; margin-top: 15px; flex-wrap: wrap; }
    .btn { padding: 12px 25px; border: none; border-radius: 10px; font-size: 1rem; cursor: pointer; display: flex; align-items: center; gap: 8px; }
    .btn-primary { background: linear-gradient(135deg, #00c6fb, #005bea); color: white; }
    .btn-secondary { background: rgba(255, 255, 255, 0.1); color: #e0e0e0; border: 1px solid rgba(255, 255, 255, 0.2); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .info-panel { background: rgba(255, 255, 255, 0.05); border-radius: 16px; padding: 20px; margin-bottom: 20px; display: none; }
    .info-panel.show { display: block; }
    .info-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 15px; }
    .info-item { text-align: center; padding: 15px; background: rgba(255,255,255,0.03); border-radius: 10px; }
    .info-label { font-size: 0.85rem; color: #888; margin-bottom: 5px; }
    .info-value { font-size: 1.2rem; font-weight: 600; color: #00c6fb; }
    footer { text-align: center; padding: 20px; color: #666; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>AUD-076 音訊頻譜分析</h1>
      <p class="subtitle">即時視覺化音訊頻譜</p>
      <div class="lang-switcher">
        <button class="lang-btn" onclick="setLanguage('zh-TW')">繁中</button>
        <button class="lang-btn" onclick="setLanguage('en')">EN</button>
      </div>
    </header>

    <div class="upload-area" id="uploadArea">
      <div class="upload-icon">📊</div>
      <div class="upload-text">拖放音訊檔案到此處</div>
      <div class="upload-hint" style="color:#888;margin-top:10px;">支援 MP3, WAV, OGG 格式</div>
      <input type="file" id="fileInput" class="file-input" accept="audio/*">
    </div>

    <div class="info-panel" id="infoPanel">
      <div class="info-grid">
        <div class="info-item">
          <div class="info-label">檔案名稱</div>
          <div class="info-value" id="fileName">-</div>
        </div>
        <div class="info-item">
          <div class="info-label">時長</div>
          <div class="info-value" id="duration">-</div>
        </div>
        <div class="info-item">
          <div class="info-label">取樣率</div>
          <div class="info-value" id="sampleRate">-</div>
        </div>
        <div class="info-item">
          <div class="info-label">峰值頻率</div>
          <div class="info-value" id="peakFreq">-</div>
        </div>
      </div>
    </div>

    <div class="spectrum-container" id="spectrumContainer">
      <canvas id="spectrumCanvas"></canvas>
      <div class="controls">
        <button class="btn btn-primary" id="playBtn" disabled>
          <span>▶️</span> 播放
        </button>
        <button class="btn btn-secondary" id="pauseBtn" disabled>
          <span>⏸️</span> 暫停
        </button>
        <button class="btn btn-secondary" id="stopBtn" disabled>
          <span>⏹️</span> 停止
        </button>
      </div>
    </div>

    <footer>
      <p>所有處理均在本地完成</p>
    </footer>
  </div>

  <script src="./spectrum-analyzer.js"></script>
</body>
</html>
