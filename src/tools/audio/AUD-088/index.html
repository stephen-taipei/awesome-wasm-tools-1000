<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AUD-088 音訊片段循環 - WASM Tools</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: linear-gradient(135deg, #1a1a2e, #16213e); min-height: 100vh; color: #e0e0e0; padding: 20px; }
    .container { max-width: 900px; margin: 0 auto; }
    header { text-align: center; margin-bottom: 30px; padding: 20px; background: rgba(255,255,255,0.05); border-radius: 16px; }
    h1 { font-size: 2rem; margin-bottom: 10px; background: linear-gradient(135deg, #f59e0b, #fbbf24); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .subtitle { color: #a0a0a0; }
    .upload-area { border: 2px dashed #4a4a6a; border-radius: 16px; padding: 40px; text-align: center; cursor: pointer; background: rgba(255,255,255,0.02); margin-bottom: 20px; }
    .upload-area:hover { border-color: #f59e0b; }
    .upload-icon { font-size: 3rem; margin-bottom: 15px; }
    .file-input { display: none; }
    .settings-panel { background: rgba(255,255,255,0.05); border-radius: 16px; padding: 25px; margin-bottom: 20px; display: none; }
    .settings-panel.show { display: block; }
    .settings-title { font-size: 1.1rem; margin-bottom: 20px; color: #f59e0b; }
    .setting-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 15px; }
    .setting-label { font-weight: 500; }
    input[type="range"], input[type="number"] { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); border-radius: 8px; padding: 8px; color: #e0e0e0; }
    input[type="range"] { width: 200px; }
    input[type="number"] { width: 80px; text-align: center; }
    .value-display { min-width: 80px; text-align: center; color: #f59e0b; }
    .action-buttons { display: flex; gap: 15px; justify-content: center; margin-bottom: 20px; }
    .btn { padding: 15px 35px; border: none; border-radius: 12px; font-size: 1rem; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 10px; }
    .btn-primary { background: linear-gradient(135deg, #f59e0b, #fbbf24); color: #111; }
    .btn-success { background: linear-gradient(135deg, #10b981, #059669); color: white; }
    .btn:disabled { opacity: 0.5; }
    .result-panel { background: rgba(16,185,129,0.1); border: 1px solid rgba(16,185,129,0.3); border-radius: 16px; padding: 25px; margin-bottom: 20px; display: none; }
    .result-panel.show { display: block; }
    .result-title { color: #10b981; font-size: 1.2rem; margin-bottom: 15px; }
    .audio-player { width: 100%; margin-top: 15px; }
    footer { text-align: center; padding: 20px; color: #666; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>AUD-088 音訊片段循環</h1>
      <p class="subtitle">將音訊片段循環重複指定次數</p>
    </header>

    <div class="upload-area" id="uploadArea">
      <div class="upload-icon">🔁</div>
      <div>拖放音訊檔案到此處</div>
      <div style="color:#888;margin-top:10px;">支援 MP3, WAV, OGG 格式</div>
      <input type="file" id="fileInput" class="file-input" accept="audio/*">
    </div>

    <div class="settings-panel" id="settingsPanel">
      <div class="settings-title">循環設定</div>
      <div class="setting-row">
        <span class="setting-label">循環次數</span>
        <div style="display:flex;align-items:center;gap:15px;">
          <input type="range" id="loopCount" min="2" max="20" value="4">
          <span class="value-display" id="loopValue">4 次</span>
        </div>
      </div>
      <div class="setting-row">
        <span class="setting-label">淡入淡出 (ms)</span>
        <input type="number" id="crossfade" value="50" min="0" max="500">
      </div>
    </div>

    <div class="action-buttons">
      <button class="btn btn-primary" id="processBtn" disabled><span>🔄</span> 生成循環</button>
      <button class="btn btn-success" id="downloadBtn" style="display:none;"><span>⬇️</span> 下載檔案</button>
    </div>

    <div class="result-panel" id="resultPanel">
      <div class="result-title">✅ 循環生成完成</div>
      <div id="resultInfo" style="margin-bottom:15px;color:#888;"></div>
      <audio id="audioPreview" class="audio-player" controls></audio>
    </div>

    <footer><p>所有處理均在本地完成</p></footer>
  </div>

  <script src="./audio-looper.js"></script>
</body>
</html>
