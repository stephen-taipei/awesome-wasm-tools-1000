<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TXT-039 CSV 轉 JSON - Awesome WASM Tools 1000</title>
  <meta name="description" content="將 CSV 格式轉換為 JSON 格式">
  <link rel="stylesheet" href="/src/styles/global.css">
</head>
<body>
  <div class="tool-page">
    <header class="tool-header">
      <a href="/index.html" class="back-btn">
        <span>←</span>
        <span data-i18n="back">返回</span>
      </a>
      <div class="tool-title">
        <h1>TXT-039 <span data-i18n="txt039_name">CSV 轉 JSON</span></h1>
        <p data-i18n="txt039_desc">將 CSV 格式轉換為 JSON 格式</p>
      </div>
      <div class="lang-switcher">
        <button onclick="setLanguage('zh-TW')" class="lang-btn">繁中</button>
        <button onclick="setLanguage('en')" class="lang-btn">EN</button>
      </div>
    </header>

    <main class="tool-content">
      <div id="statusMessage" class="status-message"></div>

      <div class="input-section">
        <h3 data-i18n="input_csv">輸入 CSV</h3>
        <textarea id="inputText" class="text-input code-input" rows="10" placeholder="name,age,city
John,30,New York"></textarea>
      </div>

      <div class="settings-panel">
        <h3 data-i18n="settings">設定</h3>
        <div class="setting-row">
          <label data-i18n="delimiter">分隔符</label>
          <select id="delimiter">
            <option value=",">逗號 (,)</option>
            <option value=";">分號 (;)</option>
            <option value="\t">Tab</option>
          </select>
        </div>
        <div class="setting-row">
          <label data-i18n="output_format">輸出格式</label>
          <select id="outputFormat">
            <option value="objects">物件陣列</option>
            <option value="arrays">二維陣列</option>
          </select>
        </div>
      </div>

      <div class="action-buttons">
        <button id="convertBtn" class="btn btn-primary">
          <span>🔄</span>
          <span data-i18n="convert">轉換</span>
        </button>
        <button id="copyBtn" class="btn btn-success" style="display: none;">
          <span>📋</span>
          <span data-i18n="copy">複製</span>
        </button>
        <button id="clearBtn" class="btn btn-secondary">
          <span>🗑️</span>
          <span data-i18n="clear">清除</span>
        </button>
      </div>

      <div id="resultArea" class="result-area" style="display: none;">
        <h3 data-i18n="json_output">JSON 輸出</h3>
        <pre id="outputText" class="code-output"></pre>
      </div>
    </main>

    <footer class="footer">
      <p data-i18n="footer_privacy">所有檔案處理均在本地完成，不會上傳到伺服器</p>
    </footer>
  </div>

  <script type="module" src="/src/i18n/i18n.js"></script>
  <script type="module" src="./csv2json.js"></script>
</body>
</html>
