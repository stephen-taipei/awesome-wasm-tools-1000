<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TXT-002 詞頻分析 - Awesome WASM Tools 1000</title>
  <meta name="description" content="分析文字中各單詞出現的頻率，產生詞頻統計表">
  <link rel="stylesheet" href="/src/styles/global.css">
</head>
<body>
  <div class="tool-page">
    <header class="tool-header">
      <a href="/index.html" class="back-btn">
        <span>←</span>
        <span data-i18n="back">返回</span>
      </a>
      <div class="tool-title">
        <h1>TXT-002 <span data-i18n="txt002_name">詞頻分析</span></h1>
        <p data-i18n="txt002_desc">分析文字中各單詞出現的頻率</p>
      </div>
      <div class="lang-switcher">
        <button onclick="setLanguage('zh-TW')" class="lang-btn">繁中</button>
        <button onclick="setLanguage('en')" class="lang-btn">EN</button>
      </div>
    </header>

    <main class="tool-content">
      <div id="statusMessage" class="status-message"></div>

      <div class="input-section">
        <h3 data-i18n="input_text">輸入文字</h3>
        <textarea id="inputText" class="text-input" rows="8" placeholder="在此輸入或貼上文字..."></textarea>
      </div>

      <div class="settings-panel">
        <h3 data-i18n="settings">設定</h3>
        <div class="setting-row">
          <label data-i18n="min_length">最小長度</label>
          <input type="number" id="minLength" value="1" min="1" max="20">
        </div>
        <div class="setting-row">
          <label data-i18n="top_n">顯示前 N 個</label>
          <input type="number" id="topN" value="50" min="1" max="500">
        </div>
        <div class="setting-row">
          <label data-i18n="case_sensitive">區分大小寫</label>
          <input type="checkbox" id="caseSensitive">
        </div>
      </div>

      <div class="action-buttons">
        <button id="analyzeBtn" class="btn btn-primary">
          <span>📊</span>
          <span data-i18n="analyze">分析</span>
        </button>
        <button id="exportBtn" class="btn btn-success" style="display: none;">
          <span>⬇️</span>
          <span data-i18n="export_csv">匯出 CSV</span>
        </button>
        <button id="clearBtn" class="btn btn-secondary">
          <span>🗑️</span>
          <span data-i18n="clear">清除</span>
        </button>
      </div>

      <div id="resultArea" class="result-area" style="display: none;">
        <h3 data-i18n="frequency_result">詞頻結果</h3>
        <div class="stats-summary">
          <span>總詞數: <strong id="totalWords">0</strong></span>
          <span>不重複詞: <strong id="uniqueWords">0</strong></span>
        </div>
        <table class="data-table">
          <thead>
            <tr>
              <th data-i18n="rank">排名</th>
              <th data-i18n="word">單詞</th>
              <th data-i18n="count">次數</th>
              <th data-i18n="percentage">百分比</th>
            </tr>
          </thead>
          <tbody id="frequencyTable"></tbody>
        </table>
      </div>
    </main>

    <footer class="footer">
      <p data-i18n="footer_privacy">所有檔案處理均在本地完成，不會上傳到伺服器</p>
    </footer>
  </div>

  <script type="module" src="/src/i18n/i18n.js"></script>
  <script type="module" src="./frequency.js"></script>
</body>
</html>
