<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TXT-041 Markdown 預覽 - Awesome WASM Tools 1000</title>
  <meta name="description" content="即時預覽 Markdown 文件">
  <link rel="stylesheet" href="/src/styles/global.css">
</head>
<body>
  <div class="tool-page">
    <header class="tool-header">
      <a href="/index.html" class="back-btn">
        <span>←</span>
        <span data-i18n="back">返回</span>
      </a>
      <div class="tool-title">
        <h1>TXT-041 <span data-i18n="txt041_name">Markdown 預覽</span></h1>
        <p data-i18n="txt041_desc">即時預覽 Markdown 文件</p>
      </div>
      <div class="lang-switcher">
        <button onclick="setLanguage('zh-TW')" class="lang-btn">繁中</button>
        <button onclick="setLanguage('en')" class="lang-btn">EN</button>
      </div>
    </header>

    <main class="tool-content">
      <div id="statusMessage" class="status-message"></div>

      <div class="split-view">
        <div class="editor-pane">
          <h3 data-i18n="markdown_input">Markdown 輸入</h3>
          <textarea id="inputText" class="text-input code-input" rows="20" placeholder="# 標題

**粗體** *斜體*

- 列表項目
- 列表項目

[連結](https://example.com)"></textarea>
        </div>
        <div class="preview-pane">
          <h3 data-i18n="preview">預覽</h3>
          <div id="previewArea" class="markdown-preview"></div>
        </div>
      </div>

      <div class="action-buttons">
        <button id="copyHtmlBtn" class="btn btn-success">
          <span>📋</span>
          <span data-i18n="copy_html">複製 HTML</span>
        </button>
        <button id="clearBtn" class="btn btn-secondary">
          <span>🗑️</span>
          <span data-i18n="clear">清除</span>
        </button>
      </div>
    </main>

    <footer class="footer">
      <p data-i18n="footer_privacy">所有檔案處理均在本地完成，不會上傳到伺服器</p>
    </footer>
  </div>

  <script type="module" src="/src/i18n/i18n.js"></script>
  <script type="module" src="./markdown.js"></script>
</body>
</html>
