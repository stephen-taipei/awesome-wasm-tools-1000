<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TXT-048 JSON Schema 驗證 - Awesome WASM Tools 1000</title>
  <meta name="description" content="使用 JSON Schema 驗證 JSON 資料">
  <link rel="stylesheet" href="/src/styles/global.css">
</head>
<body>
  <div class="tool-page">
    <header class="tool-header">
      <a href="/index.html" class="back-btn">
        <span>←</span>
        <span data-i18n="back">返回</span>
      </a>
      <div class="tool-title">
        <h1>TXT-048 <span data-i18n="txt048_name">JSON Schema 驗證</span></h1>
        <p data-i18n="txt048_desc">使用 JSON Schema 驗證 JSON 資料</p>
      </div>
      <div class="lang-switcher">
        <button onclick="setLanguage('zh-TW')" class="lang-btn">繁中</button>
        <button onclick="setLanguage('en')" class="lang-btn">EN</button>
      </div>
    </header>

    <main class="tool-content">
      <div id="statusMessage" class="status-message"></div>

      <div class="split-view">
        <div class="input-section">
          <h3 data-i18n="json_schema">JSON Schema</h3>
          <textarea id="schemaText" class="text-input code-input" rows="12" placeholder='{
  "type": "object",
  "properties": {
    "name": { "type": "string" },
    "age": { "type": "number" }
  },
  "required": ["name"]
}'></textarea>
        </div>
        <div class="input-section">
          <h3 data-i18n="json_data">JSON 資料</h3>
          <textarea id="dataText" class="text-input code-input" rows="12" placeholder='{
  "name": "John",
  "age": 30
}'></textarea>
        </div>
      </div>

      <div class="action-buttons">
        <button id="validateBtn" class="btn btn-primary">
          <span>✓</span>
          <span data-i18n="validate">驗證</span>
        </button>
        <button id="clearBtn" class="btn btn-secondary">
          <span>🗑️</span>
          <span data-i18n="clear">清除</span>
        </button>
      </div>

      <div id="resultArea" class="result-area" style="display: none;">
        <h3 data-i18n="validation_result">驗證結果</h3>
        <div id="resultContent" class="result-content"></div>
      </div>
    </main>

    <footer class="footer">
      <p data-i18n="footer_privacy">所有檔案處理均在本地完成，不會上傳到伺服器</p>
    </footer>
  </div>

  <script type="module" src="/src/i18n/i18n.js"></script>
  <script type="module" src="./jsonschema.js"></script>
</body>
</html>
