<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TXT-092 文字列表化 - Awesome WASM Tools 1000</title>
  <meta name="description" content="將文字轉換為各種列表格式">
  <link rel="stylesheet" href="/src/styles/global.css">
</head>
<body>
  <div class="tool-page">
    <header class="tool-header">
      <a href="/index.html" class="back-btn">
        <span>←</span>
        <span data-i18n="back">返回</span>
      </a>
      <div class="tool-title">
        <h1>TXT-092 <span data-i18n="txt092_name">文字列表化</span></h1>
        <p data-i18n="txt092_desc">將文字轉換為各種列表格式</p>
      </div>
      <div class="lang-switcher">
        <button onclick="setLanguage('zh-TW')" class="lang-btn">繁中</button>
        <button onclick="setLanguage('en')" class="lang-btn">EN</button>
      </div>
    </header>

    <main class="tool-content">
      <div id="statusMessage" class="status-message"></div>

      <div class="input-section">
        <h3 data-i18n="input_text">輸入項目 (每行一個)</h3>
        <textarea id="inputText" class="text-input" rows="8" placeholder="輸入項目，每行一個..."></textarea>
      </div>

      <div class="options-section">
        <h3 data-i18n="list_style">列表樣式</h3>
        <select id="listStyle" class="select-input">
          <option value="bullet">符號列表 (• )</option>
          <option value="dash">破折號列表 (- )</option>
          <option value="number">數字列表 (1. )</option>
          <option value="letter">字母列表 (a. )</option>
          <option value="roman">羅馬數字 (i. )</option>
          <option value="checkbox">核取方塊 ([ ] )</option>
          <option value="arrow">箭頭列表 (→ )</option>
          <option value="star">星號列表 (* )</option>
        </select>
      </div>

      <div class="action-buttons">
        <button id="convertBtn" class="btn btn-primary">
          <span>📋</span>
          <span data-i18n="convert">轉換</span>
        </button>
        <button id="clearBtn" class="btn btn-secondary">
          <span>🗑️</span>
          <span data-i18n="clear">清除</span>
        </button>
      </div>

      <div id="resultArea" class="result-area" style="display: none;">
        <h3 data-i18n="result">列表結果</h3>
        <textarea id="outputText" class="text-input" rows="8" readonly></textarea>
        <button id="copyBtn" class="btn btn-secondary">
          <span>📋</span>
          <span data-i18n="copy">複製</span>
        </button>
      </div>
    </main>

    <footer class="footer">
      <p data-i18n="footer_privacy">所有檔案處理均在本地完成，不會上傳到伺服器</p>
    </footer>
  </div>

  <script type="module" src="/src/i18n/i18n.js"></script>
  <script type="module" src="./text-lister.js"></script>
</body>
</html>
