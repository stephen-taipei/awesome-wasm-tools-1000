<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TXT-063 國際音標輸入 - Awesome WASM Tools 1000</title>
  <meta name="description" content="方便輸入 IPA 國際音標符號">
  <link rel="stylesheet" href="/src/styles/global.css">
</head>
<body>
  <div class="tool-page">
    <header class="tool-header">
      <a href="/index.html" class="back-btn">
        <span>←</span>
        <span data-i18n="back">返回</span>
      </a>
      <div class="tool-title">
        <h1>TXT-063 <span data-i18n="txt063_name">國際音標輸入</span></h1>
        <p data-i18n="txt063_desc">方便輸入 IPA 國際音標符號</p>
      </div>
      <div class="lang-switcher">
        <button onclick="setLanguage('zh-TW')" class="lang-btn">繁中</button>
        <button onclick="setLanguage('en')" class="lang-btn">EN</button>
      </div>
    </header>

    <main class="tool-content">
      <div id="statusMessage" class="status-message"></div>

      <div class="input-section">
        <h3 data-i18n="ipa_text">IPA 文字</h3>
        <textarea id="ipaText" class="text-input ipa-input" rows="4" placeholder="點擊下方符號輸入 IPA..."></textarea>
        <div class="action-buttons">
          <button id="copyBtn" class="btn btn-secondary">
            <span>📋</span>
            <span data-i18n="copy">複製</span>
          </button>
          <button id="clearBtn" class="btn btn-secondary">
            <span>🗑️</span>
            <span data-i18n="clear">清除</span>
          </button>
        </div>
      </div>

      <div class="ipa-sections">
        <div class="ipa-section">
          <h4 data-i18n="consonants">輔音 (子音)</h4>
          <div class="ipa-grid" id="consonants"></div>
        </div>

        <div class="ipa-section">
          <h4 data-i18n="vowels">元音 (母音)</h4>
          <div class="ipa-grid" id="vowels"></div>
        </div>

        <div class="ipa-section">
          <h4 data-i18n="diacritics">變音符號</h4>
          <div class="ipa-grid" id="diacritics"></div>
        </div>

        <div class="ipa-section">
          <h4 data-i18n="suprasegmentals">超音段</h4>
          <div class="ipa-grid" id="suprasegmentals"></div>
        </div>

        <div class="ipa-section">
          <h4 data-i18n="tones">聲調</h4>
          <div class="ipa-grid" id="tones"></div>
        </div>
      </div>
    </main>

    <footer class="footer">
      <p data-i18n="footer_privacy">所有檔案處理均在本地完成，不會上傳到伺服器</p>
    </footer>
  </div>

  <script type="module" src="/src/i18n/i18n.js"></script>
  <script type="module" src="./ipa-input.js"></script>
</body>
</html>
