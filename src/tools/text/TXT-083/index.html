<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TXT-083 程式碼差異 - Awesome WASM Tools 1000</title>
  <meta name="description" content="比較兩段程式碼的差異">
  <link rel="stylesheet" href="/src/styles/global.css">
</head>
<body>
  <div class="tool-page">
    <header class="tool-header">
      <a href="/index.html" class="back-btn">
        <span>←</span>
        <span data-i18n="back">返回</span>
      </a>
      <div class="tool-title">
        <h1>TXT-083 <span data-i18n="txt083_name">程式碼差異</span></h1>
        <p data-i18n="txt083_desc">比較兩段程式碼的差異</p>
      </div>
      <div class="lang-switcher">
        <button onclick="setLanguage('zh-TW')" class="lang-btn">繁中</button>
        <button onclick="setLanguage('en')" class="lang-btn">EN</button>
      </div>
    </header>

    <main class="tool-content">
      <div id="statusMessage" class="status-message"></div>

      <div class="diff-input-container">
        <div class="input-section">
          <h3 data-i18n="original">原始版本</h3>
          <textarea id="originalCode" class="text-input code-input" rows="12" placeholder="貼上原始程式碼..."></textarea>
        </div>
        <div class="input-section">
          <h3 data-i18n="modified">修改版本</h3>
          <textarea id="modifiedCode" class="text-input code-input" rows="12" placeholder="貼上修改後的程式碼..."></textarea>
        </div>
      </div>

      <div class="action-buttons">
        <button id="compareBtn" class="btn btn-primary">
          <span>🔍</span>
          <span data-i18n="compare">比較</span>
        </button>
        <button id="clearBtn" class="btn btn-secondary">
          <span>🗑️</span>
          <span data-i18n="clear">清除</span>
        </button>
      </div>

      <div id="resultArea" class="result-area" style="display: none;">
        <h3 data-i18n="result">差異結果</h3>
        <div class="diff-stats">
          <span class="diff-added">+<span id="addedCount">0</span> 新增</span>
          <span class="diff-removed">-<span id="removedCount">0</span> 刪除</span>
        </div>
        <pre id="diffOutput" class="diff-output"></pre>
      </div>
    </main>

    <footer class="footer">
      <p data-i18n="footer_privacy">所有檔案處理均在本地完成，不會上傳到伺服器</p>
    </footer>
  </div>

  <script type="module" src="/src/i18n/i18n.js"></script>
  <script type="module" src="./code-diff.js"></script>
</body>
</html>
