<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TXT-009 行號添加/移除 - Awesome WASM Tools 1000</title>
  <meta name="description" content="為文字添加或移除行號">
  <link rel="stylesheet" href="/src/styles/global.css">
</head>
<body>
  <div class="tool-page">
    <header class="tool-header">
      <a href="/index.html" class="back-btn">
        <span>←</span>
        <span data-i18n="back">返回</span>
      </a>
      <div class="tool-title">
        <h1>TXT-009 <span data-i18n="txt009_name">行號添加/移除</span></h1>
        <p data-i18n="txt009_desc">為文字添加或移除行號</p>
      </div>
      <div class="lang-switcher">
        <button onclick="setLanguage('zh-TW')" class="lang-btn">繁中</button>
        <button onclick="setLanguage('en')" class="lang-btn">EN</button>
      </div>
    </header>

    <main class="tool-content">
      <div id="statusMessage" class="status-message"></div>

      <div class="input-section">
        <h3 data-i18n="input_text">輸入文字</h3>
        <textarea id="inputText" class="text-input" rows="10" placeholder="輸入文字..."></textarea>
      </div>

      <div class="settings-panel">
        <h3 data-i18n="settings">設定</h3>
        <div class="setting-row">
          <label data-i18n="start_number">起始行號</label>
          <input type="number" id="startNumber" value="1" min="0">
        </div>
        <div class="setting-row">
          <label data-i18n="separator">分隔符</label>
          <select id="separator">
            <option value=". ">. (點+空格)</option>
            <option value=": ">: (冒號+空格)</option>
            <option value=") ">) (括號+空格)</option>
            <option value="\t">Tab</option>
            <option value="  ">雙空格</option>
            <option value=" | "> | (管道符)</option>
          </select>
        </div>
        <div class="setting-row">
          <label data-i18n="padding">行號補零</label>
          <input type="checkbox" id="padding">
        </div>
        <div class="setting-row">
          <label data-i18n="skip_empty">跳過空行</label>
          <input type="checkbox" id="skipEmpty">
        </div>
      </div>

      <div class="action-buttons">
        <button id="addBtn" class="btn btn-primary">
          <span>➕</span>
          <span data-i18n="add_line_numbers">添加行號</span>
        </button>
        <button id="removeBtn" class="btn btn-warning">
          <span>➖</span>
          <span data-i18n="remove_line_numbers">移除行號</span>
        </button>
        <button id="copyBtn" class="btn btn-success" style="display: none;">
          <span>📋</span>
          <span data-i18n="copy">複製結果</span>
        </button>
        <button id="clearBtn" class="btn btn-secondary">
          <span>🗑️</span>
          <span data-i18n="clear">清除</span>
        </button>
      </div>

      <div id="resultArea" class="result-area" style="display: none;">
        <h3 data-i18n="result">結果</h3>
        <textarea id="outputText" class="text-input" rows="10" readonly></textarea>
      </div>
    </main>

    <footer class="footer">
      <p data-i18n="footer_privacy">所有檔案處理均在本地完成，不會上傳到伺服器</p>
    </footer>
  </div>

  <script type="module" src="/src/i18n/i18n.js"></script>
  <script type="module" src="./linenumber.js"></script>
</body>
</html>
