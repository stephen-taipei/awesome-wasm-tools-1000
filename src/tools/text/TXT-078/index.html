<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TXT-078 文字統計報告 - Awesome WASM Tools 1000</title>
  <meta name="description" content="生成完整的文字統計分析報告">
  <link rel="stylesheet" href="/src/styles/global.css">
</head>
<body>
  <div class="tool-page">
    <header class="tool-header">
      <a href="/index.html" class="back-btn">
        <span>←</span>
        <span data-i18n="back">返回</span>
      </a>
      <div class="tool-title">
        <h1>TXT-078 <span data-i18n="txt078_name">文字統計報告</span></h1>
        <p data-i18n="txt078_desc">生成完整的文字統計分析報告</p>
      </div>
      <div class="lang-switcher">
        <button onclick="setLanguage('zh-TW')" class="lang-btn">繁中</button>
        <button onclick="setLanguage('en')" class="lang-btn">EN</button>
      </div>
    </header>

    <main class="tool-content">
      <div id="statusMessage" class="status-message"></div>

      <div class="input-section">
        <h3 data-i18n="input_text">輸入文字</h3>
        <textarea id="inputText" class="text-input" rows="10" placeholder="輸入要分析的文字..."></textarea>
      </div>

      <div class="action-buttons">
        <button id="generateBtn" class="btn btn-primary">
          <span>📊</span>
          <span data-i18n="generate_report">生成報告</span>
        </button>
        <button id="clearBtn" class="btn btn-secondary">
          <span>🗑️</span>
          <span data-i18n="clear">清除</span>
        </button>
      </div>

      <div id="resultArea" class="result-area" style="display: none;">
        <h3 data-i18n="report">統計報告</h3>

        <div class="report-section">
          <h4>基本統計</h4>
          <div class="stats-grid" id="basicStats"></div>
        </div>

        <div class="report-section">
          <h4>字元分析</h4>
          <div class="stats-grid" id="charStats"></div>
        </div>

        <div class="report-section">
          <h4>最常出現的單詞</h4>
          <div id="topWords" class="word-list"></div>
        </div>

        <div class="report-section">
          <h4>最常出現的字元</h4>
          <div id="topChars" class="char-list"></div>
        </div>
      </div>
    </main>

    <footer class="footer">
      <p data-i18n="footer_privacy">所有檔案處理均在本地完成，不會上傳到伺服器</p>
    </footer>
  </div>

  <script type="module" src="/src/i18n/i18n.js"></script>
  <script type="module" src="./text-report.js"></script>
</body>
</html>
