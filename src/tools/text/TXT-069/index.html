<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TXT-069 文字混淆處理 - Awesome WASM Tools 1000</title>
  <meta name="description" content="將文字轉換為混淆形式，使用相似字元替換">
  <link rel="stylesheet" href="/src/styles/global.css">
</head>
<body>
  <div class="tool-page">
    <header class="tool-header">
      <a href="/index.html" class="back-btn">
        <span>←</span>
        <span data-i18n="back">返回</span>
      </a>
      <div class="tool-title">
        <h1>TXT-069 <span data-i18n="txt069_name">文字混淆處理</span></h1>
        <p data-i18n="txt069_desc">將文字轉換為混淆形式，使用相似字元替換</p>
      </div>
      <div class="lang-switcher">
        <button onclick="setLanguage('zh-TW')" class="lang-btn">繁中</button>
        <button onclick="setLanguage('en')" class="lang-btn">EN</button>
      </div>
    </header>

    <main class="tool-content">
      <div id="statusMessage" class="status-message"></div>

      <div class="input-section">
        <h3 data-i18n="input_text">輸入文字</h3>
        <textarea id="inputText" class="text-input" rows="6" placeholder="在此輸入要混淆的文字..."></textarea>
      </div>

      <div class="options-section">
        <h3 data-i18n="obfuscation_type">混淆類型</h3>
        <div class="checkbox-group">
          <label class="checkbox-label">
            <input type="checkbox" id="homoglyphs" checked>
            <span>同形字替換 (Homoglyphs)</span>
          </label>
          <label class="checkbox-label">
            <input type="checkbox" id="zalgo">
            <span>Zalgo 文字</span>
          </label>
          <label class="checkbox-label">
            <input type="checkbox" id="fullwidth">
            <span>全形字元</span>
          </label>
          <label class="checkbox-label">
            <input type="checkbox" id="upsidedown">
            <span>顛倒文字</span>
          </label>
        </div>
      </div>

      <div class="action-buttons">
        <button id="obfuscateBtn" class="btn btn-primary">
          <span>🔮</span>
          <span data-i18n="obfuscate">混淆</span>
        </button>
        <button id="clearBtn" class="btn btn-secondary">
          <span>🗑️</span>
          <span data-i18n="clear">清除</span>
        </button>
      </div>

      <div id="resultArea" class="result-area" style="display: none;">
        <h3 data-i18n="result">混淆結果</h3>
        <textarea id="outputText" class="text-input" rows="6" readonly></textarea>
        <button id="copyBtn" class="btn btn-secondary">
          <span>📋</span>
          <span data-i18n="copy">複製</span>
        </button>
      </div>
    </main>

    <footer class="footer">
      <p data-i18n="footer_privacy">所有檔案處理均在本地完成，不會上傳到伺服器</p>
    </footer>
  </div>

  <script type="module" src="/src/i18n/i18n.js"></script>
  <script type="module" src="./text-obfuscator.js"></script>
</body>
</html>
