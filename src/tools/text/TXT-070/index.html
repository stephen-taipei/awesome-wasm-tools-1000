<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TXT-070 文字去混淆 - Awesome WASM Tools 1000</title>
  <meta name="description" content="將混淆的文字還原為正常形式">
  <link rel="stylesheet" href="/src/styles/global.css">
</head>
<body>
  <div class="tool-page">
    <header class="tool-header">
      <a href="/index.html" class="back-btn">
        <span>←</span>
        <span data-i18n="back">返回</span>
      </a>
      <div class="tool-title">
        <h1>TXT-070 <span data-i18n="txt070_name">文字去混淆</span></h1>
        <p data-i18n="txt070_desc">將混淆的文字還原為正常形式</p>
      </div>
      <div class="lang-switcher">
        <button onclick="setLanguage('zh-TW')" class="lang-btn">繁中</button>
        <button onclick="setLanguage('en')" class="lang-btn">EN</button>
      </div>
    </header>

    <main class="tool-content">
      <div id="statusMessage" class="status-message"></div>

      <div class="input-section">
        <h3 data-i18n="input_text">輸入混淆文字</h3>
        <textarea id="inputText" class="text-input" rows="6" placeholder="在此貼上混淆的文字..."></textarea>
      </div>

      <div class="action-buttons">
        <button id="deobfuscateBtn" class="btn btn-primary">
          <span>🔍</span>
          <span data-i18n="deobfuscate">去混淆</span>
        </button>
        <button id="clearBtn" class="btn btn-secondary">
          <span>🗑️</span>
          <span data-i18n="clear">清除</span>
        </button>
      </div>

      <div id="resultArea" class="result-area" style="display: none;">
        <h3 data-i18n="result">還原結果</h3>
        <textarea id="outputText" class="text-input" rows="6" readonly></textarea>
        <div class="stats-row">
          <span data-i18n="chars_removed">移除的字元數:</span>
          <span id="removedCount">0</span>
        </div>
        <button id="copyBtn" class="btn btn-secondary">
          <span>📋</span>
          <span data-i18n="copy">複製</span>
        </button>
      </div>
    </main>

    <footer class="footer">
      <p data-i18n="footer_privacy">所有檔案處理均在本地完成，不會上傳到伺服器</p>
    </footer>
  </div>

  <script type="module" src="/src/i18n/i18n.js"></script>
  <script type="module" src="./text-deobfuscator.js"></script>
</body>
</html>
