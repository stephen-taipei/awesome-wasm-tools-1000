<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TXT-053 Unicode 正規化 - Awesome WASM Tools 1000</title>
  <meta name="description" content="將文字轉換為 Unicode 正規化形式 (NFC, NFD, NFKC, NFKD)">
  <link rel="stylesheet" href="/src/styles/global.css">
</head>
<body>
  <div class="tool-page">
    <header class="tool-header">
      <a href="/index.html" class="back-btn">
        <span>←</span>
        <span data-i18n="back">返回</span>
      </a>
      <div class="tool-title">
        <h1>TXT-053 <span data-i18n="txt053_name">Unicode 正規化</span></h1>
        <p data-i18n="txt053_desc">將文字轉換為 Unicode 正規化形式 (NFC, NFD, NFKC, NFKD)</p>
      </div>
      <div class="lang-switcher">
        <button onclick="setLanguage('zh-TW')" class="lang-btn">繁中</button>
        <button onclick="setLanguage('en')" class="lang-btn">EN</button>
      </div>
    </header>

    <main class="tool-content">
      <div id="statusMessage" class="status-message"></div>

      <div class="input-section">
        <h3 data-i18n="input_text">輸入文字</h3>
        <textarea id="inputText" class="text-input" rows="6" placeholder="在此輸入文字..."></textarea>
      </div>

      <div class="options-section">
        <h3 data-i18n="normalization_form">正規化形式</h3>
        <div class="radio-group">
          <label class="radio-label">
            <input type="radio" name="normForm" value="NFC" checked>
            <span>NFC (Canonical Composition)</span>
          </label>
          <label class="radio-label">
            <input type="radio" name="normForm" value="NFD">
            <span>NFD (Canonical Decomposition)</span>
          </label>
          <label class="radio-label">
            <input type="radio" name="normForm" value="NFKC">
            <span>NFKC (Compatibility Composition)</span>
          </label>
          <label class="radio-label">
            <input type="radio" name="normForm" value="NFKD">
            <span>NFKD (Compatibility Decomposition)</span>
          </label>
        </div>
      </div>

      <div class="action-buttons">
        <button id="normalizeBtn" class="btn btn-primary">
          <span>🔄</span>
          <span data-i18n="normalize">正規化</span>
        </button>
        <button id="clearBtn" class="btn btn-secondary">
          <span>🗑️</span>
          <span data-i18n="clear">清除</span>
        </button>
      </div>

      <div id="resultArea" class="result-area" style="display: none;">
        <h3 data-i18n="result">結果</h3>
        <textarea id="outputText" class="text-input" rows="6" readonly></textarea>
        <div class="stats-row">
          <span data-i18n="original_length">原始長度:</span>
          <span id="originalLength">0</span>
          <span data-i18n="normalized_length">正規化後長度:</span>
          <span id="normalizedLength">0</span>
        </div>
        <button id="copyBtn" class="btn btn-secondary">
          <span>📋</span>
          <span data-i18n="copy">複製結果</span>
        </button>
      </div>
    </main>

    <footer class="footer">
      <p data-i18n="footer_privacy">所有檔案處理均在本地完成，不會上傳到伺服器</p>
    </footer>
  </div>

  <script type="module" src="/src/i18n/i18n.js"></script>
  <script type="module" src="./unicode-normalize.js"></script>
</body>
</html>
