<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TXT-121 文字清理 - Awesome WASM Tools 1000</title>
  <meta name="description" content="清理特殊字元">
  <link rel="stylesheet" href="/src/styles/global.css">
</head>
<body>
  <div class="tool-page">
    <header class="tool-header">
      <a href="/index.html" class="back-btn"><span>←</span><span data-i18n="back">返回</span></a>
      <div class="tool-title">
        <h1>TXT-121 <span>文字清理</span></h1>
        <p>清理特殊字元</p>
      </div>
      <div class="lang-switcher">
        <button onclick="setLanguage('zh-TW')" class="lang-btn">繁中</button>
        <button onclick="setLanguage('en')" class="lang-btn">EN</button>
      </div>
    </header>
    <main class="tool-content">
      <div id="statusMessage" class="status-message"></div>
      <div class="input-section">
        <h3>輸入文字</h3>
        <textarea id="inputText" class="text-input" rows="8" placeholder="輸入要處理的文字..."></textarea>
      </div>
      <div class="action-buttons">
        <button id="processBtn" class="btn btn-primary"><span>⚙️</span><span>處理</span></button>
        <button id="clearBtn" class="btn btn-secondary"><span>🗑️</span><span>清除</span></button>
      </div>
      <div id="resultArea" class="result-area" style="display: none;">
        <h3>結果</h3>
        <textarea id="outputText" class="text-input" rows="8" readonly></textarea>
        <div class="result-actions">
          <button id="copyBtn" class="btn btn-secondary"><span>📋</span><span>複製</span></button>
        </div>
      </div>
    </main>
    <footer class="footer"><p data-i18n="footer_privacy">所有檔案處理均在本地完成</p></footer>
  </div>
  <script type="module" src="/src/i18n/i18n.js"></script>
  <script type="module" src="./tool.js"></script>
</body>
</html>
