<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TXT-062 語音標記轉文字 - Awesome WASM Tools 1000</title>
  <meta name="description" content="從 SSML 語音標記語言中提取純文字">
  <link rel="stylesheet" href="/src/styles/global.css">
</head>
<body>
  <div class="tool-page">
    <header class="tool-header">
      <a href="/index.html" class="back-btn">
        <span>←</span>
        <span data-i18n="back">返回</span>
      </a>
      <div class="tool-title">
        <h1>TXT-062 <span data-i18n="txt062_name">語音標記轉文字</span></h1>
        <p data-i18n="txt062_desc">從 SSML 語音標記語言中提取純文字</p>
      </div>
      <div class="lang-switcher">
        <button onclick="setLanguage('zh-TW')" class="lang-btn">繁中</button>
        <button onclick="setLanguage('en')" class="lang-btn">EN</button>
      </div>
    </header>

    <main class="tool-content">
      <div id="statusMessage" class="status-message"></div>

      <div class="input-section">
        <h3 data-i18n="input_ssml">輸入 SSML</h3>
        <textarea id="inputText" class="text-input code-output" rows="10" placeholder="在此貼上 SSML 內容..."></textarea>
      </div>

      <div class="action-buttons">
        <button id="convertBtn" class="btn btn-primary">
          <span>🔄</span>
          <span data-i18n="extract">提取文字</span>
        </button>
        <button id="clearBtn" class="btn btn-secondary">
          <span>🗑️</span>
          <span data-i18n="clear">清除</span>
        </button>
      </div>

      <div id="resultArea" class="result-area" style="display: none;">
        <h3 data-i18n="result">純文字結果</h3>
        <textarea id="outputText" class="text-input" rows="6" readonly></textarea>
        <div class="info-section">
          <h4 data-i18n="extracted_info">提取的資訊</h4>
          <div class="info-grid">
            <div class="info-item">
              <span class="info-label" data-i18n="language">語言:</span>
              <span id="infoLang" class="info-value">-</span>
            </div>
            <div class="info-item">
              <span class="info-label" data-i18n="rate">語速:</span>
              <span id="infoRate" class="info-value">-</span>
            </div>
            <div class="info-item">
              <span class="info-label" data-i18n="pitch">音調:</span>
              <span id="infoPitch" class="info-value">-</span>
            </div>
          </div>
        </div>
        <button id="copyBtn" class="btn btn-secondary">
          <span>📋</span>
          <span data-i18n="copy">複製</span>
        </button>
      </div>
    </main>

    <footer class="footer">
      <p data-i18n="footer_privacy">所有檔案處理均在本地完成，不會上傳到伺服器</p>
    </footer>
  </div>

  <script type="module" src="/src/i18n/i18n.js"></script>
  <script type="module" src="./ssml-to-text.js"></script>
</body>
</html>
