<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TXT-082 程式碼高亮 - Awesome WASM Tools 1000</title>
  <meta name="description" content="為程式碼添加語法高亮">
  <link rel="stylesheet" href="/src/styles/global.css">
</head>
<body>
  <div class="tool-page">
    <header class="tool-header">
      <a href="/index.html" class="back-btn">
        <span>←</span>
        <span data-i18n="back">返回</span>
      </a>
      <div class="tool-title">
        <h1>TXT-082 <span data-i18n="txt082_name">程式碼高亮</span></h1>
        <p data-i18n="txt082_desc">為程式碼添加語法高亮</p>
      </div>
      <div class="lang-switcher">
        <button onclick="setLanguage('zh-TW')" class="lang-btn">繁中</button>
        <button onclick="setLanguage('en')" class="lang-btn">EN</button>
      </div>
    </header>

    <main class="tool-content">
      <div id="statusMessage" class="status-message"></div>

      <div class="input-section">
        <h3 data-i18n="input_code">輸入程式碼</h3>
        <textarea id="inputCode" class="text-input code-input" rows="12" placeholder="在此貼上程式碼..."></textarea>
      </div>

      <div class="options-section">
        <div class="option-row">
          <label data-i18n="language">程式語言:</label>
          <select id="langSelect" class="select-input">
            <option value="javascript">JavaScript</option>
            <option value="python">Python</option>
            <option value="html">HTML</option>
            <option value="css">CSS</option>
            <option value="java">Java</option>
            <option value="cpp">C/C++</option>
            <option value="sql">SQL</option>
            <option value="json">JSON</option>
          </select>
        </div>
        <div class="option-row">
          <label data-i18n="theme">主題:</label>
          <select id="themeSelect" class="select-input">
            <option value="dark">深色</option>
            <option value="light">淺色</option>
          </select>
        </div>
      </div>

      <div class="action-buttons">
        <button id="highlightBtn" class="btn btn-primary">
          <span>🎨</span>
          <span data-i18n="highlight">高亮</span>
        </button>
        <button id="clearBtn" class="btn btn-secondary">
          <span>🗑️</span>
          <span data-i18n="clear">清除</span>
        </button>
      </div>

      <div id="resultArea" class="result-area" style="display: none;">
        <h3 data-i18n="result">高亮結果</h3>
        <pre id="outputCode" class="highlighted-code"></pre>
        <button id="copyHtmlBtn" class="btn btn-secondary">
          <span>📋</span>
          <span data-i18n="copy_html">複製 HTML</span>
        </button>
      </div>
    </main>

    <footer class="footer">
      <p data-i18n="footer_privacy">所有檔案處理均在本地完成，不會上傳到伺服器</p>
    </footer>
  </div>

  <script type="module" src="/src/i18n/i18n.js"></script>
  <script type="module" src="./code-highlight.js"></script>
</body>
</html>
