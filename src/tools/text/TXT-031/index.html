<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TXT-031 YAML 驗證 - Awesome WASM Tools 1000</title>
  <meta name="description" content="驗證 YAML 資料格式是否正確">
  <link rel="stylesheet" href="/src/styles/global.css">
</head>
<body>
  <div class="tool-page">
    <header class="tool-header">
      <a href="/index.html" class="back-btn">
        <span>←</span>
        <span data-i18n="back">返回</span>
      </a>
      <div class="tool-title">
        <h1>TXT-031 <span data-i18n="txt031_name">YAML 驗證</span></h1>
        <p data-i18n="txt031_desc">驗證 YAML 資料格式是否正確</p>
      </div>
      <div class="lang-switcher">
        <button onclick="setLanguage('zh-TW')" class="lang-btn">繁中</button>
        <button onclick="setLanguage('en')" class="lang-btn">EN</button>
      </div>
    </header>

    <main class="tool-content">
      <div id="statusMessage" class="status-message"></div>

      <div class="input-section">
        <h3 data-i18n="input_yaml">輸入 YAML</h3>
        <textarea id="inputText" class="text-input code-input" rows="15" placeholder="key: value"></textarea>
      </div>

      <div class="action-buttons">
        <button id="validateBtn" class="btn btn-primary">
          <span>✅</span>
          <span data-i18n="validate">驗證</span>
        </button>
        <button id="clearBtn" class="btn btn-secondary">
          <span>🗑️</span>
          <span data-i18n="clear">清除</span>
        </button>
      </div>

      <div id="resultArea" class="result-area" style="display: none;">
        <div id="validationResult" class="validation-result"></div>
        <div id="yamlInfo" class="json-info" style="display: none;">
          <h4>YAML 結構預覽</h4>
          <pre id="structurePreview" class="code-output"></pre>
        </div>
      </div>
    </main>

    <footer class="footer">
      <p data-i18n="footer_privacy">所有檔案處理均在本地完成，不會上傳到伺服器</p>
    </footer>
  </div>

  <script type="module" src="/src/i18n/i18n.js"></script>
  <script type="module" src="./yamlvalidate.js"></script>
</body>
</html>
