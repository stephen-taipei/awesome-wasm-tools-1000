<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TXT-014 中文假文生成 - Awesome WASM Tools 1000</title>
  <meta name="description" content="生成中文假文內容">
  <link rel="stylesheet" href="/src/styles/global.css">
</head>
<body>
  <div class="tool-page">
    <header class="tool-header">
      <a href="/index.html" class="back-btn">
        <span>←</span>
        <span data-i18n="back">返回</span>
      </a>
      <div class="tool-title">
        <h1>TXT-014 <span data-i18n="txt014_name">中文假文生成</span></h1>
        <p data-i18n="txt014_desc">生成中文假文內容</p>
      </div>
      <div class="lang-switcher">
        <button onclick="setLanguage('zh-TW')" class="lang-btn">繁中</button>
        <button onclick="setLanguage('en')" class="lang-btn">EN</button>
      </div>
    </header>

    <main class="tool-content">
      <div id="statusMessage" class="status-message"></div>

      <div class="settings-panel">
        <h3 data-i18n="settings">設定</h3>
        <div class="setting-row">
          <label data-i18n="type">類型</label>
          <select id="generateType">
            <option value="paragraphs">段落</option>
            <option value="sentences">句子</option>
            <option value="characters">字數</option>
          </select>
        </div>
        <div class="setting-row">
          <label data-i18n="count">數量</label>
          <input type="number" id="count" value="3" min="1" max="100">
        </div>
        <div class="setting-row">
          <label data-i18n="style">風格</label>
          <select id="style">
            <option value="modern">現代文</option>
            <option value="classical">古文風</option>
            <option value="news">新聞體</option>
            <option value="tech">科技文</option>
          </select>
        </div>
      </div>

      <div class="action-buttons">
        <button id="generateBtn" class="btn btn-primary">
          <span>✨</span>
          <span data-i18n="generate">生成</span>
        </button>
        <button id="copyBtn" class="btn btn-success" style="display: none;">
          <span>📋</span>
          <span data-i18n="copy">複製</span>
        </button>
        <button id="clearBtn" class="btn btn-secondary">
          <span>🗑️</span>
          <span data-i18n="clear">清除</span>
        </button>
      </div>

      <div id="resultArea" class="result-area" style="display: none;">
        <h3 data-i18n="result">結果</h3>
        <div class="stats-summary">
          <span>字數: <strong id="charCount">0</strong></span>
        </div>
        <div id="outputText" class="output-text"></div>
      </div>
    </main>

    <footer class="footer">
      <p data-i18n="footer_privacy">所有檔案處理均在本地完成，不會上傳到伺服器</p>
    </footer>
  </div>

  <script type="module" src="/src/i18n/i18n.js"></script>
  <script type="module" src="./chinese-lorem.js"></script>
</body>
</html>
