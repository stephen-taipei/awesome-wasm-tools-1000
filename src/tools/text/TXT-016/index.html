<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TXT-016 假資料生成器 - Awesome WASM Tools 1000</title>
  <meta name="description" content="生成各種類型的假資料">
  <link rel="stylesheet" href="/src/styles/global.css">
</head>
<body>
  <div class="tool-page">
    <header class="tool-header">
      <a href="/index.html" class="back-btn">
        <span>←</span>
        <span data-i18n="back">返回</span>
      </a>
      <div class="tool-title">
        <h1>TXT-016 <span data-i18n="txt016_name">假資料生成器</span></h1>
        <p data-i18n="txt016_desc">生成各種類型的假資料</p>
      </div>
      <div class="lang-switcher">
        <button onclick="setLanguage('zh-TW')" class="lang-btn">繁中</button>
        <button onclick="setLanguage('en')" class="lang-btn">EN</button>
      </div>
    </header>

    <main class="tool-content">
      <div id="statusMessage" class="status-message"></div>

      <div class="settings-panel">
        <h3 data-i18n="settings">設定</h3>
        <div class="setting-row">
          <label data-i18n="data_type">資料類型</label>
          <select id="dataType">
            <option value="email">電子郵件</option>
            <option value="phone">電話號碼</option>
            <option value="address">地址</option>
            <option value="uuid">UUID</option>
            <option value="ip">IP 位址</option>
            <option value="mac">MAC 位址</option>
            <option value="date">日期</option>
            <option value="creditcard">信用卡號</option>
            <option value="company">公司名稱</option>
            <option value="username">使用者名稱</option>
            <option value="password">密碼</option>
            <option value="color">顏色碼</option>
          </select>
        </div>
        <div class="setting-row">
          <label data-i18n="count">數量</label>
          <input type="number" id="count" value="10" min="1" max="100">
        </div>
        <div class="setting-row">
          <label data-i18n="format">格式</label>
          <select id="format">
            <option value="list">列表</option>
            <option value="json">JSON</option>
            <option value="csv">CSV</option>
          </select>
        </div>
      </div>

      <div class="action-buttons">
        <button id="generateBtn" class="btn btn-primary">
          <span>✨</span>
          <span data-i18n="generate">生成</span>
        </button>
        <button id="copyBtn" class="btn btn-success" style="display: none;">
          <span>📋</span>
          <span data-i18n="copy">複製</span>
        </button>
        <button id="clearBtn" class="btn btn-secondary">
          <span>🗑️</span>
          <span data-i18n="clear">清除</span>
        </button>
      </div>

      <div id="resultArea" class="result-area" style="display: none;">
        <h3 data-i18n="result">結果</h3>
        <textarea id="outputText" class="text-input" rows="15" readonly></textarea>
      </div>
    </main>

    <footer class="footer">
      <p data-i18n="footer_privacy">所有檔案處理均在本地完成，不會上傳到伺服器</p>
    </footer>
  </div>

  <script type="module" src="/src/i18n/i18n.js"></script>
  <script type="module" src="./faker.js"></script>
</body>
</html>
