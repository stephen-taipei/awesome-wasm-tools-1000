<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TXT-076 文法檢查 - Awesome WASM Tools 1000</title>
  <meta name="description" content="檢查英文文字的常見文法錯誤">
  <link rel="stylesheet" href="/src/styles/global.css">
</head>
<body>
  <div class="tool-page">
    <header class="tool-header">
      <a href="/index.html" class="back-btn">
        <span>←</span>
        <span data-i18n="back">返回</span>
      </a>
      <div class="tool-title">
        <h1>TXT-076 <span data-i18n="txt076_name">文法檢查</span></h1>
        <p data-i18n="txt076_desc">檢查英文文字的常見文法錯誤</p>
      </div>
      <div class="lang-switcher">
        <button onclick="setLanguage('zh-TW')" class="lang-btn">繁中</button>
        <button onclick="setLanguage('en')" class="lang-btn">EN</button>
      </div>
    </header>

    <main class="tool-content">
      <div id="statusMessage" class="status-message"></div>

      <div class="input-section">
        <h3 data-i18n="input_text">輸入英文文字</h3>
        <textarea id="inputText" class="text-input" rows="8" placeholder="輸入要檢查文法的英文文字..."></textarea>
      </div>

      <div class="action-buttons">
        <button id="checkBtn" class="btn btn-primary">
          <span>✓</span>
          <span data-i18n="check">檢查</span>
        </button>
        <button id="clearBtn" class="btn btn-secondary">
          <span>🗑️</span>
          <span data-i18n="clear">清除</span>
        </button>
      </div>

      <div id="resultArea" class="result-area" style="display: none;">
        <h3 data-i18n="result">檢查結果</h3>
        <div id="issueList" class="issue-list"></div>
      </div>
    </main>

    <footer class="footer">
      <p data-i18n="footer_privacy">所有檔案處理均在本地完成，不會上傳到伺服器</p>
    </footer>
  </div>

  <script type="module" src="/src/i18n/i18n.js"></script>
  <script type="module" src="./grammar-check.js"></script>
</body>
</html>
