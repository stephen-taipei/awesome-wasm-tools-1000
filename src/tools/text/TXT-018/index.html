<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TXT-018 文字摘要 - Awesome WASM Tools 1000</title>
  <meta name="description" content="自動擷取文章重點摘要">
  <link rel="stylesheet" href="/src/styles/global.css">
</head>
<body>
  <div class="tool-page">
    <header class="tool-header">
      <a href="/index.html" class="back-btn">
        <span>←</span>
        <span data-i18n="back">返回</span>
      </a>
      <div class="tool-title">
        <h1>TXT-018 <span data-i18n="txt018_name">文字摘要</span></h1>
        <p data-i18n="txt018_desc">自動擷取文章重點摘要</p>
      </div>
      <div class="lang-switcher">
        <button onclick="setLanguage('zh-TW')" class="lang-btn">繁中</button>
        <button onclick="setLanguage('en')" class="lang-btn">EN</button>
      </div>
    </header>

    <main class="tool-content">
      <div id="statusMessage" class="status-message"></div>

      <div class="input-section">
        <h3 data-i18n="input_text">輸入文章</h3>
        <textarea id="inputText" class="text-input" rows="12" placeholder="輸入或貼上文章內容..."></textarea>
      </div>

      <div class="settings-panel">
        <h3 data-i18n="settings">設定</h3>
        <div class="setting-row">
          <label data-i18n="summary_length">摘要長度</label>
          <select id="summaryLength">
            <option value="3">簡短 (3 句)</option>
            <option value="5" selected>中等 (5 句)</option>
            <option value="10">詳細 (10 句)</option>
          </select>
        </div>
      </div>

      <div class="action-buttons">
        <button id="summarizeBtn" class="btn btn-primary">
          <span>📝</span>
          <span data-i18n="summarize">生成摘要</span>
        </button>
        <button id="copyBtn" class="btn btn-success" style="display: none;">
          <span>📋</span>
          <span data-i18n="copy">複製</span>
        </button>
        <button id="clearBtn" class="btn btn-secondary">
          <span>🗑️</span>
          <span data-i18n="clear">清除</span>
        </button>
      </div>

      <div id="resultArea" class="result-area" style="display: none;">
        <h3 data-i18n="summary">摘要</h3>
        <div class="stats-summary">
          <span>原文: <strong id="originalCount">0</strong> 字</span>
          <span>摘要: <strong id="summaryCount">0</strong> 字</span>
          <span>壓縮比: <strong id="compressionRatio">0%</strong></span>
        </div>
        <div id="summaryOutput" class="output-text"></div>
      </div>
    </main>

    <footer class="footer">
      <p data-i18n="footer_privacy">所有檔案處理均在本地完成，不會上傳到伺服器</p>
    </footer>
  </div>

  <script type="module" src="/src/i18n/i18n.js"></script>
  <script type="module" src="./summarize.js"></script>
</body>
</html>
