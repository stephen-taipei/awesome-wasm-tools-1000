<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TXT-044 表格生成器 - Awesome WASM Tools 1000</title>
  <meta name="description" content="生成 Markdown、HTML、CSV 格式的表格">
  <link rel="stylesheet" href="/src/styles/global.css">
</head>
<body>
  <div class="tool-page">
    <header class="tool-header">
      <a href="/index.html" class="back-btn">
        <span>←</span>
        <span data-i18n="back">返回</span>
      </a>
      <div class="tool-title">
        <h1>TXT-044 <span data-i18n="txt044_name">表格生成器</span></h1>
        <p data-i18n="txt044_desc">生成 Markdown、HTML、CSV 格式的表格</p>
      </div>
      <div class="lang-switcher">
        <button onclick="setLanguage('zh-TW')" class="lang-btn">繁中</button>
        <button onclick="setLanguage('en')" class="lang-btn">EN</button>
      </div>
    </header>

    <main class="tool-content">
      <div id="statusMessage" class="status-message"></div>

      <div class="settings-panel">
        <h3 data-i18n="table_settings">表格設定</h3>
        <div class="setting-row">
          <label data-i18n="rows">列數</label>
          <input type="number" id="rows" min="1" max="50" value="3">
        </div>
        <div class="setting-row">
          <label data-i18n="columns">欄數</label>
          <input type="number" id="columns" min="1" max="20" value="3">
        </div>
        <div class="setting-row">
          <label data-i18n="output_format">輸出格式</label>
          <select id="outputFormat">
            <option value="markdown">Markdown</option>
            <option value="html">HTML</option>
            <option value="csv">CSV</option>
            <option value="tsv">TSV</option>
          </select>
        </div>
        <div class="setting-row">
          <label data-i18n="include_header">包含標題列</label>
          <input type="checkbox" id="includeHeader" checked>
        </div>
      </div>

      <div class="action-buttons">
        <button id="createBtn" class="btn btn-primary">
          <span>📊</span>
          <span data-i18n="create_table">建立表格</span>
        </button>
      </div>

      <div id="editorArea" class="editor-area" style="display: none;">
        <h3 data-i18n="edit_table">編輯表格</h3>
        <div id="tableEditor" class="table-editor"></div>
        <div class="action-buttons">
          <button id="generateBtn" class="btn btn-success">
            <span>✨</span>
            <span data-i18n="generate">生成</span>
          </button>
        </div>
      </div>

      <div id="resultArea" class="result-area" style="display: none;">
        <h3 data-i18n="output">輸出</h3>
        <pre id="outputText" class="code-output"></pre>
        <div class="action-buttons">
          <button id="copyBtn" class="btn btn-success">
            <span>📋</span>
            <span data-i18n="copy">複製</span>
          </button>
        </div>
      </div>
    </main>

    <footer class="footer">
      <p data-i18n="footer_privacy">所有檔案處理均在本地完成，不會上傳到伺服器</p>
    </footer>
  </div>

  <script type="module" src="/src/i18n/i18n.js"></script>
  <script type="module" src="./tablegen.js"></script>
</body>
</html>
