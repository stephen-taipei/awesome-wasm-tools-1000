<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TXT-036 TOML 格式化 - Awesome WASM Tools 1000</title>
  <meta name="description" content="格式化並美化 TOML 資料">
  <link rel="stylesheet" href="/src/styles/global.css">
</head>
<body>
  <div class="tool-page">
    <header class="tool-header">
      <a href="/index.html" class="back-btn">
        <span>←</span>
        <span data-i18n="back">返回</span>
      </a>
      <div class="tool-title">
        <h1>TXT-036 <span data-i18n="txt036_name">TOML 格式化</span></h1>
        <p data-i18n="txt036_desc">格式化並美化 TOML 資料</p>
      </div>
      <div class="lang-switcher">
        <button onclick="setLanguage('zh-TW')" class="lang-btn">繁中</button>
        <button onclick="setLanguage('en')" class="lang-btn">EN</button>
      </div>
    </header>

    <main class="tool-content">
      <div id="statusMessage" class="status-message"></div>

      <div class="input-section">
        <h3 data-i18n="input_toml">輸入 TOML</h3>
        <textarea id="inputText" class="text-input code-input" rows="12" placeholder='[section]
key = "value"'></textarea>
      </div>

      <div class="action-buttons">
        <button id="formatBtn" class="btn btn-primary">
          <span>✨</span>
          <span data-i18n="format">格式化</span>
        </button>
        <button id="validateBtn" class="btn btn-info">
          <span>✅</span>
          <span data-i18n="validate">驗證</span>
        </button>
        <button id="copyBtn" class="btn btn-success" style="display: none;">
          <span>📋</span>
          <span data-i18n="copy">複製</span>
        </button>
        <button id="clearBtn" class="btn btn-secondary">
          <span>🗑️</span>
          <span data-i18n="clear">清除</span>
        </button>
      </div>

      <div id="resultArea" class="result-area" style="display: none;">
        <h3 data-i18n="result">結果</h3>
        <pre id="outputText" class="code-output"></pre>
      </div>
    </main>

    <footer class="footer">
      <p data-i18n="footer_privacy">所有檔案處理均在本地完成，不會上傳到伺服器</p>
    </footer>
  </div>

  <script type="module" src="/src/i18n/i18n.js"></script>
  <script type="module" src="./tomlformat.js"></script>
</body>
</html>
