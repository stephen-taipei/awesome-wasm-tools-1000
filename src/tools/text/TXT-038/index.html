<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TXT-038 CSV 格式化 - Awesome WASM Tools 1000</title>
  <meta name="description" content="格式化並預覽 CSV 資料">
  <link rel="stylesheet" href="/src/styles/global.css">
</head>
<body>
  <div class="tool-page">
    <header class="tool-header">
      <a href="/index.html" class="back-btn">
        <span>←</span>
        <span data-i18n="back">返回</span>
      </a>
      <div class="tool-title">
        <h1>TXT-038 <span data-i18n="txt038_name">CSV 格式化</span></h1>
        <p data-i18n="txt038_desc">格式化並預覽 CSV 資料</p>
      </div>
      <div class="lang-switcher">
        <button onclick="setLanguage('zh-TW')" class="lang-btn">繁中</button>
        <button onclick="setLanguage('en')" class="lang-btn">EN</button>
      </div>
    </header>

    <main class="tool-content">
      <div id="statusMessage" class="status-message"></div>

      <div class="input-section">
        <h3 data-i18n="input_csv">輸入 CSV</h3>
        <textarea id="inputText" class="text-input code-input" rows="10" placeholder="name,age,city
John,30,New York"></textarea>
      </div>

      <div class="settings-panel">
        <h3 data-i18n="settings">設定</h3>
        <div class="setting-row">
          <label data-i18n="delimiter">分隔符</label>
          <select id="delimiter">
            <option value=",">逗號 (,)</option>
            <option value=";">分號 (;)</option>
            <option value="\t">Tab</option>
            <option value="|">豎線 (|)</option>
          </select>
        </div>
        <div class="setting-row">
          <label data-i18n="has_header">首行為標題</label>
          <input type="checkbox" id="hasHeader" checked>
        </div>
      </div>

      <div class="action-buttons">
        <button id="previewBtn" class="btn btn-primary">
          <span>👁️</span>
          <span data-i18n="preview">預覽</span>
        </button>
        <button id="alignBtn" class="btn btn-info">
          <span>📏</span>
          <span data-i18n="align">對齊</span>
        </button>
        <button id="copyBtn" class="btn btn-success" style="display: none;">
          <span>📋</span>
          <span data-i18n="copy">複製</span>
        </button>
        <button id="clearBtn" class="btn btn-secondary">
          <span>🗑️</span>
          <span data-i18n="clear">清除</span>
        </button>
      </div>

      <div id="resultArea" class="result-area" style="display: none;">
        <h3 data-i18n="preview">預覽</h3>
        <div class="stats-summary">
          <span>行數: <strong id="rowCount">0</strong></span>
          <span>欄位數: <strong id="colCount">0</strong></span>
        </div>
        <div class="table-container">
          <table id="previewTable" class="data-table"></table>
        </div>
        <div id="alignedOutput" style="display: none;">
          <h4>對齊後 CSV</h4>
          <pre id="outputText" class="code-output"></pre>
        </div>
      </div>
    </main>

    <footer class="footer">
      <p data-i18n="footer_privacy">所有檔案處理均在本地完成，不會上傳到伺服器</p>
    </footer>
  </div>

  <script type="module" src="/src/i18n/i18n.js"></script>
  <script type="module" src="./csvformat.js"></script>
</body>
</html>
