<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TXT-057 Shift-JIS 轉 UTF-8 - Awesome WASM Tools 1000</title>
  <meta name="description" content="將 Shift-JIS 編碼的日文文字轉換為 UTF-8 編碼">
  <link rel="stylesheet" href="/src/styles/global.css">
</head>
<body>
  <div class="tool-page">
    <header class="tool-header">
      <a href="/index.html" class="back-btn">
        <span>←</span>
        <span data-i18n="back">返回</span>
      </a>
      <div class="tool-title">
        <h1>TXT-057 <span data-i18n="txt057_name">Shift-JIS 轉 UTF-8</span></h1>
        <p data-i18n="txt057_desc">將 Shift-JIS 編碼的日文文字轉換為 UTF-8 編碼</p>
      </div>
      <div class="lang-switcher">
        <button onclick="setLanguage('zh-TW')" class="lang-btn">繁中</button>
        <button onclick="setLanguage('en')" class="lang-btn">EN</button>
      </div>
    </header>

    <main class="tool-content">
      <div id="statusMessage" class="status-message"></div>

      <div class="input-section">
        <h3 data-i18n="upload_file">上傳 Shift-JIS 編碼檔案</h3>
        <input type="file" id="fileInput" class="file-input" accept=".txt,.csv,.html,.htm">
        <p class="hint" data-i18n="or_paste">或直接貼上 Shift-JIS 編碼的十六進制資料:</p>
        <textarea id="hexInput" class="text-input" rows="4" placeholder="例如: 82 A0 82 A2"></textarea>
      </div>

      <div class="action-buttons">
        <button id="convertBtn" class="btn btn-primary">
          <span>🔄</span>
          <span data-i18n="convert">轉換</span>
        </button>
        <button id="clearBtn" class="btn btn-secondary">
          <span>🗑️</span>
          <span data-i18n="clear">清除</span>
        </button>
      </div>

      <div id="resultArea" class="result-area" style="display: none;">
        <h3 data-i18n="result">轉換結果 (UTF-8)</h3>
        <textarea id="outputText" class="text-input" rows="8" readonly></textarea>
        <div class="action-buttons">
          <button id="copyBtn" class="btn btn-secondary">
            <span>📋</span>
            <span data-i18n="copy">複製</span>
          </button>
          <button id="downloadBtn" class="btn btn-secondary">
            <span>💾</span>
            <span data-i18n="download">下載</span>
          </button>
        </div>
      </div>
    </main>

    <footer class="footer">
      <p data-i18n="footer_privacy">所有檔案處理均在本地完成，不會上傳到伺服器</p>
    </footer>
  </div>

  <script type="module" src="/src/i18n/i18n.js"></script>
  <script type="module" src="./shiftjis-to-utf8.js"></script>
</body>
</html>
