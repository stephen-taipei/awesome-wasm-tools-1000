<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TXT-023 拼音轉換 - Awesome WASM Tools 1000</title>
  <meta name="description" content="將中文轉換為拼音">
  <link rel="stylesheet" href="/src/styles/global.css">
</head>
<body>
  <div class="tool-page">
    <header class="tool-header">
      <a href="/index.html" class="back-btn">
        <span>←</span>
        <span data-i18n="back">返回</span>
      </a>
      <div class="tool-title">
        <h1>TXT-023 <span data-i18n="txt023_name">拼音轉換</span></h1>
        <p data-i18n="txt023_desc">將中文轉換為拼音</p>
      </div>
      <div class="lang-switcher">
        <button onclick="setLanguage('zh-TW')" class="lang-btn">繁中</button>
        <button onclick="setLanguage('en')" class="lang-btn">EN</button>
      </div>
    </header>

    <main class="tool-content">
      <div id="statusMessage" class="status-message"></div>

      <div class="input-section">
        <h3 data-i18n="input_text">輸入中文</h3>
        <textarea id="inputText" class="text-input" rows="6" placeholder="輸入中文文字..."></textarea>
      </div>

      <div class="settings-panel">
        <h3 data-i18n="settings">設定</h3>
        <div class="setting-row">
          <label data-i18n="tone_style">聲調樣式</label>
          <select id="toneStyle">
            <option value="number">數字標調 (zhong1 guo2)</option>
            <option value="mark">聲調符號 (zhōng guó)</option>
            <option value="none">無聲調 (zhong guo)</option>
          </select>
        </div>
        <div class="setting-row">
          <label data-i18n="separator">分隔符</label>
          <select id="separator">
            <option value=" ">空格</option>
            <option value="">無</option>
            <option value="-">連字符</option>
          </select>
        </div>
      </div>

      <div class="action-buttons">
        <button id="convertBtn" class="btn btn-primary">
          <span>🔤</span>
          <span data-i18n="convert">轉換</span>
        </button>
        <button id="copyBtn" class="btn btn-success" style="display: none;">
          <span>📋</span>
          <span data-i18n="copy">複製</span>
        </button>
        <button id="clearBtn" class="btn btn-secondary">
          <span>🗑️</span>
          <span data-i18n="clear">清除</span>
        </button>
      </div>

      <div id="resultArea" class="result-area" style="display: none;">
        <h3 data-i18n="result">結果</h3>
        <div id="pinyinDisplay" class="pinyin-display"></div>
        <textarea id="outputText" class="text-input" rows="4" readonly></textarea>
      </div>
    </main>

    <footer class="footer">
      <p data-i18n="footer_privacy">所有檔案處理均在本地完成，不會上傳到伺服器</p>
    </footer>
  </div>

  <script type="module" src="/src/i18n/i18n.js"></script>
  <script type="module" src="./pinyin.js"></script>
</body>
</html>
