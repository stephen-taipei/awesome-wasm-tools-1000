<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TXT-088 換行符轉換 - Awesome WASM Tools 1000</title>
  <meta name="description" content="在不同作業系統的換行符格式之間轉換">
  <link rel="stylesheet" href="/src/styles/global.css">
</head>
<body>
  <div class="tool-page">
    <header class="tool-header">
      <a href="/index.html" class="back-btn">
        <span>←</span>
        <span data-i18n="back">返回</span>
      </a>
      <div class="tool-title">
        <h1>TXT-088 <span data-i18n="txt088_name">換行符轉換</span></h1>
        <p data-i18n="txt088_desc">在不同作業系統的換行符格式之間轉換</p>
      </div>
      <div class="lang-switcher">
        <button onclick="setLanguage('zh-TW')" class="lang-btn">繁中</button>
        <button onclick="setLanguage('en')" class="lang-btn">EN</button>
      </div>
    </header>

    <main class="tool-content">
      <div id="statusMessage" class="status-message"></div>

      <div class="input-section">
        <h3 data-i18n="input_text">輸入文字</h3>
        <textarea id="inputText" class="text-input" rows="8" placeholder="在此貼上文字..."></textarea>
        <div class="detected-format">
          <span data-i18n="detected">偵測到的格式:</span>
          <span id="detectedFormat">-</span>
        </div>
      </div>

      <div class="options-section">
        <h3 data-i18n="target_format">目標格式</h3>
        <div class="radio-group">
          <label class="radio-label">
            <input type="radio" name="targetFormat" value="lf" checked>
            <span>LF (Unix/Linux/macOS) - \n</span>
          </label>
          <label class="radio-label">
            <input type="radio" name="targetFormat" value="crlf">
            <span>CRLF (Windows) - \r\n</span>
          </label>
          <label class="radio-label">
            <input type="radio" name="targetFormat" value="cr">
            <span>CR (舊版 Mac) - \r</span>
          </label>
        </div>
      </div>

      <div class="action-buttons">
        <button id="convertBtn" class="btn btn-primary">
          <span>🔄</span>
          <span data-i18n="convert">轉換</span>
        </button>
        <button id="clearBtn" class="btn btn-secondary">
          <span>🗑️</span>
          <span data-i18n="clear">清除</span>
        </button>
      </div>

      <div id="resultArea" class="result-area" style="display: none;">
        <h3 data-i18n="result">轉換結果</h3>
        <textarea id="outputText" class="text-input" rows="8" readonly></textarea>
        <button id="copyBtn" class="btn btn-secondary">
          <span>📋</span>
          <span data-i18n="copy">複製</span>
        </button>
      </div>
    </main>

    <footer class="footer">
      <p data-i18n="footer_privacy">所有檔案處理均在本地完成，不會上傳到伺服器</p>
    </footer>
  </div>

  <script type="module" src="/src/i18n/i18n.js"></script>
  <script type="module" src="./line-ending-converter.js"></script>
</body>
</html>
