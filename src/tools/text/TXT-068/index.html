<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TXT-068 羅馬數字轉換 - Awesome WASM Tools 1000</title>
  <meta name="description" content="在羅馬數字和阿拉伯數字之間轉換">
  <link rel="stylesheet" href="/src/styles/global.css">
</head>
<body>
  <div class="tool-page">
    <header class="tool-header">
      <a href="/index.html" class="back-btn">
        <span>←</span>
        <span data-i18n="back">返回</span>
      </a>
      <div class="tool-title">
        <h1>TXT-068 <span data-i18n="txt068_name">羅馬數字轉換</span></h1>
        <p data-i18n="txt068_desc">在羅馬數字和阿拉伯數字之間轉換</p>
      </div>
      <div class="lang-switcher">
        <button onclick="setLanguage('zh-TW')" class="lang-btn">繁中</button>
        <button onclick="setLanguage('en')" class="lang-btn">EN</button>
      </div>
    </header>

    <main class="tool-content">
      <div id="statusMessage" class="status-message"></div>

      <div class="input-section">
        <h3 data-i18n="input_number">輸入數字</h3>
        <input type="text" id="inputText" class="text-input" placeholder="輸入阿拉伯數字或羅馬數字">
      </div>

      <div class="options-section">
        <h3 data-i18n="conversion_direction">轉換方向</h3>
        <div class="radio-group">
          <label class="radio-label">
            <input type="radio" name="direction" value="toRoman" checked>
            <span>阿拉伯數字 → 羅馬數字</span>
          </label>
          <label class="radio-label">
            <input type="radio" name="direction" value="toArabic">
            <span>羅馬數字 → 阿拉伯數字</span>
          </label>
        </div>
      </div>

      <div class="action-buttons">
        <button id="convertBtn" class="btn btn-primary">
          <span>🔄</span>
          <span data-i18n="convert">轉換</span>
        </button>
        <button id="clearBtn" class="btn btn-secondary">
          <span>🗑️</span>
          <span data-i18n="clear">清除</span>
        </button>
      </div>

      <div id="resultArea" class="result-area" style="display: none;">
        <h3 data-i18n="result">轉換結果</h3>
        <div class="result-display">
          <span id="outputText" class="large-text"></span>
        </div>
        <button id="copyBtn" class="btn btn-secondary">
          <span>📋</span>
          <span data-i18n="copy">複製</span>
        </button>
      </div>

      <div class="reference-section">
        <h3 data-i18n="reference">羅馬數字參考</h3>
        <div class="reference-grid">
          <span>I = 1</span>
          <span>V = 5</span>
          <span>X = 10</span>
          <span>L = 50</span>
          <span>C = 100</span>
          <span>D = 500</span>
          <span>M = 1000</span>
        </div>
      </div>
    </main>

    <footer class="footer">
      <p data-i18n="footer_privacy">所有檔案處理均在本地完成，不會上傳到伺服器</p>
    </footer>
  </div>

  <script type="module" src="/src/i18n/i18n.js"></script>
  <script type="module" src="./roman-numeral.js"></script>
</body>
</html>
