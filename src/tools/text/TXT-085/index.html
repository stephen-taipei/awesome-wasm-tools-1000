<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TXT-085 註解移除 - Awesome WASM Tools 1000</title>
  <meta name="description" content="從程式碼中移除所有註解">
  <link rel="stylesheet" href="/src/styles/global.css">
</head>
<body>
  <div class="tool-page">
    <header class="tool-header">
      <a href="/index.html" class="back-btn">
        <span>←</span>
        <span data-i18n="back">返回</span>
      </a>
      <div class="tool-title">
        <h1>TXT-085 <span data-i18n="txt085_name">註解移除</span></h1>
        <p data-i18n="txt085_desc">從程式碼中移除所有註解</p>
      </div>
      <div class="lang-switcher">
        <button onclick="setLanguage('zh-TW')" class="lang-btn">繁中</button>
        <button onclick="setLanguage('en')" class="lang-btn">EN</button>
      </div>
    </header>

    <main class="tool-content">
      <div id="statusMessage" class="status-message"></div>

      <div class="input-section">
        <h3 data-i18n="input_code">輸入程式碼</h3>
        <textarea id="inputCode" class="text-input code-input" rows="10" placeholder="在此貼上程式碼..."></textarea>
      </div>

      <div class="options-section">
        <label data-i18n="language">程式語言:</label>
        <select id="langSelect" class="select-input">
          <option value="c-style">C-style (JS, Java, C, C++)</option>
          <option value="python">Python</option>
          <option value="html">HTML</option>
          <option value="sql">SQL</option>
        </select>
      </div>

      <div class="action-buttons">
        <button id="removeBtn" class="btn btn-primary">
          <span>🧹</span>
          <span data-i18n="remove">移除註解</span>
        </button>
        <button id="clearBtn" class="btn btn-secondary">
          <span>🗑️</span>
          <span data-i18n="clear">清除</span>
        </button>
      </div>

      <div id="resultArea" class="result-area" style="display: none;">
        <h3 data-i18n="result">處理後的程式碼</h3>
        <textarea id="outputCode" class="text-input code-input" rows="10" readonly></textarea>
        <div class="stats-row">
          <span>移除了 <span id="removedCount">0</span> 行註解</span>
        </div>
        <button id="copyBtn" class="btn btn-secondary">
          <span>📋</span>
          <span data-i18n="copy">複製</span>
        </button>
      </div>
    </main>

    <footer class="footer">
      <p data-i18n="footer_privacy">所有檔案處理均在本地完成，不會上傳到伺服器</p>
    </footer>
  </div>

  <script type="module" src="/src/i18n/i18n.js"></script>
  <script type="module" src="./comment-remover.js"></script>
</body>
</html>
