<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TXT-065 韓文羅馬化 - Awesome WASM Tools 1000</title>
  <meta name="description" content="將韓文諺文轉換為羅馬字母拼音">
  <link rel="stylesheet" href="/src/styles/global.css">
</head>
<body>
  <div class="tool-page">
    <header class="tool-header">
      <a href="/index.html" class="back-btn">
        <span>←</span>
        <span data-i18n="back">返回</span>
      </a>
      <div class="tool-title">
        <h1>TXT-065 <span data-i18n="txt065_name">韓文羅馬化</span></h1>
        <p data-i18n="txt065_desc">將韓文諺文轉換為羅馬字母拼音</p>
      </div>
      <div class="lang-switcher">
        <button onclick="setLanguage('zh-TW')" class="lang-btn">繁中</button>
        <button onclick="setLanguage('en')" class="lang-btn">EN</button>
      </div>
    </header>

    <main class="tool-content">
      <div id="statusMessage" class="status-message"></div>

      <div class="input-section">
        <h3 data-i18n="input_korean">輸入韓文</h3>
        <textarea id="inputText" class="text-input" rows="4" placeholder="輸入韓文諺文..."></textarea>
      </div>

      <div class="options-section">
        <h3 data-i18n="romanization_system">羅馬化系統</h3>
        <div class="radio-group">
          <label class="radio-label">
            <input type="radio" name="system" value="revised" checked>
            <span>修正式羅馬字 (Revised Romanization)</span>
          </label>
          <label class="radio-label">
            <input type="radio" name="system" value="mccune">
            <span>馬科恩-賴肖爾 (McCune-Reischauer)</span>
          </label>
        </div>
      </div>

      <div class="action-buttons">
        <button id="convertBtn" class="btn btn-primary">
          <span>🔄</span>
          <span data-i18n="convert">轉換</span>
        </button>
        <button id="clearBtn" class="btn btn-secondary">
          <span>🗑️</span>
          <span data-i18n="clear">清除</span>
        </button>
      </div>

      <div id="resultArea" class="result-area" style="display: none;">
        <h3 data-i18n="result">羅馬化結果</h3>
        <textarea id="outputText" class="text-input" rows="4" readonly></textarea>
        <button id="copyBtn" class="btn btn-secondary">
          <span>📋</span>
          <span data-i18n="copy">複製</span>
        </button>
      </div>
    </main>

    <footer class="footer">
      <p data-i18n="footer_privacy">所有檔案處理均在本地完成，不會上傳到伺服器</p>
    </footer>
  </div>

  <script type="module" src="/src/i18n/i18n.js"></script>
  <script type="module" src="./korean-romanizer.js"></script>
</body>
</html>
