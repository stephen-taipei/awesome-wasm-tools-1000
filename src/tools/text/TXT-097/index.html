<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TXT-097 Emoji 搜尋 - Awesome WASM Tools 1000</title>
  <meta name="description" content="搜尋和瀏覽 Emoji 表情符號">
  <link rel="stylesheet" href="/src/styles/global.css">
</head>
<body>
  <div class="tool-page">
    <header class="tool-header">
      <a href="/index.html" class="back-btn">
        <span>←</span>
        <span data-i18n="back">返回</span>
      </a>
      <div class="tool-title">
        <h1>TXT-097 <span data-i18n="txt097_name">Emoji 搜尋</span></h1>
        <p data-i18n="txt097_desc">搜尋和瀏覽 Emoji 表情符號</p>
      </div>
      <div class="lang-switcher">
        <button onclick="setLanguage('zh-TW')" class="lang-btn">繁中</button>
        <button onclick="setLanguage('en')" class="lang-btn">EN</button>
      </div>
    </header>

    <main class="tool-content">
      <div id="statusMessage" class="status-message"></div>

      <div class="input-section">
        <h3 data-i18n="search_emoji">搜尋 Emoji</h3>
        <input type="text" id="searchInput" class="text-input" placeholder="輸入關鍵字搜尋 (如: smile, heart, cat)">
      </div>

      <div class="options-section">
        <h3 data-i18n="category">分類</h3>
        <div id="categoryButtons" class="category-buttons">
          <button class="btn btn-secondary category-btn active" data-category="all">全部</button>
          <button class="btn btn-secondary category-btn" data-category="smileys">表情</button>
          <button class="btn btn-secondary category-btn" data-category="people">人物</button>
          <button class="btn btn-secondary category-btn" data-category="animals">動物</button>
          <button class="btn btn-secondary category-btn" data-category="food">食物</button>
          <button class="btn btn-secondary category-btn" data-category="travel">旅行</button>
          <button class="btn btn-secondary category-btn" data-category="activities">活動</button>
          <button class="btn btn-secondary category-btn" data-category="objects">物件</button>
          <button class="btn btn-secondary category-btn" data-category="symbols">符號</button>
        </div>
      </div>

      <div id="resultArea" class="result-area">
        <h3 data-i18n="result">搜尋結果 (<span id="resultCount">0</span>)</h3>
        <div id="emojiGrid" class="emoji-grid"></div>
      </div>

      <div id="selectedEmoji" class="selected-emoji" style="display: none;">
        <h3>已選擇的 Emoji</h3>
        <div id="selectedDisplay" class="selected-display"></div>
        <button id="copyBtn" class="btn btn-primary">
          <span>📋</span>
          <span data-i18n="copy">複製</span>
        </button>
        <button id="clearSelectedBtn" class="btn btn-secondary">
          <span>🗑️</span>
          <span data-i18n="clear">清除</span>
        </button>
      </div>
    </main>

    <footer class="footer">
      <p data-i18n="footer_privacy">所有檔案處理均在本地完成，不會上傳到伺服器</p>
    </footer>
  </div>

  <style>
    .emoji-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(50px, 1fr));
      gap: 8px;
      max-height: 400px;
      overflow-y: auto;
      padding: 10px;
    }
    .emoji-item {
      font-size: 2rem;
      text-align: center;
      padding: 8px;
      cursor: pointer;
      border-radius: 8px;
      transition: background 0.2s;
    }
    .emoji-item:hover {
      background: var(--hover-bg, #e0e0e0);
    }
    .category-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 16px;
    }
    .category-btn.active {
      background: var(--primary-color, #007bff);
      color: white;
    }
    .selected-display {
      font-size: 2rem;
      padding: 16px;
      background: var(--input-bg, #f5f5f5);
      border-radius: 8px;
      margin-bottom: 16px;
      min-height: 60px;
    }
  </style>

  <script type="module" src="/src/i18n/i18n.js"></script>
  <script type="module" src="./emoji-search.js"></script>
</body>
</html>
