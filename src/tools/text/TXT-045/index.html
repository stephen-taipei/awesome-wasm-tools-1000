<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TXT-045 SQL 格式化 - Awesome WASM Tools 1000</title>
  <meta name="description" content="格式化 SQL 查詢語句">
  <link rel="stylesheet" href="/src/styles/global.css">
</head>
<body>
  <div class="tool-page">
    <header class="tool-header">
      <a href="/index.html" class="back-btn">
        <span>←</span>
        <span data-i18n="back">返回</span>
      </a>
      <div class="tool-title">
        <h1>TXT-045 <span data-i18n="txt045_name">SQL 格式化</span></h1>
        <p data-i18n="txt045_desc">格式化 SQL 查詢語句</p>
      </div>
      <div class="lang-switcher">
        <button onclick="setLanguage('zh-TW')" class="lang-btn">繁中</button>
        <button onclick="setLanguage('en')" class="lang-btn">EN</button>
      </div>
    </header>

    <main class="tool-content">
      <div id="statusMessage" class="status-message"></div>

      <div class="input-section">
        <h3 data-i18n="sql_input">輸入 SQL</h3>
        <textarea id="inputText" class="text-input code-input" rows="10" placeholder="SELECT * FROM users WHERE id = 1"></textarea>
      </div>

      <div class="settings-panel">
        <h3 data-i18n="settings">設定</h3>
        <div class="setting-row">
          <label data-i18n="indent_size">縮排大小</label>
          <select id="indentSize">
            <option value="2">2 空格</option>
            <option value="4" selected>4 空格</option>
            <option value="tab">Tab</option>
          </select>
        </div>
        <div class="setting-row">
          <label data-i18n="uppercase_keywords">關鍵字大寫</label>
          <input type="checkbox" id="uppercaseKeywords" checked>
        </div>
      </div>

      <div class="action-buttons">
        <button id="formatBtn" class="btn btn-primary">
          <span>✨</span>
          <span data-i18n="format">格式化</span>
        </button>
        <button id="minifyBtn" class="btn btn-secondary">
          <span>📦</span>
          <span data-i18n="minify">壓縮</span>
        </button>
        <button id="copyBtn" class="btn btn-success" style="display: none;">
          <span>📋</span>
          <span data-i18n="copy">複製</span>
        </button>
        <button id="clearBtn" class="btn btn-secondary">
          <span>🗑️</span>
          <span data-i18n="clear">清除</span>
        </button>
      </div>

      <div id="resultArea" class="result-area" style="display: none;">
        <h3 data-i18n="output">輸出</h3>
        <pre id="outputText" class="code-output"></pre>
      </div>
    </main>

    <footer class="footer">
      <p data-i18n="footer_privacy">所有檔案處理均在本地完成，不會上傳到伺服器</p>
    </footer>
  </div>

  <script type="module" src="/src/i18n/i18n.js"></script>
  <script type="module" src="./sqlformat.js"></script>
</body>
</html>
