<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TXT-049 文字加密 (ROT13) - Awesome WASM Tools 1000</title>
  <meta name="description" content="ROT13 及其他旋轉加密">
  <link rel="stylesheet" href="/src/styles/global.css">
</head>
<body>
  <div class="tool-page">
    <header class="tool-header">
      <a href="/index.html" class="back-btn">
        <span>←</span>
        <span data-i18n="back">返回</span>
      </a>
      <div class="tool-title">
        <h1>TXT-049 <span data-i18n="txt049_name">文字加密 (ROT13)</span></h1>
        <p data-i18n="txt049_desc">ROT13 及其他旋轉加密</p>
      </div>
      <div class="lang-switcher">
        <button onclick="setLanguage('zh-TW')" class="lang-btn">繁中</button>
        <button onclick="setLanguage('en')" class="lang-btn">EN</button>
      </div>
    </header>

    <main class="tool-content">
      <div id="statusMessage" class="status-message"></div>

      <div class="input-section">
        <h3 data-i18n="input_text">輸入文字</h3>
        <textarea id="inputText" class="text-input" rows="8" placeholder="Hello World"></textarea>
      </div>

      <div class="settings-panel">
        <h3 data-i18n="settings">設定</h3>
        <div class="setting-row">
          <label data-i18n="cipher_type">加密類型</label>
          <select id="cipherType">
            <option value="rot13">ROT13 (旋轉 13)</option>
            <option value="rot5">ROT5 (數字)</option>
            <option value="rot18">ROT18 (ROT13 + ROT5)</option>
            <option value="rot47">ROT47 (ASCII)</option>
            <option value="caesar">凱撒密碼 (自訂位移)</option>
          </select>
        </div>
        <div class="setting-row" id="shiftRow" style="display: none;">
          <label data-i18n="shift_amount">位移量</label>
          <input type="number" id="shiftAmount" min="1" max="25" value="3">
        </div>
      </div>

      <div class="action-buttons">
        <button id="encryptBtn" class="btn btn-primary">
          <span>🔒</span>
          <span data-i18n="encrypt">加密</span>
        </button>
        <button id="decryptBtn" class="btn btn-secondary">
          <span>🔓</span>
          <span data-i18n="decrypt">解密</span>
        </button>
        <button id="copyBtn" class="btn btn-success" style="display: none;">
          <span>📋</span>
          <span data-i18n="copy">複製</span>
        </button>
        <button id="clearBtn" class="btn btn-secondary">
          <span>🗑️</span>
          <span data-i18n="clear">清除</span>
        </button>
      </div>

      <div id="resultArea" class="result-area" style="display: none;">
        <h3 data-i18n="output">輸出</h3>
        <pre id="outputText" class="code-output"></pre>
      </div>
    </main>

    <footer class="footer">
      <p data-i18n="footer_privacy">所有檔案處理均在本地完成，不會上傳到伺服器</p>
    </footer>
  </div>

  <script type="module" src="/src/i18n/i18n.js"></script>
  <script type="module" src="./rot13.js"></script>
</body>
</html>
