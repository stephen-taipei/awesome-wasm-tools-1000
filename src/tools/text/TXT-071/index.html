<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TXT-071 零寬字元插入 - Awesome WASM Tools 1000</title>
  <meta name="description" content="在文字中插入零寬字元，可用於隱藏訊息">
  <link rel="stylesheet" href="/src/styles/global.css">
</head>
<body>
  <div class="tool-page">
    <header class="tool-header">
      <a href="/index.html" class="back-btn">
        <span>←</span>
        <span data-i18n="back">返回</span>
      </a>
      <div class="tool-title">
        <h1>TXT-071 <span data-i18n="txt071_name">零寬字元插入</span></h1>
        <p data-i18n="txt071_desc">在文字中插入零寬字元，可用於隱藏訊息</p>
      </div>
      <div class="lang-switcher">
        <button onclick="setLanguage('zh-TW')" class="lang-btn">繁中</button>
        <button onclick="setLanguage('en')" class="lang-btn">EN</button>
      </div>
    </header>

    <main class="tool-content">
      <div id="statusMessage" class="status-message"></div>

      <div class="input-section">
        <h3 data-i18n="visible_text">可見文字</h3>
        <textarea id="visibleText" class="text-input" rows="4" placeholder="輸入要顯示的文字..."></textarea>
      </div>

      <div class="input-section">
        <h3 data-i18n="hidden_message">隱藏訊息</h3>
        <textarea id="hiddenText" class="text-input" rows="4" placeholder="輸入要隱藏的訊息..."></textarea>
      </div>

      <div class="action-buttons">
        <button id="encodeBtn" class="btn btn-primary">
          <span>🔒</span>
          <span data-i18n="encode">編碼</span>
        </button>
        <button id="clearBtn" class="btn btn-secondary">
          <span>🗑️</span>
          <span data-i18n="clear">清除</span>
        </button>
      </div>

      <div id="resultArea" class="result-area" style="display: none;">
        <h3 data-i18n="result">編碼結果</h3>
        <textarea id="outputText" class="text-input" rows="4" readonly></textarea>
        <p class="hint" data-i18n="hidden_hint">看起來一樣，但包含隱藏訊息</p>
        <button id="copyBtn" class="btn btn-secondary">
          <span>📋</span>
          <span data-i18n="copy">複製</span>
        </button>
      </div>
    </main>

    <footer class="footer">
      <p data-i18n="footer_privacy">所有檔案處理均在本地完成，不會上傳到伺服器</p>
    </footer>
  </div>

  <script type="module" src="/src/i18n/i18n.js"></script>
  <script type="module" src="./zwc-insert.js"></script>
</body>
</html>
