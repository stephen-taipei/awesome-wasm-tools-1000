<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TXT-047 程式碼壓縮 - Awesome WASM Tools 1000</title>
  <meta name="description" content="壓縮 JavaScript、CSS、HTML 程式碼">
  <link rel="stylesheet" href="/src/styles/global.css">
</head>
<body>
  <div class="tool-page">
    <header class="tool-header">
      <a href="/index.html" class="back-btn">
        <span>←</span>
        <span data-i18n="back">返回</span>
      </a>
      <div class="tool-title">
        <h1>TXT-047 <span data-i18n="txt047_name">程式碼壓縮</span></h1>
        <p data-i18n="txt047_desc">壓縮 JavaScript、CSS、HTML 程式碼</p>
      </div>
      <div class="lang-switcher">
        <button onclick="setLanguage('zh-TW')" class="lang-btn">繁中</button>
        <button onclick="setLanguage('en')" class="lang-btn">EN</button>
      </div>
    </header>

    <main class="tool-content">
      <div id="statusMessage" class="status-message"></div>

      <div class="input-section">
        <h3 data-i18n="code_input">輸入程式碼</h3>
        <textarea id="inputText" class="text-input code-input" rows="12" placeholder="function hello() {
    console.log('Hello World');
}"></textarea>
      </div>

      <div class="settings-panel">
        <h3 data-i18n="settings">設定</h3>
        <div class="setting-row">
          <label data-i18n="language">語言</label>
          <select id="language">
            <option value="javascript">JavaScript</option>
            <option value="css">CSS</option>
            <option value="html">HTML</option>
          </select>
        </div>
        <div class="setting-row">
          <label data-i18n="remove_comments">移除註解</label>
          <input type="checkbox" id="removeComments" checked>
        </div>
      </div>

      <div class="action-buttons">
        <button id="minifyBtn" class="btn btn-primary">
          <span>📦</span>
          <span data-i18n="minify">壓縮</span>
        </button>
        <button id="copyBtn" class="btn btn-success" style="display: none;">
          <span>📋</span>
          <span data-i18n="copy">複製</span>
        </button>
        <button id="clearBtn" class="btn btn-secondary">
          <span>🗑️</span>
          <span data-i18n="clear">清除</span>
        </button>
      </div>

      <div id="resultArea" class="result-area" style="display: none;">
        <h3 data-i18n="output">輸出</h3>
        <pre id="outputText" class="code-output"></pre>
        <div class="stats-panel">
          <p><span data-i18n="original_size">原始大小</span>: <span id="originalSize">0</span> bytes</p>
          <p><span data-i18n="minified_size">壓縮後大小</span>: <span id="minifiedSize">0</span> bytes</p>
          <p><span data-i18n="savings">節省</span>: <span id="savings">0%</span></p>
        </div>
      </div>
    </main>

    <footer class="footer">
      <p data-i18n="footer_privacy">所有檔案處理均在本地完成，不會上傳到伺服器</p>
    </footer>
  </div>

  <script type="module" src="/src/i18n/i18n.js"></script>
  <script type="module" src="./codeminify.js"></script>
</body>
</html>
