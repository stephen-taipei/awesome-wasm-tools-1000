<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TXT-084 程式碼行數統計 - Awesome WASM Tools 1000</title>
  <meta name="description" content="統計程式碼的行數、空行、註解行等">
  <link rel="stylesheet" href="/src/styles/global.css">
</head>
<body>
  <div class="tool-page">
    <header class="tool-header">
      <a href="/index.html" class="back-btn">
        <span>←</span>
        <span data-i18n="back">返回</span>
      </a>
      <div class="tool-title">
        <h1>TXT-084 <span data-i18n="txt084_name">程式碼行數統計</span></h1>
        <p data-i18n="txt084_desc">統計程式碼的行數、空行、註解行等</p>
      </div>
      <div class="lang-switcher">
        <button onclick="setLanguage('zh-TW')" class="lang-btn">繁中</button>
        <button onclick="setLanguage('en')" class="lang-btn">EN</button>
      </div>
    </header>

    <main class="tool-content">
      <div id="statusMessage" class="status-message"></div>

      <div class="input-section">
        <h3 data-i18n="input_code">輸入程式碼</h3>
        <textarea id="inputCode" class="text-input code-input" rows="12" placeholder="在此貼上程式碼..."></textarea>
      </div>

      <div class="options-section">
        <label data-i18n="language">程式語言:</label>
        <select id="langSelect" class="select-input">
          <option value="c-style">C-style (JS, Java, C, C++, etc.)</option>
          <option value="python">Python</option>
          <option value="html">HTML</option>
          <option value="sql">SQL</option>
        </select>
      </div>

      <div class="action-buttons">
        <button id="countBtn" class="btn btn-primary">
          <span>📊</span>
          <span data-i18n="count">統計</span>
        </button>
        <button id="clearBtn" class="btn btn-secondary">
          <span>🗑️</span>
          <span data-i18n="clear">清除</span>
        </button>
      </div>

      <div id="resultArea" class="result-area" style="display: none;">
        <h3 data-i18n="result">統計結果</h3>
        <div class="stats-grid">
          <div class="stat-item">
            <span class="stat-label">總行數</span>
            <span id="totalLines" class="stat-value">0</span>
          </div>
          <div class="stat-item">
            <span class="stat-label">程式碼行</span>
            <span id="codeLines" class="stat-value">0</span>
          </div>
          <div class="stat-item">
            <span class="stat-label">註解行</span>
            <span id="commentLines" class="stat-value">0</span>
          </div>
          <div class="stat-item">
            <span class="stat-label">空白行</span>
            <span id="blankLines" class="stat-value">0</span>
          </div>
          <div class="stat-item">
            <span class="stat-label">總字元數</span>
            <span id="totalChars" class="stat-value">0</span>
          </div>
          <div class="stat-item">
            <span class="stat-label">程式碼比例</span>
            <span id="codeRatio" class="stat-value">0%</span>
          </div>
        </div>
      </div>
    </main>

    <footer class="footer">
      <p data-i18n="footer_privacy">所有檔案處理均在本地完成，不會上傳到伺服器</p>
    </footer>
  </div>

  <script type="module" src="/src/i18n/i18n.js"></script>
  <script type="module" src="./line-counter.js"></script>
</body>
</html>
