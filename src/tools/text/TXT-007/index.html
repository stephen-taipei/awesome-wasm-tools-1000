<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TXT-007 文字反轉 - Awesome WASM Tools 1000</title>
  <meta name="description" content="反轉文字、行或單詞的順序">
  <link rel="stylesheet" href="/src/styles/global.css">
</head>
<body>
  <div class="tool-page">
    <header class="tool-header">
      <a href="/index.html" class="back-btn">
        <span>←</span>
        <span data-i18n="back">返回</span>
      </a>
      <div class="tool-title">
        <h1>TXT-007 <span data-i18n="txt007_name">文字反轉</span></h1>
        <p data-i18n="txt007_desc">反轉文字、行或單詞的順序</p>
      </div>
      <div class="lang-switcher">
        <button onclick="setLanguage('zh-TW')" class="lang-btn">繁中</button>
        <button onclick="setLanguage('en')" class="lang-btn">EN</button>
      </div>
    </header>

    <main class="tool-content">
      <div id="statusMessage" class="status-message"></div>

      <div class="input-section">
        <h3 data-i18n="input_text">輸入文字</h3>
        <textarea id="inputText" class="text-input" rows="8" placeholder="輸入文字..."></textarea>
      </div>

      <div class="button-grid">
        <button class="btn btn-primary" data-reverse="chars">
          <span>🔄</span>
          <span>反轉所有字元</span>
        </button>
        <button class="btn btn-primary" data-reverse="words">
          <span>📝</span>
          <span>反轉單詞順序</span>
        </button>
        <button class="btn btn-primary" data-reverse="lines">
          <span>📄</span>
          <span>反轉行順序</span>
        </button>
        <button class="btn btn-primary" data-reverse="each-word">
          <span>🔠</span>
          <span>反轉每個單詞</span>
        </button>
        <button class="btn btn-primary" data-reverse="each-line">
          <span>📋</span>
          <span>反轉每行字元</span>
        </button>
        <button class="btn btn-primary" data-reverse="sentences">
          <span>💬</span>
          <span>反轉句子順序</span>
        </button>
      </div>

      <div id="resultArea" class="result-area" style="display: none;">
        <h3 data-i18n="result">結果</h3>
        <textarea id="outputText" class="text-input" rows="8" readonly></textarea>
        <div class="action-buttons">
          <button id="copyBtn" class="btn btn-success">
            <span>📋</span>
            <span data-i18n="copy">複製結果</span>
          </button>
          <button id="clearBtn" class="btn btn-secondary">
            <span>🗑️</span>
            <span data-i18n="clear">清除</span>
          </button>
        </div>
      </div>
    </main>

    <footer class="footer">
      <p data-i18n="footer_privacy">所有檔案處理均在本地完成，不會上傳到伺服器</p>
    </footer>
  </div>

  <script type="module" src="/src/i18n/i18n.js"></script>
  <script type="module" src="./reverse.js"></script>
</body>
</html>
