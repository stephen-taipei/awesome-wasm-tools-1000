<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TXT-081 BibTeX 格式化 - Awesome WASM Tools 1000</title>
  <meta name="description" content="生成和格式化 BibTeX 參考文獻條目">
  <link rel="stylesheet" href="/src/styles/global.css">
</head>
<body>
  <div class="tool-page">
    <header class="tool-header">
      <a href="/index.html" class="back-btn">
        <span>←</span>
        <span data-i18n="back">返回</span>
      </a>
      <div class="tool-title">
        <h1>TXT-081 <span data-i18n="txt081_name">BibTeX 格式化</span></h1>
        <p data-i18n="txt081_desc">生成和格式化 BibTeX 參考文獻條目</p>
      </div>
      <div class="lang-switcher">
        <button onclick="setLanguage('zh-TW')" class="lang-btn">繁中</button>
        <button onclick="setLanguage('en')" class="lang-btn">EN</button>
      </div>
    </header>

    <main class="tool-content">
      <div id="statusMessage" class="status-message"></div>

      <div class="input-section">
        <h3 data-i18n="entry_type">條目類型</h3>
        <select id="entryType" class="select-input">
          <option value="article">@article - 期刊文章</option>
          <option value="book">@book - 書籍</option>
          <option value="inproceedings">@inproceedings - 會議論文</option>
          <option value="misc">@misc - 其他</option>
          <option value="phdthesis">@phdthesis - 博士論文</option>
          <option value="techreport">@techreport - 技術報告</option>
        </select>
      </div>

      <div class="input-section">
        <h3 data-i18n="entry_info">條目資訊</h3>
        <div class="form-grid" id="formFields"></div>
      </div>

      <div class="action-buttons">
        <button id="generateBtn" class="btn btn-primary">
          <span>📝</span>
          <span data-i18n="generate">生成</span>
        </button>
        <button id="clearBtn" class="btn btn-secondary">
          <span>🗑️</span>
          <span data-i18n="clear">清除</span>
        </button>
      </div>

      <div id="resultArea" class="result-area" style="display: none;">
        <h3 data-i18n="result">BibTeX 條目</h3>
        <textarea id="outputText" class="text-input code-output" rows="12" readonly></textarea>
        <button id="copyBtn" class="btn btn-secondary">
          <span>📋</span>
          <span data-i18n="copy">複製</span>
        </button>
      </div>
    </main>

    <footer class="footer">
      <p data-i18n="footer_privacy">所有檔案處理均在本地完成，不會上傳到伺服器</p>
    </footer>
  </div>

  <script type="module" src="/src/i18n/i18n.js"></script>
  <script type="module" src="./bibtex-formatter.js"></script>
</body>
</html>
