<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TXT-093 文字表格化 - Awesome WASM Tools 1000</title>
  <meta name="description" content="將文字資料轉換為表格格式">
  <link rel="stylesheet" href="/src/styles/global.css">
</head>
<body>
  <div class="tool-page">
    <header class="tool-header">
      <a href="/index.html" class="back-btn">
        <span>←</span>
        <span data-i18n="back">返回</span>
      </a>
      <div class="tool-title">
        <h1>TXT-093 <span data-i18n="txt093_name">文字表格化</span></h1>
        <p data-i18n="txt093_desc">將文字資料轉換為表格格式</p>
      </div>
      <div class="lang-switcher">
        <button onclick="setLanguage('zh-TW')" class="lang-btn">繁中</button>
        <button onclick="setLanguage('en')" class="lang-btn">EN</button>
      </div>
    </header>

    <main class="tool-content">
      <div id="statusMessage" class="status-message"></div>

      <div class="input-section">
        <h3 data-i18n="input_data">輸入資料 (CSV 或 Tab 分隔)</h3>
        <textarea id="inputText" class="text-input" rows="8" placeholder="名稱,數值,說明
蘋果,10,水果
香蕉,20,水果"></textarea>
      </div>

      <div class="options-section">
        <div class="option-row">
          <label>分隔符:</label>
          <select id="delimiter" class="select-input">
            <option value=",">逗號 (,)</option>
            <option value="\t">Tab</option>
            <option value="|">垂直線 (|)</option>
            <option value=";">分號 (;)</option>
          </select>
        </div>
        <div class="option-row">
          <label>表格樣式:</label>
          <select id="tableStyle" class="select-input">
            <option value="ascii">ASCII 框線</option>
            <option value="markdown">Markdown</option>
            <option value="html">HTML</option>
            <option value="simple">簡單</option>
          </select>
        </div>
        <label class="checkbox-label">
          <input type="checkbox" id="hasHeader" checked>
          <span>第一行為標題</span>
        </label>
      </div>

      <div class="action-buttons">
        <button id="convertBtn" class="btn btn-primary">
          <span>📊</span>
          <span data-i18n="convert">轉換</span>
        </button>
        <button id="clearBtn" class="btn btn-secondary">
          <span>🗑️</span>
          <span data-i18n="clear">清除</span>
        </button>
      </div>

      <div id="resultArea" class="result-area" style="display: none;">
        <h3 data-i18n="result">表格結果</h3>
        <pre id="outputText" class="text-output monospace"></pre>
        <button id="copyBtn" class="btn btn-secondary">
          <span>📋</span>
          <span data-i18n="copy">複製</span>
        </button>
      </div>
    </main>

    <footer class="footer">
      <p data-i18n="footer_privacy">所有檔案處理均在本地完成，不會上傳到伺服器</p>
    </footer>
  </div>

  <script type="module" src="/src/i18n/i18n.js"></script>
  <script type="module" src="./text-table.js"></script>
</body>
</html>
