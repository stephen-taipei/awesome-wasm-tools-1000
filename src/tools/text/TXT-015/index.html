<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TXT-015 姓名生成器 - Awesome WASM Tools 1000</title>
  <meta name="description" content="生成隨機中英文姓名">
  <link rel="stylesheet" href="/src/styles/global.css">
</head>
<body>
  <div class="tool-page">
    <header class="tool-header">
      <a href="/index.html" class="back-btn">
        <span>←</span>
        <span data-i18n="back">返回</span>
      </a>
      <div class="tool-title">
        <h1>TXT-015 <span data-i18n="txt015_name">姓名生成器</span></h1>
        <p data-i18n="txt015_desc">生成隨機中英文姓名</p>
      </div>
      <div class="lang-switcher">
        <button onclick="setLanguage('zh-TW')" class="lang-btn">繁中</button>
        <button onclick="setLanguage('en')" class="lang-btn">EN</button>
      </div>
    </header>

    <main class="tool-content">
      <div id="statusMessage" class="status-message"></div>

      <div class="settings-panel">
        <h3 data-i18n="settings">設定</h3>
        <div class="setting-row">
          <label data-i18n="name_type">類型</label>
          <select id="nameType">
            <option value="chinese">中文姓名</option>
            <option value="english">英文姓名</option>
            <option value="japanese">日文姓名</option>
            <option value="korean">韓文姓名</option>
          </select>
        </div>
        <div class="setting-row">
          <label data-i18n="gender">性別</label>
          <select id="gender">
            <option value="any">任意</option>
            <option value="male">男性</option>
            <option value="female">女性</option>
          </select>
        </div>
        <div class="setting-row">
          <label data-i18n="count">數量</label>
          <input type="number" id="count" value="10" min="1" max="100">
        </div>
      </div>

      <div class="action-buttons">
        <button id="generateBtn" class="btn btn-primary">
          <span>✨</span>
          <span data-i18n="generate">生成</span>
        </button>
        <button id="copyBtn" class="btn btn-success" style="display: none;">
          <span>📋</span>
          <span data-i18n="copy">複製</span>
        </button>
        <button id="clearBtn" class="btn btn-secondary">
          <span>🗑️</span>
          <span data-i18n="clear">清除</span>
        </button>
      </div>

      <div id="resultArea" class="result-area" style="display: none;">
        <h3 data-i18n="result">結果</h3>
        <div id="nameList" class="name-list"></div>
      </div>
    </main>

    <footer class="footer">
      <p data-i18n="footer_privacy">所有檔案處理均在本地完成，不會上傳到伺服器</p>
    </footer>
  </div>

  <script type="module" src="/src/i18n/i18n.js"></script>
  <script type="module" src="./namegen.js"></script>
</body>
</html>
