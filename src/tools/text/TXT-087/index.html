<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TXT-087 縮排轉換 - Awesome WASM Tools 1000</title>
  <meta name="description" content="在空格和 Tab 縮排之間轉換">
  <link rel="stylesheet" href="/src/styles/global.css">
</head>
<body>
  <div class="tool-page">
    <header class="tool-header">
      <a href="/index.html" class="back-btn">
        <span>←</span>
        <span data-i18n="back">返回</span>
      </a>
      <div class="tool-title">
        <h1>TXT-087 <span data-i18n="txt087_name">縮排轉換</span></h1>
        <p data-i18n="txt087_desc">在空格和 Tab 縮排之間轉換</p>
      </div>
      <div class="lang-switcher">
        <button onclick="setLanguage('zh-TW')" class="lang-btn">繁中</button>
        <button onclick="setLanguage('en')" class="lang-btn">EN</button>
      </div>
    </header>

    <main class="tool-content">
      <div id="statusMessage" class="status-message"></div>

      <div class="input-section">
        <h3 data-i18n="input_code">輸入程式碼</h3>
        <textarea id="inputCode" class="text-input code-input" rows="10" placeholder="在此貼上程式碼..."></textarea>
      </div>

      <div class="options-section">
        <h3 data-i18n="conversion">轉換選項</h3>
        <div class="radio-group">
          <label class="radio-label">
            <input type="radio" name="convType" value="tabsToSpaces" checked>
            <span>Tab 轉空格</span>
          </label>
          <label class="radio-label">
            <input type="radio" name="convType" value="spacesToTabs">
            <span>空格轉 Tab</span>
          </label>
        </div>
        <div class="option-row">
          <label>空格數量:</label>
          <select id="spaceCount" class="select-input">
            <option value="2">2 個空格</option>
            <option value="4" selected>4 個空格</option>
            <option value="8">8 個空格</option>
          </select>
        </div>
      </div>

      <div class="action-buttons">
        <button id="convertBtn" class="btn btn-primary">
          <span>🔄</span>
          <span data-i18n="convert">轉換</span>
        </button>
        <button id="clearBtn" class="btn btn-secondary">
          <span>🗑️</span>
          <span data-i18n="clear">清除</span>
        </button>
      </div>

      <div id="resultArea" class="result-area" style="display: none;">
        <h3 data-i18n="result">轉換結果</h3>
        <textarea id="outputCode" class="text-input code-input" rows="10" readonly></textarea>
        <button id="copyBtn" class="btn btn-secondary">
          <span>📋</span>
          <span data-i18n="copy">複製</span>
        </button>
      </div>
    </main>

    <footer class="footer">
      <p data-i18n="footer_privacy">所有檔案處理均在本地完成，不會上傳到伺服器</p>
    </footer>
  </div>

  <script type="module" src="/src/i18n/i18n.js"></script>
  <script type="module" src="./indent-converter.js"></script>
</body>
</html>
