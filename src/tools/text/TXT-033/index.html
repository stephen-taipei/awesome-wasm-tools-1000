<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TXT-033 XML 驗證 - Awesome WASM Tools 1000</title>
  <meta name="description" content="驗證 XML 資料格式是否正確">
  <link rel="stylesheet" href="/src/styles/global.css">
</head>
<body>
  <div class="tool-page">
    <header class="tool-header">
      <a href="/index.html" class="back-btn">
        <span>←</span>
        <span data-i18n="back">返回</span>
      </a>
      <div class="tool-title">
        <h1>TXT-033 <span data-i18n="txt033_name">XML 驗證</span></h1>
        <p data-i18n="txt033_desc">驗證 XML 資料格式是否正確</p>
      </div>
      <div class="lang-switcher">
        <button onclick="setLanguage('zh-TW')" class="lang-btn">繁中</button>
        <button onclick="setLanguage('en')" class="lang-btn">EN</button>
      </div>
    </header>

    <main class="tool-content">
      <div id="statusMessage" class="status-message"></div>

      <div class="input-section">
        <h3 data-i18n="input_xml">輸入 XML</h3>
        <textarea id="inputText" class="text-input code-input" rows="15" placeholder="<root><item>value</item></root>"></textarea>
      </div>

      <div class="action-buttons">
        <button id="validateBtn" class="btn btn-primary">
          <span>✅</span>
          <span data-i18n="validate">驗證</span>
        </button>
        <button id="clearBtn" class="btn btn-secondary">
          <span>🗑️</span>
          <span data-i18n="clear">清除</span>
        </button>
      </div>

      <div id="resultArea" class="result-area" style="display: none;">
        <div id="validationResult" class="validation-result"></div>
        <div id="xmlInfo" class="json-info" style="display: none;">
          <h4>XML 結構</h4>
          <div class="stats-grid">
            <div class="stat-item">
              <span class="stat-label">根元素</span>
              <span id="rootElement" class="stat-value">-</span>
            </div>
            <div class="stat-item">
              <span class="stat-label">元素數量</span>
              <span id="elementCount" class="stat-value">0</span>
            </div>
            <div class="stat-item">
              <span class="stat-label">屬性數量</span>
              <span id="attributeCount" class="stat-value">0</span>
            </div>
            <div class="stat-item">
              <span class="stat-label">最大深度</span>
              <span id="maxDepth" class="stat-value">0</span>
            </div>
          </div>
          <h4>元素樹</h4>
          <pre id="elementTree" class="code-output"></pre>
        </div>
      </div>
    </main>

    <footer class="footer">
      <p data-i18n="footer_privacy">所有檔案處理均在本地完成，不會上傳到伺服器</p>
    </footer>
  </div>

  <script type="module" src="/src/i18n/i18n.js"></script>
  <script type="module" src="./xmlvalidate.js"></script>
</body>
</html>
