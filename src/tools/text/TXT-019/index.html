<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TXT-019 關鍵詞提取 - Awesome WASM Tools 1000</title>
  <meta name="description" content="從文章中提取關鍵詞">
  <link rel="stylesheet" href="/src/styles/global.css">
</head>
<body>
  <div class="tool-page">
    <header class="tool-header">
      <a href="/index.html" class="back-btn">
        <span>←</span>
        <span data-i18n="back">返回</span>
      </a>
      <div class="tool-title">
        <h1>TXT-019 <span data-i18n="txt019_name">關鍵詞提取</span></h1>
        <p data-i18n="txt019_desc">從文章中提取關鍵詞</p>
      </div>
      <div class="lang-switcher">
        <button onclick="setLanguage('zh-TW')" class="lang-btn">繁中</button>
        <button onclick="setLanguage('en')" class="lang-btn">EN</button>
      </div>
    </header>

    <main class="tool-content">
      <div id="statusMessage" class="status-message"></div>

      <div class="input-section">
        <h3 data-i18n="input_text">輸入文章</h3>
        <textarea id="inputText" class="text-input" rows="10" placeholder="輸入或貼上文章內容..."></textarea>
      </div>

      <div class="settings-panel">
        <h3 data-i18n="settings">設定</h3>
        <div class="setting-row">
          <label data-i18n="keyword_count">關鍵詞數量</label>
          <input type="number" id="keywordCount" value="10" min="1" max="50">
        </div>
        <div class="setting-row">
          <label data-i18n="min_word_length">最小詞長</label>
          <input type="number" id="minWordLength" value="2" min="1" max="10">
        </div>
      </div>

      <div class="action-buttons">
        <button id="extractBtn" class="btn btn-primary">
          <span>🔑</span>
          <span data-i18n="extract">提取關鍵詞</span>
        </button>
        <button id="copyBtn" class="btn btn-success" style="display: none;">
          <span>📋</span>
          <span data-i18n="copy">複製</span>
        </button>
        <button id="clearBtn" class="btn btn-secondary">
          <span>🗑️</span>
          <span data-i18n="clear">清除</span>
        </button>
      </div>

      <div id="resultArea" class="result-area" style="display: none;">
        <h3 data-i18n="keywords">關鍵詞</h3>
        <div id="keywordCloud" class="keyword-cloud"></div>
        <h4 data-i18n="keyword_list">關鍵詞列表</h4>
        <table class="data-table">
          <thead>
            <tr>
              <th data-i18n="rank">排名</th>
              <th data-i18n="keyword">關鍵詞</th>
              <th data-i18n="score">分數</th>
              <th data-i18n="frequency">頻率</th>
            </tr>
          </thead>
          <tbody id="keywordTable"></tbody>
        </table>
      </div>
    </main>

    <footer class="footer">
      <p data-i18n="footer_privacy">所有檔案處理均在本地完成，不會上傳到伺服器</p>
    </footer>
  </div>

  <script type="module" src="/src/i18n/i18n.js"></script>
  <script type="module" src="./keywords.js"></script>
</body>
</html>
