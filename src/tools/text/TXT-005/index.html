<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TXT-005 文字排序 - Awesome WASM Tools 1000</title>
  <meta name="description" content="對文字行進行排序，支援多種排序方式">
  <link rel="stylesheet" href="/src/styles/global.css">
</head>
<body>
  <div class="tool-page">
    <header class="tool-header">
      <a href="/index.html" class="back-btn">
        <span>←</span>
        <span data-i18n="back">返回</span>
      </a>
      <div class="tool-title">
        <h1>TXT-005 <span data-i18n="txt005_name">文字排序</span></h1>
        <p data-i18n="txt005_desc">對文字行進行排序</p>
      </div>
      <div class="lang-switcher">
        <button onclick="setLanguage('zh-TW')" class="lang-btn">繁中</button>
        <button onclick="setLanguage('en')" class="lang-btn">EN</button>
      </div>
    </header>

    <main class="tool-content">
      <div id="statusMessage" class="status-message"></div>

      <div class="input-section">
        <h3 data-i18n="input_text">輸入文字</h3>
        <textarea id="inputText" class="text-input" rows="10" placeholder="輸入文字，每行一個項目..."></textarea>
      </div>

      <div class="settings-panel">
        <h3 data-i18n="settings">設定</h3>
        <div class="setting-row">
          <label data-i18n="sort_type">排序類型</label>
          <select id="sortType">
            <option value="alpha">字母順序</option>
            <option value="alphaDesc">字母倒序</option>
            <option value="numeric">數字順序</option>
            <option value="numericDesc">數字倒序</option>
            <option value="length">長度順序</option>
            <option value="lengthDesc">長度倒序</option>
            <option value="random">隨機排序</option>
            <option value="reverse">反轉順序</option>
          </select>
        </div>
        <div class="setting-row">
          <label data-i18n="ignore_case">忽略大小寫</label>
          <input type="checkbox" id="ignoreCase" checked>
        </div>
        <div class="setting-row">
          <label data-i18n="remove_empty">移除空行</label>
          <input type="checkbox" id="removeEmpty">
        </div>
        <div class="setting-row">
          <label data-i18n="natural_sort">自然排序</label>
          <input type="checkbox" id="naturalSort" checked>
        </div>
      </div>

      <div class="action-buttons">
        <button id="sortBtn" class="btn btn-primary">
          <span>🔤</span>
          <span data-i18n="sort">排序</span>
        </button>
        <button id="copyBtn" class="btn btn-success" style="display: none;">
          <span>📋</span>
          <span data-i18n="copy">複製結果</span>
        </button>
        <button id="clearBtn" class="btn btn-secondary">
          <span>🗑️</span>
          <span data-i18n="clear">清除</span>
        </button>
      </div>

      <div id="resultArea" class="result-area" style="display: none;">
        <h3 data-i18n="result">結果</h3>
        <div class="stats-summary">
          <span>行數: <strong id="lineCount">0</strong></span>
        </div>
        <textarea id="outputText" class="text-input" rows="10" readonly></textarea>
      </div>
    </main>

    <footer class="footer">
      <p data-i18n="footer_privacy">所有檔案處理均在本地完成，不會上傳到伺服器</p>
    </footer>
  </div>

  <script type="module" src="/src/i18n/i18n.js"></script>
  <script type="module" src="./sort.js"></script>
</body>
</html>
