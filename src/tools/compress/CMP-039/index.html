<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CMP-039 自解壓檔建立 - Awesome WASM Tools 1000</title>
  <meta name="description" content="建立可自動解壓縮的 HTML 檔案，完全在本地處理">
  <link rel="stylesheet" href="/src/styles/global.css">
</head>
<body>
  <div class="tool-page">
    <header class="tool-header">
      <a href="/index.html" class="back-btn">
        <span>←</span>
        <span data-i18n="back">返回</span>
      </a>
      <div class="tool-title">
        <h1>CMP-039 <span data-i18n="cmp039_name">自解壓檔建立</span></h1>
        <p data-i18n="cmp039_desc">建立可在瀏覽器中自動解壓的 HTML 檔案</p>
      </div>
      <div class="lang-switcher">
        <button onclick="setLanguage('zh-TW')" class="lang-btn">繁中</button>
        <button onclick="setLanguage('en')" class="lang-btn">EN</button>
      </div>
    </header>

    <main class="tool-content">
      <div id="statusMessage" class="status-message"></div>

      <div id="uploadArea" class="upload-area">
        <div class="icon">📦</div>
        <h3 data-i18n="upload_title">拖放檔案到此處</h3>
        <p data-i18n="upload_subtitle">或點擊選擇檔案</p>
        <p class="upload-formats" data-i18n="upload_formats">支援任意檔案類型</p>
        <input type="file" id="fileInput" class="file-input" multiple>
      </div>

      <div id="fileList" class="settings-panel" style="display: none;">
        <h3>📁 已選擇的檔案</h3>
        <div id="fileListContent" class="file-list"></div>
        <div class="setting-row">
          <label>檔案數量</label>
          <span id="fileCount">0 個</span>
        </div>
        <div class="setting-row">
          <label>總大小</label>
          <span id="totalSize">0 Bytes</span>
        </div>
      </div>

      <div class="settings-panel">
        <h3>⚙️ 設定</h3>
        <div class="setting-row">
          <label>輸出檔名</label>
          <input type="text" id="outputName" value="self_extract" placeholder="self_extract">
        </div>
        <div class="setting-row">
          <label>標題</label>
          <input type="text" id="archiveTitle" value="自解壓壓縮檔" placeholder="壓縮檔標題">
        </div>
        <div class="setting-row">
          <label>
            <input type="checkbox" id="includePreview" checked>
            顯示檔案預覽列表
          </label>
        </div>
      </div>

      <div id="progressContainer" class="progress-container">
        <div class="progress-bar">
          <div id="progressFill" class="progress-fill"></div>
        </div>
        <p id="progressText" class="progress-text">準備中...</p>
      </div>

      <div class="action-buttons">
        <button id="createBtn" class="btn btn-primary" disabled>
          <span>📦</span>
          <span data-i18n="create">建立自解壓檔</span>
        </button>
        <button id="downloadBtn" class="btn btn-success" style="display: none;">
          <span>💾</span>
          <span data-i18n="download">下載 HTML 檔案</span>
        </button>
        <button id="resetBtn" class="btn btn-secondary" style="display: none;">
          <span>🗑️</span>
          <span data-i18n="reset">重置</span>
        </button>
      </div>

      <div id="resultPanel" class="settings-panel" style="display: none;">
        <h3>✅ 建立完成</h3>
        <div class="setting-row">
          <label>輸出檔案</label>
          <span id="outputFileName">-</span>
        </div>
        <div class="setting-row">
          <label>檔案大小</label>
          <span id="outputFileSize">-</span>
        </div>
        <div class="info-note">
          <p>此 HTML 檔案可以在任何瀏覽器中開啟並解壓縮內含的檔案。</p>
        </div>
      </div>
    </main>

    <footer class="footer">
      <p data-i18n="footer_privacy">所有檔案處理均在本地完成，不會上傳到伺服器</p>
    </footer>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script type="module" src="/src/i18n/i18n.js"></script>
  <script type="module" src="./sfx.js"></script>
</body>
</html>
