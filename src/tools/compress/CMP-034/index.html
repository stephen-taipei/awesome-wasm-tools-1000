<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CMP-034 分卷壓縮 - Awesome WASM Tools 1000</title>
  <meta name="description" content="將檔案壓縮並分割成多個分卷，完全在本地處理">
  <link rel="stylesheet" href="/src/styles/global.css">
</head>
<body>
  <div class="tool-page">
    <header class="tool-header">
      <a href="/index.html" class="back-btn">
        <span>←</span>
        <span data-i18n="back">返回</span>
      </a>
      <div class="tool-title">
        <h1>CMP-034 <span data-i18n="cmp034_name">分卷壓縮</span></h1>
        <p data-i18n="cmp034_desc">將檔案壓縮並分割成多個分卷</p>
      </div>
      <div class="lang-switcher">
        <button onclick="setLanguage('zh-TW')" class="lang-btn">繁中</button>
        <button onclick="setLanguage('en')" class="lang-btn">EN</button>
      </div>
    </header>

    <main class="tool-content">
      <div id="statusMessage" class="status-message"></div>

      <div id="uploadArea" class="upload-area">
        <div class="icon">✂️</div>
        <h3 data-i18n="upload_title">拖放檔案到此處</h3>
        <p data-i18n="upload_subtitle">或點擊選擇檔案</p>
        <p class="upload-formats" data-i18n="upload_formats">支援任意檔案類型</p>
        <input type="file" id="fileInput" class="file-input" multiple>
      </div>

      <div class="settings-panel">
        <h3>⚙️ 分卷設定</h3>
        <div class="setting-row">
          <label>每卷大小</label>
          <div class="input-group">
            <input type="number" id="volumeSize" value="10" min="1" max="1000">
            <select id="volumeUnit">
              <option value="kb">KB</option>
              <option value="mb" selected>MB</option>
              <option value="gb">GB</option>
            </select>
          </div>
        </div>
        <div class="setting-row">
          <label>預設大小</label>
          <div class="preset-buttons">
            <button class="preset-btn" onclick="window.splitArchive.setVolumeSize(1.44, 'mb')">1.44 MB (軟碟)</button>
            <button class="preset-btn" onclick="window.splitArchive.setVolumeSize(100, 'mb')">100 MB</button>
            <button class="preset-btn" onclick="window.splitArchive.setVolumeSize(700, 'mb')">700 MB (CD)</button>
            <button class="preset-btn" onclick="window.splitArchive.setVolumeSize(4.7, 'gb')">4.7 GB (DVD)</button>
          </div>
        </div>
      </div>

      <div id="fileInfo" class="settings-panel" style="display: none;">
        <h3>📁 檔案資訊</h3>
        <div class="setting-row">
          <label>檔案數量</label>
          <span id="fileCount">-</span>
        </div>
        <div class="setting-row">
          <label>總大小</label>
          <span id="totalSize">-</span>
        </div>
        <div class="setting-row">
          <label>預估分卷數</label>
          <span id="estimatedVolumes">-</span>
        </div>
      </div>

      <div id="progressContainer" class="progress-container">
        <div class="progress-bar">
          <div id="progressFill" class="progress-fill"></div>
        </div>
        <p id="progressText" class="progress-text">準備中...</p>
      </div>

      <div class="action-buttons">
        <button id="splitBtn" class="btn btn-primary" disabled>
          <span>✂️</span>
          <span data-i18n="split">開始分卷壓縮</span>
        </button>
        <button id="downloadAllBtn" class="btn btn-success" style="display: none;">
          <span>💾</span>
          <span data-i18n="download_all">下載全部分卷</span>
        </button>
        <button id="resetBtn" class="btn btn-secondary" style="display: none;">
          <span>🗑️</span>
          <span data-i18n="reset">重置</span>
        </button>
      </div>

      <div id="resultPanel" class="settings-panel" style="display: none;">
        <h3>✅ 分卷結果</h3>
        <div id="resultList" class="result-list"></div>
      </div>
    </main>

    <footer class="footer">
      <p data-i18n="footer_privacy">所有檔案處理均在本地完成，不會上傳到伺服器</p>
    </footer>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script type="module" src="/src/i18n/i18n.js"></script>
  <script type="module" src="./split.js"></script>
</body>
</html>
