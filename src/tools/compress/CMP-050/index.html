<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CMP-050 多執行緒壓縮 - Awesome WASM Tools 1000</title>
  <meta name="description" content="使用 Web Workers 進行多執行緒並行壓縮">
  <link rel="stylesheet" href="/src/styles/global.css">
</head>
<body>
  <div class="tool-page">
    <header class="tool-header">
      <a href="/index.html" class="back-btn">
        <span>←</span>
        <span data-i18n="back">返回</span>
      </a>
      <div class="tool-title">
        <h1>CMP-050 <span data-i18n="cmp050_name">多執行緒壓縮</span></h1>
        <p data-i18n="cmp050_desc">使用 Web Workers 進行多執行緒並行壓縮</p>
      </div>
      <div class="lang-switcher">
        <button onclick="setLanguage('zh-TW')" class="lang-btn">繁中</button>
        <button onclick="setLanguage('en')" class="lang-btn">EN</button>
      </div>
    </header>

    <main class="tool-content">
      <div id="statusMessage" class="status-message"></div>

      <div id="systemInfo" class="settings-panel">
        <h3>🖥️ 系統資訊</h3>
        <div class="setting-row">
          <label>CPU 核心數</label>
          <span id="cpuCores">檢測中...</span>
        </div>
        <div class="setting-row">
          <label>建議執行緒數</label>
          <span id="recommendedThreads">-</span>
        </div>
        <div class="setting-row">
          <label>Web Workers 支援</label>
          <span id="workersSupport">檢測中...</span>
        </div>
      </div>

      <div id="uploadArea" class="upload-area">
        <div class="icon">⚡</div>
        <h3 data-i18n="upload_title">拖放檔案到此處</h3>
        <p data-i18n="upload_subtitle">或點擊選擇要壓縮的檔案</p>
        <p class="upload-formats" data-i18n="upload_formats">多執行緒加速大型檔案壓縮</p>
        <input type="file" id="fileInput" class="file-input">
      </div>

      <div id="fileInfo" class="file-info" style="display: none;">
        <h3>檔案資訊</h3>
        <p id="fileName">檔名: -</p>
        <p id="fileSize">大小: -</p>
      </div>

      <div class="settings-panel">
        <h3 data-i18n="settings">多執行緒設定</h3>
        <div class="setting-row">
          <label data-i18n="thread_count">執行緒數量</label>
          <select id="threadCount">
            <option value="1">1 執行緒</option>
            <option value="2">2 執行緒</option>
            <option value="4" selected>4 執行緒</option>
            <option value="8">8 執行緒</option>
            <option value="16">16 執行緒</option>
          </select>
        </div>
        <div class="setting-row">
          <label data-i18n="compression_level">壓縮等級</label>
          <select id="compressionLevel">
            <option value="1">1 - 最快</option>
            <option value="5">5 - 平衡</option>
            <option value="6" selected>6 - 標準</option>
            <option value="9">9 - 最佳</option>
          </select>
        </div>
        <div class="setting-row">
          <label data-i18n="output_filename">輸出檔名</label>
          <input type="text" id="outputFilename" placeholder="輸入檔名">
        </div>
      </div>

      <div id="threadMonitor" class="settings-panel">
        <h3>⚡ 執行緒狀態</h3>
        <div id="threadStatus"></div>
        <div class="setting-row">
          <label>活躍執行緒</label>
          <span id="activeThreads">0</span>
        </div>
        <div class="setting-row">
          <label>已完成區塊</label>
          <span id="completedChunks">0 / 0</span>
        </div>
        <div class="setting-row">
          <label>總處理速度</label>
          <span id="totalSpeed">- MB/s</span>
        </div>
      </div>

      <div id="progressContainer" class="progress-container">
        <div class="progress-bar">
          <div id="progressFill" class="progress-fill"></div>
        </div>
        <p id="progressText" class="progress-text">準備中...</p>
      </div>

      <div class="action-buttons">
        <button id="compressBtn" class="btn btn-primary" disabled>
          <span>⚡</span>
          <span data-i18n="compress">開始多執行緒壓縮</span>
        </button>
        <button id="downloadBtn" class="btn btn-success" style="display: none;">
          <span>⬇️</span>
          <span data-i18n="download">下載檔案</span>
        </button>
        <button id="resetBtn" class="btn btn-secondary" style="display: none;">
          <span>🗑️</span>
          <span data-i18n="reset">重置</span>
        </button>
      </div>

      <div id="performanceInfo" class="settings-panel" style="display: none;">
        <h3>📈 效能統計</h3>
        <div class="setting-row">
          <label>處理時間</label>
          <span id="processTime">-</span>
        </div>
        <div class="setting-row">
          <label>原始大小</label>
          <span id="originalSize">-</span>
        </div>
        <div class="setting-row">
          <label>壓縮後大小</label>
          <span id="compressedSize">-</span>
        </div>
        <div class="setting-row">
          <label>壓縮比</label>
          <span id="compressionRatio">-</span>
        </div>
        <div class="setting-row">
          <label>平均速度</label>
          <span id="avgSpeed">-</span>
        </div>
        <div class="setting-row">
          <label>加速比</label>
          <span id="speedup">-</span>
        </div>
      </div>
    </main>

    <footer class="footer">
      <p data-i18n="footer_privacy">所有檔案處理均在本地完成，不會上傳到伺服器</p>
    </footer>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js"></script>
  <script type="module" src="/src/i18n/i18n.js"></script>
  <script type="module" src="./multithread-compress.js"></script>
</body>
</html>
