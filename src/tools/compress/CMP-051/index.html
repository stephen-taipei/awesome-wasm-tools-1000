<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CMP-051 ISO 映像檔建立 - Awesome WASM Tools 1000</title>
  <meta name="description" content="建立 ISO 9660 格式的映像檔">
  <link rel="stylesheet" href="/src/styles/global.css">
</head>
<body>
  <div class="tool-page">
    <header class="tool-header">
      <a href="/index.html" class="back-btn">
        <span>←</span>
        <span data-i18n="back">返回</span>
      </a>
      <div class="tool-title">
        <h1>CMP-051 <span data-i18n="cmp051_name">ISO 映像檔建立</span></h1>
        <p data-i18n="cmp051_desc">建立 ISO 9660 格式的映像檔</p>
      </div>
      <div class="lang-switcher">
        <button onclick="setLanguage('zh-TW')" class="lang-btn">繁中</button>
        <button onclick="setLanguage('en')" class="lang-btn">EN</button>
      </div>
    </header>

    <main class="tool-content">
      <div id="statusMessage" class="status-message"></div>

      <div id="uploadArea" class="upload-area">
        <div class="icon">💿</div>
        <h3 data-i18n="upload_title">拖放檔案到此處</h3>
        <p data-i18n="upload_subtitle">或點擊選擇要打包成 ISO 的檔案</p>
        <p class="upload-formats" data-i18n="upload_formats">支援任何類型的檔案（可多選）</p>
        <input type="file" id="fileInput" class="file-input" multiple>
      </div>

      <div id="fileList" class="file-list" style="display: none;">
        <h3>已選擇的檔案</h3>
        <ul id="selectedFiles"></ul>
        <p id="totalSize" class="total-size"></p>
      </div>

      <div class="settings-panel">
        <h3 data-i18n="settings">ISO 設定</h3>
        <div class="setting-row">
          <label data-i18n="volume_name">卷標名稱</label>
          <input type="text" id="volumeName" value="UNTITLED" placeholder="ISO 卷標">
        </div>
        <div class="setting-row">
          <label data-i18n="iso_level">ISO 等級</label>
          <select id="isoLevel">
            <option value="1">Level 1 (8.3 檔名)</option>
            <option value="2" selected>Level 2 (31 字元)</option>
            <option value="3">Level 3 (長檔名)</option>
          </select>
        </div>
        <div class="setting-row">
          <label data-i18n="output_filename">輸出檔名</label>
          <input type="text" id="outputFilename" value="image" placeholder="輸入檔名">
        </div>
      </div>

      <div id="progressContainer" class="progress-container">
        <div class="progress-bar">
          <div id="progressFill" class="progress-fill"></div>
        </div>
        <p id="progressText" class="progress-text">準備中...</p>
      </div>

      <div class="action-buttons">
        <button id="createBtn" class="btn btn-primary" disabled>
          <span>💿</span>
          <span data-i18n="create">建立 ISO</span>
        </button>
        <button id="downloadBtn" class="btn btn-success" style="display: none;">
          <span>⬇️</span>
          <span data-i18n="download">下載 ISO</span>
        </button>
        <button id="resetBtn" class="btn btn-secondary" style="display: none;">
          <span>🗑️</span>
          <span data-i18n="reset">重置</span>
        </button>
      </div>

      <div id="performanceInfo" class="settings-panel" style="display: none;">
        <h3>📊 ISO 資訊</h3>
        <div class="setting-row">
          <label>處理時間</label>
          <span id="processTime">-</span>
        </div>
        <div class="setting-row">
          <label>檔案數量</label>
          <span id="fileCount">-</span>
        </div>
        <div class="setting-row">
          <label>ISO 大小</label>
          <span id="isoSize">-</span>
        </div>
      </div>
    </main>

    <footer class="footer">
      <p data-i18n="footer_privacy">所有檔案處理均在本地完成，不會上傳到伺服器</p>
    </footer>
  </div>

  <script type="module" src="/src/i18n/i18n.js"></script>
  <script type="module" src="./iso-create.js"></script>
</body>
</html>
