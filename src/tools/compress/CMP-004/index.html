<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CMP-004 ZIP 密碼解壓 - Awesome WASM Tools 1000</title>
  <meta name="description" content="解壓縮有密碼保護的 ZIP 檔案，完全在本地處理">
  <link rel="stylesheet" href="/src/styles/global.css">
</head>
<body>
  <div class="tool-page">
    <header class="tool-header">
      <a href="/index.html" class="back-btn">
        <span>←</span>
        <span data-i18n="back">返回</span>
      </a>
      <div class="tool-title">
        <h1>CMP-004 <span data-i18n="cmp004_name">ZIP 密碼解壓</span></h1>
        <p data-i18n="cmp004_desc">解壓縮有密碼保護的 ZIP 檔案</p>
      </div>
      <div class="lang-switcher">
        <button onclick="setLanguage('zh-TW')" class="lang-btn">繁中</button>
        <button onclick="setLanguage('en')" class="lang-btn">EN</button>
      </div>
    </header>

    <main class="tool-content">
      <div id="statusMessage" class="status-message"></div>

      <div id="uploadArea" class="upload-area">
        <div class="icon">🔓</div>
        <h3 data-i18n="upload_title">拖放加密 ZIP 檔案到此處</h3>
        <p data-i18n="upload_subtitle">或點擊選擇檔案</p>
        <p class="upload-formats" data-i18n="upload_formats">支援格式：.zip.enc</p>
        <input type="file" id="fileInput" class="file-input" accept=".enc,.zip.enc">
      </div>

      <div class="settings-panel">
        <h3 data-i18n="settings">解密設定</h3>
        <div class="setting-row">
          <label data-i18n="password">密碼</label>
          <input type="password" id="password" placeholder="輸入解密密碼">
        </div>
      </div>

      <div id="progressContainer" class="progress-container">
        <div class="progress-bar">
          <div id="progressFill" class="progress-fill"></div>
        </div>
        <p id="progressText" class="progress-text" data-i18n="decrypting">解密中...</p>
      </div>

      <div id="fileList" class="file-list" style="display: none;">
        <h3>解壓後的檔案</h3>
        <ul id="extractedFiles"></ul>
        <p id="totalFiles" class="total-size"></p>
      </div>

      <div class="action-buttons">
        <button id="decryptBtn" class="btn btn-primary" disabled>
          <span>🔑</span>
          <span data-i18n="decrypt">解密解壓</span>
        </button>
        <button id="downloadAllBtn" class="btn btn-success" style="display: none;">
          <span>⬇️</span>
          <span data-i18n="download_all">下載全部</span>
        </button>
        <button id="resetBtn" class="btn btn-secondary" style="display: none;">
          <span>🗑️</span>
          <span data-i18n="reset">重置</span>
        </button>
      </div>

      <div id="performanceInfo" class="settings-panel" style="display: none;">
        <h3>📊 解密資訊</h3>
        <div class="setting-row">
          <label>處理時間</label>
          <span id="processTime">-</span>
        </div>
        <div class="setting-row">
          <label>加密方式</label>
          <span id="encryptionUsed">-</span>
        </div>
        <div class="setting-row">
          <label>檔案數量</label>
          <span id="fileCount">-</span>
        </div>
      </div>
    </main>

    <footer class="footer">
      <p data-i18n="footer_privacy">所有檔案處理均在本地完成，不會上傳到伺服器</p>
    </footer>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
  <script type="module" src="/src/i18n/i18n.js"></script>
  <script type="module" src="./decrypt.js"></script>
</body>
</html>
