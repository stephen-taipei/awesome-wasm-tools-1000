<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CMP-057 壓縮檔註解編輯 - Awesome WASM Tools 1000</title>
  <meta name="description" content="編輯 ZIP 壓縮檔的註解資訊">
  <link rel="stylesheet" href="/src/styles/global.css">
</head>
<body>
  <div class="tool-page">
    <header class="tool-header">
      <a href="/index.html" class="back-btn">
        <span>←</span>
        <span data-i18n="back">返回</span>
      </a>
      <div class="tool-title">
        <h1>CMP-057 <span data-i18n="cmp057_name">壓縮檔註解編輯</span></h1>
        <p data-i18n="cmp057_desc">編輯 ZIP 壓縮檔的註解資訊</p>
      </div>
      <div class="lang-switcher">
        <button onclick="setLanguage('zh-TW')" class="lang-btn">繁中</button>
        <button onclick="setLanguage('en')" class="lang-btn">EN</button>
      </div>
    </header>

    <main class="tool-content">
      <div id="statusMessage" class="status-message"></div>

      <div id="uploadArea" class="upload-area">
        <div class="icon">📝</div>
        <h3 data-i18n="upload_title">拖放 ZIP 檔案到此處</h3>
        <p data-i18n="upload_subtitle">或點擊選擇 ZIP 壓縮檔</p>
        <p class="upload-formats" data-i18n="upload_formats">支援 .zip 格式</p>
        <input type="file" id="fileInput" class="file-input" accept=".zip">
      </div>

      <div id="archiveInfo" class="settings-panel" style="display: none;">
        <h3>📦 壓縮檔資訊</h3>
        <div class="setting-row">
          <label>檔案名稱</label>
          <span id="archiveName">-</span>
        </div>
        <div class="setting-row">
          <label>檔案大小</label>
          <span id="archiveSize">-</span>
        </div>
        <div class="setting-row">
          <label>內含檔案數</label>
          <span id="fileCount">-</span>
        </div>
      </div>

      <div id="commentEditor" class="settings-panel" style="display: none;">
        <h3>📝 壓縮檔註解</h3>
        <div class="setting-row">
          <label>目前註解</label>
        </div>
        <div id="currentComment" class="comment-display">無註解</div>
        <div class="setting-row">
          <label>新註解</label>
        </div>
        <textarea id="newComment" class="comment-input" placeholder="輸入新的註解內容..."></textarea>
        <p class="help-text">註解最多可輸入 65535 個字元</p>
      </div>

      <div id="fileComments" class="settings-panel" style="display: none;">
        <h3>📄 個別檔案註解</h3>
        <div id="fileCommentList"></div>
      </div>

      <div id="progressContainer" class="progress-container">
        <div class="progress-bar">
          <div id="progressFill" class="progress-fill"></div>
        </div>
        <p id="progressText" class="progress-text">準備中...</p>
      </div>

      <div class="action-buttons">
        <button id="saveBtn" class="btn btn-primary" style="display: none;">
          <span>💾</span>
          <span>儲存變更</span>
        </button>
        <button id="downloadBtn" class="btn btn-success" style="display: none;">
          <span>⬇️</span>
          <span data-i18n="download">下載</span>
        </button>
        <button id="resetBtn" class="btn btn-secondary" style="display: none;">
          <span>🗑️</span>
          <span data-i18n="reset">重置</span>
        </button>
      </div>
    </main>

    <footer class="footer">
      <p data-i18n="footer_privacy">所有檔案處理均在本地完成，不會上傳到伺服器</p>
    </footer>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script type="module" src="/src/i18n/i18n.js"></script>
  <script type="module" src="./comment-editor.js"></script>
</body>
</html>
