<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CMP-040 增量壓縮 - Awesome WASM Tools 1000</title>
  <meta name="description" content="增量壓縮檔案，只壓縮新增或修改的檔案，完全在本地處理">
  <link rel="stylesheet" href="/src/styles/global.css">
</head>
<body>
  <div class="tool-page">
    <header class="tool-header">
      <a href="/index.html" class="back-btn">
        <span>←</span>
        <span data-i18n="back">返回</span>
      </a>
      <div class="tool-title">
        <h1>CMP-040 <span data-i18n="cmp040_name">增量壓縮</span></h1>
        <p data-i18n="cmp040_desc">只壓縮新增或修改的檔案</p>
      </div>
      <div class="lang-switcher">
        <button onclick="setLanguage('zh-TW')" class="lang-btn">繁中</button>
        <button onclick="setLanguage('en')" class="lang-btn">EN</button>
      </div>
    </header>

    <main class="tool-content">
      <div id="statusMessage" class="status-message"></div>

      <div class="settings-panel">
        <h3>📦 基礎壓縮檔（選填）</h3>
        <p class="panel-desc">選擇現有的壓縮檔作為基礎，只壓縮差異部分</p>
        <div id="baseUploadArea" class="upload-area small">
          <div class="icon">📦</div>
          <p>拖放或點擊選擇基礎 ZIP 檔案</p>
          <input type="file" id="baseFileInput" class="file-input" accept=".zip">
        </div>
        <div id="baseInfo" class="base-info" style="display: none;">
          <span id="baseName">-</span>
          <span id="baseFileCount">-</span>
          <button class="btn btn-small" onclick="window.incrementalCompressor.clearBase()">清除</button>
        </div>
      </div>

      <div id="uploadArea" class="upload-area">
        <div class="icon">📁</div>
        <h3 data-i18n="upload_title">拖放新檔案到此處</h3>
        <p data-i18n="upload_subtitle">或點擊選擇檔案</p>
        <p class="upload-formats" data-i18n="upload_formats">將與基礎壓縮檔比較並只壓縮差異</p>
        <input type="file" id="fileInput" class="file-input" multiple>
      </div>

      <div id="comparisonPanel" class="settings-panel" style="display: none;">
        <h3>🔍 差異比較結果</h3>
        <div class="comparison-stats">
          <div class="stat-item new">
            <span class="stat-label">新增檔案</span>
            <span id="newCount" class="stat-value">0</span>
          </div>
          <div class="stat-item modified">
            <span class="stat-label">已修改</span>
            <span id="modifiedCount" class="stat-value">0</span>
          </div>
          <div class="stat-item unchanged">
            <span class="stat-label">未變更</span>
            <span id="unchangedCount" class="stat-value">0</span>
          </div>
        </div>
        <div id="changesList" class="changes-list"></div>
      </div>

      <div id="progressContainer" class="progress-container">
        <div class="progress-bar">
          <div id="progressFill" class="progress-fill"></div>
        </div>
        <p id="progressText" class="progress-text">準備中...</p>
      </div>

      <div class="action-buttons">
        <button id="compressBtn" class="btn btn-primary" disabled>
          <span>📦</span>
          <span data-i18n="compress">增量壓縮</span>
        </button>
        <button id="downloadBtn" class="btn btn-success" style="display: none;">
          <span>💾</span>
          <span data-i18n="download">下載壓縮檔</span>
        </button>
        <button id="resetBtn" class="btn btn-secondary" style="display: none;">
          <span>🗑️</span>
          <span data-i18n="reset">重置</span>
        </button>
      </div>

      <div id="resultPanel" class="settings-panel" style="display: none;">
        <h3>✅ 壓縮結果</h3>
        <div class="setting-row">
          <label>輸出檔案</label>
          <span id="outputFileName">-</span>
        </div>
        <div class="setting-row">
          <label>壓縮檔大小</label>
          <span id="outputFileSize">-</span>
        </div>
        <div class="setting-row">
          <label>包含檔案數</label>
          <span id="includedFiles">-</span>
        </div>
        <div class="setting-row">
          <label>節省空間</label>
          <span id="savedSpace">-</span>
        </div>
      </div>
    </main>

    <footer class="footer">
      <p data-i18n="footer_privacy">所有檔案處理均在本地完成，不會上傳到伺服器</p>
    </footer>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script type="module" src="/src/i18n/i18n.js"></script>
  <script type="module" src="./incremental.js"></script>
</body>
</html>
