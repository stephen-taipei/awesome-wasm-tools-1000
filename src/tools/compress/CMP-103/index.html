<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CMP-103 密碼保護壓縮 - Awesome WASM Tools 1000</title>
  <meta name="description" content="加密壓縮檔案">
  <link rel="stylesheet" href="/src/styles/global.css">
</head>
<body>
  <div class="tool-page">
    <header class="tool-header">
      <a href="/index.html" class="back-btn"><span>←</span><span data-i18n="back">返回</span></a>
      <div class="tool-title">
        <h1>CMP-103 <span>密碼保護壓縮</span></h1>
        <p>加密壓縮檔案</p>
      </div>
      <div class="lang-switcher">
        <button onclick="setLanguage('zh-TW')" class="lang-btn">繁中</button>
        <button onclick="setLanguage('en')" class="lang-btn">EN</button>
      </div>
    </header>
    <main class="tool-content">
      <div id="statusMessage" class="status-message"></div>
      <div class="input-section">
        <h3>上傳檔案</h3>
        <div class="file-drop-zone" id="dropZone">
          <input type="file" id="fileInput" hidden>
          <p>拖放檔案到此處或點擊選擇</p>
          <p id="fileName" class="file-name"></p>
        </div>
      </div>
      <div class="action-buttons">
        <button id="processBtn" class="btn btn-primary"><span>⚙️</span><span>處理</span></button>
        <button id="clearBtn" class="btn btn-secondary"><span>🗑️</span><span>清除</span></button>
      </div>
      <div id="resultArea" class="result-area" style="display: none;">
        <h3>結果</h3>
        <div id="resultInfo" class="info-box"></div>
        <button id="downloadBtn" class="btn btn-primary"><span>💾</span><span>下載</span></button>
      </div>
    </main>
    <footer class="footer"><p data-i18n="footer_privacy">所有檔案處理均在本地完成</p></footer>
  </div>
  <script type="module" src="/src/i18n/i18n.js"></script>
  <script type="module" src="./tool.js"></script>
</body>
</html>
