<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CMP-056 磁碟映像檔壓縮 - Awesome WASM Tools 1000</title>
  <meta name="description" content="壓縮磁碟映像檔以節省空間">
  <link rel="stylesheet" href="/src/styles/global.css">
</head>
<body>
  <div class="tool-page">
    <header class="tool-header">
      <a href="/index.html" class="back-btn">
        <span>←</span>
        <span data-i18n="back">返回</span>
      </a>
      <div class="tool-title">
        <h1>CMP-056 <span data-i18n="cmp056_name">磁碟映像檔壓縮</span></h1>
        <p data-i18n="cmp056_desc">壓縮磁碟映像檔以節省空間</p>
      </div>
      <div class="lang-switcher">
        <button onclick="setLanguage('zh-TW')" class="lang-btn">繁中</button>
        <button onclick="setLanguage('en')" class="lang-btn">EN</button>
      </div>
    </header>

    <main class="tool-content">
      <div id="statusMessage" class="status-message"></div>

      <div id="uploadArea" class="upload-area">
        <div class="icon">💽</div>
        <h3 data-i18n="upload_title">拖放映像檔到此處</h3>
        <p data-i18n="upload_subtitle">或點擊選擇磁碟映像檔</p>
        <p class="upload-formats" data-i18n="upload_formats">支援 .iso, .img, .vhd, .dmg 等格式</p>
        <input type="file" id="fileInput" class="file-input" accept=".iso,.img,.vhd,.vhdx,.dmg,.raw,.bin">
      </div>

      <div id="fileInfo" class="file-info" style="display: none;">
        <h3>檔案資訊</h3>
        <p id="fileName">檔名: -</p>
        <p id="fileSize">大小: -</p>
        <p id="fileType">類型: -</p>
      </div>

      <div class="settings-panel">
        <h3 data-i18n="settings">壓縮設定</h3>
        <div class="setting-row">
          <label data-i18n="compression_method">壓縮方式</label>
          <select id="compressionMethod">
            <option value="gzip" selected>GZIP (.gz)</option>
            <option value="xz">XZ (.xz)</option>
            <option value="lz4">LZ4 (.lz4)</option>
            <option value="zstd">Zstandard (.zst)</option>
          </select>
        </div>
        <div class="setting-row">
          <label data-i18n="compression_level">壓縮等級</label>
          <select id="compressionLevel">
            <option value="1">1 - 最快</option>
            <option value="3">3 - 快速</option>
            <option value="6" selected>6 - 平衡</option>
            <option value="9">9 - 最佳</option>
          </select>
        </div>
        <div class="setting-row">
          <label data-i18n="sparse_detection">稀疏檢測</label>
          <select id="sparseDetection">
            <option value="auto" selected>自動</option>
            <option value="enabled">啟用</option>
            <option value="disabled">停用</option>
          </select>
        </div>
      </div>

      <div id="analysisInfo" class="settings-panel" style="display: none;">
        <h3>📊 映像檔分析</h3>
        <div class="setting-row">
          <label>稀疏度</label>
          <span id="sparsity">-</span>
        </div>
        <div class="setting-row">
          <label>預估壓縮後大小</label>
          <span id="estimatedSize">-</span>
        </div>
        <div class="setting-row">
          <label>預估節省空間</label>
          <span id="estimatedSaving">-</span>
        </div>
      </div>

      <div id="progressContainer" class="progress-container">
        <div class="progress-bar">
          <div id="progressFill" class="progress-fill"></div>
        </div>
        <p id="progressText" class="progress-text">準備中...</p>
      </div>

      <div class="action-buttons">
        <button id="analyzeBtn" class="btn btn-secondary" disabled>
          <span>🔍</span>
          <span>分析</span>
        </button>
        <button id="compressBtn" class="btn btn-primary" disabled>
          <span>📦</span>
          <span data-i18n="compress">壓縮</span>
        </button>
        <button id="downloadBtn" class="btn btn-success" style="display: none;">
          <span>⬇️</span>
          <span data-i18n="download">下載</span>
        </button>
        <button id="resetBtn" class="btn btn-secondary" style="display: none;">
          <span>🗑️</span>
          <span data-i18n="reset">重置</span>
        </button>
      </div>

      <div id="performanceInfo" class="settings-panel" style="display: none;">
        <h3>📈 壓縮結果</h3>
        <div class="setting-row">
          <label>處理時間</label>
          <span id="processTime">-</span>
        </div>
        <div class="setting-row">
          <label>原始大小</label>
          <span id="originalSize">-</span>
        </div>
        <div class="setting-row">
          <label>壓縮後大小</label>
          <span id="compressedSize">-</span>
        </div>
        <div class="setting-row">
          <label>壓縮比</label>
          <span id="compressionRatio">-</span>
        </div>
      </div>
    </main>

    <footer class="footer">
      <p data-i18n="footer_privacy">所有檔案處理均在本地完成，不會上傳到伺服器</p>
    </footer>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js"></script>
  <script type="module" src="/src/i18n/i18n.js"></script>
  <script type="module" src="./disk-compress.js"></script>
</body>
</html>
