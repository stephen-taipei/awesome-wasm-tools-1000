<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CMP-064 壓縮檔轉換格式 - Awesome WASM Tools 1000</title>
  <meta name="description" content="轉換壓縮檔格式 (ZIP/GZIP)">
  <link rel="stylesheet" href="/src/styles/global.css">
</head>
<body>
  <div class="tool-page">
    <header class="tool-header">
      <a href="/index.html" class="back-btn">
        <span>←</span>
        <span data-i18n="back">返回</span>
      </a>
      <div class="tool-title">
        <h1>CMP-064 <span data-i18n="cmp064_name">壓縮檔轉換格式</span></h1>
        <p data-i18n="cmp064_desc">轉換壓縮檔格式</p>
      </div>
      <div class="lang-switcher">
        <button onclick="setLanguage('zh-TW')" class="lang-btn">繁中</button>
        <button onclick="setLanguage('en')" class="lang-btn">EN</button>
      </div>
    </header>

    <main class="tool-content">
      <div id="statusMessage" class="status-message"></div>

      <div id="uploadArea" class="upload-area">
        <div class="icon">🔄</div>
        <h3 data-i18n="upload_title">拖放壓縮檔到此處</h3>
        <p data-i18n="upload_subtitle">或點擊選擇壓縮檔</p>
        <p class="upload-formats">支援 .zip, .gz 格式</p>
        <input type="file" id="fileInput" class="file-input" accept=".zip,.gz,.gzip">
      </div>

      <div id="fileInfo" class="file-info" style="display: none;">
        <h3>檔案資訊</h3>
        <p id="fileName">檔名: -</p>
        <p id="fileSize">大小: -</p>
        <p id="fileFormat">格式: -</p>
      </div>

      <div class="settings-panel">
        <h3 data-i18n="settings">轉換設定</h3>
        <div class="setting-row">
          <label>目標格式</label>
          <select id="targetFormat">
            <option value="zip">ZIP</option>
            <option value="gzip">GZIP (.gz)</option>
            <option value="tar.gz">TAR.GZ</option>
          </select>
        </div>
        <div class="setting-row">
          <label>壓縮等級</label>
          <select id="compressionLevel">
            <option value="1">1 - 最快</option>
            <option value="5">5 - 平衡</option>
            <option value="6" selected>6 - 標準</option>
            <option value="9">9 - 最佳</option>
          </select>
        </div>
        <div class="setting-row">
          <label>輸出檔名</label>
          <input type="text" id="outputFilename" placeholder="輸入檔名">
        </div>
      </div>

      <div id="progressContainer" class="progress-container">
        <div class="progress-bar">
          <div id="progressFill" class="progress-fill"></div>
        </div>
        <p id="progressText" class="progress-text">準備中...</p>
      </div>

      <div class="action-buttons">
        <button id="convertBtn" class="btn btn-primary" disabled>
          <span>🔄</span>
          <span>轉換格式</span>
        </button>
        <button id="downloadBtn" class="btn btn-success" style="display: none;">
          <span>⬇️</span>
          <span data-i18n="download">下載</span>
        </button>
        <button id="resetBtn" class="btn btn-secondary" style="display: none;">
          <span>🗑️</span>
          <span data-i18n="reset">重置</span>
        </button>
      </div>

      <div id="performanceInfo" class="settings-panel" style="display: none;">
        <h3>📊 轉換結果</h3>
        <div class="setting-row">
          <label>處理時間</label>
          <span id="processTime">-</span>
        </div>
        <div class="setting-row">
          <label>原始大小</label>
          <span id="originalSize">-</span>
        </div>
        <div class="setting-row">
          <label>轉換後大小</label>
          <span id="convertedSize">-</span>
        </div>
      </div>
    </main>

    <footer class="footer">
      <p data-i18n="footer_privacy">所有檔案處理均在本地完成，不會上傳到伺服器</p>
    </footer>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js"></script>
  <script type="module" src="/src/i18n/i18n.js"></script>
  <script type="module" src="./format-convert.js"></script>
</body>
</html>
