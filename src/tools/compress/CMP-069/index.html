<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CMP-069 壓縮檔解密設定 - Awesome WASM Tools 1000</title>
  <meta name="description" content="解密受密碼保護的壓縮檔">
  <link rel="stylesheet" href="/src/styles/global.css">
</head>
<body>
  <div class="tool-page">
    <header class="tool-header">
      <a href="/index.html" class="back-btn">
        <span>←</span>
        <span data-i18n="back">返回</span>
      </a>
      <div class="tool-title">
        <h1>CMP-069 <span data-i18n="cmp069_name">壓縮檔解密設定</span></h1>
        <p data-i18n="cmp069_desc">解密受密碼保護的壓縮檔</p>
      </div>
      <div class="lang-switcher">
        <button onclick="setLanguage('zh-TW')" class="lang-btn">繁中</button>
        <button onclick="setLanguage('en')" class="lang-btn">EN</button>
      </div>
    </header>

    <main class="tool-content">
      <div id="statusMessage" class="status-message"></div>

      <div id="uploadArea" class="upload-area">
        <div class="icon">🔓</div>
        <h3 data-i18n="upload_title">拖放加密檔案到此處</h3>
        <p data-i18n="upload_subtitle">或點擊選擇加密檔案</p>
        <p class="upload-formats">支援 .ecmp 加密壓縮檔</p>
        <input type="file" id="fileInput" class="file-input" accept=".ecmp">
      </div>

      <div id="fileInfo" class="file-info" style="display: none;">
        <h3>加密檔案資訊</h3>
        <p id="fileName">檔名: -</p>
        <p id="fileSize">大小: -</p>
        <p id="encryptionInfo">加密方式: -</p>
      </div>

      <div class="settings-panel">
        <h3 data-i18n="settings">解密設定</h3>
        <div class="setting-row">
          <label>密碼</label>
          <input type="password" id="password" placeholder="輸入密碼">
        </div>
        <div class="setting-row">
          <label>
            <input type="checkbox" id="showPassword">
            顯示密碼
          </label>
        </div>
      </div>

      <div id="progressContainer" class="progress-container">
        <div class="progress-bar">
          <div id="progressFill" class="progress-fill"></div>
        </div>
        <p id="progressText" class="progress-text">準備中...</p>
      </div>

      <div id="decryptedInfo" class="settings-panel" style="display: none;">
        <h3>📦 解密內容</h3>
        <div class="setting-row">
          <label>檔案數量</label>
          <span id="fileCount">-</span>
        </div>
        <div class="setting-row">
          <label>原始大小</label>
          <span id="originalSize">-</span>
        </div>
        <div id="fileList" class="file-list"></div>
      </div>

      <div class="action-buttons">
        <button id="decryptBtn" class="btn btn-primary" disabled>
          <span>🔓</span>
          <span>解密</span>
        </button>
        <button id="downloadBtn" class="btn btn-success" style="display: none;">
          <span>⬇️</span>
          <span data-i18n="download">下載解壓檔</span>
        </button>
        <button id="resetBtn" class="btn btn-secondary" style="display: none;">
          <span>🗑️</span>
          <span data-i18n="reset">重置</span>
        </button>
      </div>

      <div id="resultInfo" class="settings-panel" style="display: none;">
        <h3>📊 解密結果</h3>
        <div class="setting-row">
          <label>處理時間</label>
          <span id="processTime">-</span>
        </div>
        <div class="setting-row">
          <label>加密檔大小</label>
          <span id="encryptedSize">-</span>
        </div>
        <div class="setting-row">
          <label>解密後大小</label>
          <span id="decryptedSize">-</span>
        </div>
      </div>
    </main>

    <footer class="footer">
      <p data-i18n="footer_privacy">所有檔案處理均在本地完成，不會上傳到伺服器</p>
    </footer>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script type="module" src="/src/i18n/i18n.js"></script>
  <script type="module" src="./archive-decrypt.js"></script>
</body>
</html>
