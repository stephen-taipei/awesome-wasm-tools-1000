<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CMP-037 壓縮檔修復 - Awesome WASM Tools 1000</title>
  <meta name="description" content="嘗試修復損壞的壓縮檔，完全在本地處理">
  <link rel="stylesheet" href="/src/styles/global.css">
</head>
<body>
  <div class="tool-page">
    <header class="tool-header">
      <a href="/index.html" class="back-btn">
        <span>←</span>
        <span data-i18n="back">返回</span>
      </a>
      <div class="tool-title">
        <h1>CMP-037 <span data-i18n="cmp037_name">壓縮檔修復</span></h1>
        <p data-i18n="cmp037_desc">嘗試修復損壞的壓縮檔</p>
      </div>
      <div class="lang-switcher">
        <button onclick="setLanguage('zh-TW')" class="lang-btn">繁中</button>
        <button onclick="setLanguage('en')" class="lang-btn">EN</button>
      </div>
    </header>

    <main class="tool-content">
      <div id="statusMessage" class="status-message"></div>

      <div id="uploadArea" class="upload-area">
        <div class="icon">🔧</div>
        <h3 data-i18n="upload_title">拖放損壞的壓縮檔到此處</h3>
        <p data-i18n="upload_subtitle">或點擊選擇檔案</p>
        <p class="upload-formats" data-i18n="upload_formats">支援格式：ZIP</p>
        <input type="file" id="fileInput" class="file-input" accept=".zip">
      </div>

      <div id="diagnosisPanel" class="settings-panel" style="display: none;">
        <h3>🔍 診斷結果</h3>
        <div class="setting-row">
          <label>檔案名稱</label>
          <span id="fileName">-</span>
        </div>
        <div class="setting-row">
          <label>檔案大小</label>
          <span id="fileSize">-</span>
        </div>
        <div class="setting-row">
          <label>格式識別</label>
          <span id="formatStatus">-</span>
        </div>
        <div class="setting-row">
          <label>結構完整性</label>
          <span id="structureStatus">-</span>
        </div>
        <div id="issueList" class="issue-list"></div>
      </div>

      <div id="progressContainer" class="progress-container">
        <div class="progress-bar">
          <div id="progressFill" class="progress-fill"></div>
        </div>
        <p id="progressText" class="progress-text">準備中...</p>
      </div>

      <div class="action-buttons">
        <button id="diagnoseBtn" class="btn btn-primary" disabled>
          <span>🔍</span>
          <span data-i18n="diagnose">診斷檔案</span>
        </button>
        <button id="repairBtn" class="btn btn-success" style="display: none;">
          <span>🔧</span>
          <span data-i18n="repair">嘗試修復</span>
        </button>
        <button id="downloadBtn" class="btn btn-success" style="display: none;">
          <span>💾</span>
          <span data-i18n="download">下載修復檔案</span>
        </button>
        <button id="resetBtn" class="btn btn-secondary" style="display: none;">
          <span>🗑️</span>
          <span data-i18n="reset">重置</span>
        </button>
      </div>

      <div id="recoveredPanel" class="settings-panel" style="display: none;">
        <h3>📁 可恢復的檔案</h3>
        <div id="recoveredList" class="result-list"></div>
      </div>
    </main>

    <footer class="footer">
      <p data-i18n="footer_privacy">所有檔案處理均在本地完成，不會上傳到伺服器</p>
    </footer>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script type="module" src="/src/i18n/i18n.js"></script>
  <script type="module" src="./repair.js"></script>
</body>
</html>
