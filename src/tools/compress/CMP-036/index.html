<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CMP-036 壓縮等級比較 - Awesome WASM Tools 1000</title>
  <meta name="description" content="比較不同壓縮等級的效果，完全在本地處理">
  <link rel="stylesheet" href="/src/styles/global.css">
</head>
<body>
  <div class="tool-page">
    <header class="tool-header">
      <a href="/index.html" class="back-btn">
        <span>←</span>
        <span data-i18n="back">返回</span>
      </a>
      <div class="tool-title">
        <h1>CMP-036 <span data-i18n="cmp036_name">壓縮等級比較</span></h1>
        <p data-i18n="cmp036_desc">比較不同壓縮等級的效果</p>
      </div>
      <div class="lang-switcher">
        <button onclick="setLanguage('zh-TW')" class="lang-btn">繁中</button>
        <button onclick="setLanguage('en')" class="lang-btn">EN</button>
      </div>
    </header>

    <main class="tool-content">
      <div id="statusMessage" class="status-message"></div>

      <div id="uploadArea" class="upload-area">
        <div class="icon">📊</div>
        <h3 data-i18n="upload_title">拖放檔案到此處</h3>
        <p data-i18n="upload_subtitle">或點擊選擇檔案</p>
        <p class="upload-formats" data-i18n="upload_formats">建議使用文字檔案進行比較</p>
        <input type="file" id="fileInput" class="file-input">
      </div>

      <div id="fileInfo" class="settings-panel" style="display: none;">
        <h3>📁 檔案資訊</h3>
        <div class="setting-row">
          <label>檔案名稱</label>
          <span id="fileName">-</span>
        </div>
        <div class="setting-row">
          <label>原始大小</label>
          <span id="originalSize">-</span>
        </div>
      </div>

      <div id="progressContainer" class="progress-container">
        <div class="progress-bar">
          <div id="progressFill" class="progress-fill"></div>
        </div>
        <p id="progressText" class="progress-text">準備中...</p>
      </div>

      <div class="action-buttons">
        <button id="compareBtn" class="btn btn-primary" disabled>
          <span>📊</span>
          <span data-i18n="compare">開始比較</span>
        </button>
        <button id="resetBtn" class="btn btn-secondary" style="display: none;">
          <span>🗑️</span>
          <span data-i18n="reset">重置</span>
        </button>
      </div>

      <div id="resultPanel" class="settings-panel" style="display: none;">
        <h3>📊 壓縮等級比較結果</h3>
        <div id="comparisonChart" class="comparison-chart"></div>
        <table id="resultTable" class="result-table">
          <thead>
            <tr>
              <th>壓縮等級</th>
              <th>壓縮後大小</th>
              <th>壓縮比</th>
              <th>處理時間</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody id="resultBody"></tbody>
        </table>
      </div>
    </main>

    <footer class="footer">
      <p data-i18n="footer_privacy">所有檔案處理均在本地完成，不會上傳到伺服器</p>
    </footer>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js"></script>
  <script type="module" src="/src/i18n/i18n.js"></script>
  <script type="module" src="./compare.js"></script>
</body>
</html>
