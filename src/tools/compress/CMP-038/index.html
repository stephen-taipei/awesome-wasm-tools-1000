<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CMP-038 壓縮檔驗證 - Awesome WASM Tools 1000</title>
  <meta name="description" content="驗證壓縮檔完整性，完全在本地處理">
  <link rel="stylesheet" href="/src/styles/global.css">
</head>
<body>
  <div class="tool-page">
    <header class="tool-header">
      <a href="/index.html" class="back-btn">
        <span>←</span>
        <span data-i18n="back">返回</span>
      </a>
      <div class="tool-title">
        <h1>CMP-038 <span data-i18n="cmp038_name">壓縮檔驗證</span></h1>
        <p data-i18n="cmp038_desc">驗證壓縮檔的完整性和正確性</p>
      </div>
      <div class="lang-switcher">
        <button onclick="setLanguage('zh-TW')" class="lang-btn">繁中</button>
        <button onclick="setLanguage('en')" class="lang-btn">EN</button>
      </div>
    </header>

    <main class="tool-content">
      <div id="statusMessage" class="status-message"></div>

      <div id="uploadArea" class="upload-area">
        <div class="icon">✅</div>
        <h3 data-i18n="upload_title">拖放壓縮檔到此處</h3>
        <p data-i18n="upload_subtitle">或點擊選擇檔案</p>
        <p class="upload-formats" data-i18n="upload_formats">支援格式：ZIP, GZIP</p>
        <input type="file" id="fileInput" class="file-input" accept=".zip,.gz,.gzip">
      </div>

      <div id="progressContainer" class="progress-container">
        <div class="progress-bar">
          <div id="progressFill" class="progress-fill"></div>
        </div>
        <p id="progressText" class="progress-text">準備中...</p>
      </div>

      <div class="action-buttons">
        <button id="verifyBtn" class="btn btn-primary" disabled>
          <span>✅</span>
          <span data-i18n="verify">開始驗證</span>
        </button>
        <button id="resetBtn" class="btn btn-secondary" style="display: none;">
          <span>🗑️</span>
          <span data-i18n="reset">重置</span>
        </button>
      </div>

      <div id="resultPanel" class="settings-panel" style="display: none;">
        <h3>📋 驗證結果</h3>
        <div class="setting-row">
          <label>檔案名稱</label>
          <span id="fileName">-</span>
        </div>
        <div class="setting-row">
          <label>檔案大小</label>
          <span id="fileSize">-</span>
        </div>
        <div class="setting-row">
          <label>格式類型</label>
          <span id="formatType">-</span>
        </div>
        <div class="setting-row">
          <label>整體狀態</label>
          <span id="overallStatus">-</span>
        </div>
      </div>

      <div id="checksPanel" class="settings-panel" style="display: none;">
        <h3>🔍 檢查項目</h3>
        <div id="checksList" class="checks-list"></div>
      </div>

      <div id="filesPanel" class="settings-panel" style="display: none;">
        <h3>📁 檔案清單</h3>
        <div id="filesList" class="result-list"></div>
        <div class="setting-row">
          <label>驗證通過</label>
          <span id="passedCount">-</span>
        </div>
        <div class="setting-row">
          <label>驗證失敗</label>
          <span id="failedCount">-</span>
        </div>
      </div>
    </main>

    <footer class="footer">
      <p data-i18n="footer_privacy">所有檔案處理均在本地完成，不會上傳到伺服器</p>
    </footer>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js"></script>
  <script type="module" src="/src/i18n/i18n.js"></script>
  <script type="module" src="./verify.js"></script>
</body>
</html>
