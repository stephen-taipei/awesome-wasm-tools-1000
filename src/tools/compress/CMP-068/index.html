<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CMP-068 壓縮檔加密設定 - Awesome WASM Tools 1000</title>
  <meta name="description" content="為壓縮檔設定密碼保護">
  <link rel="stylesheet" href="/src/styles/global.css">
</head>
<body>
  <div class="tool-page">
    <header class="tool-header">
      <a href="/index.html" class="back-btn">
        <span>←</span>
        <span data-i18n="back">返回</span>
      </a>
      <div class="tool-title">
        <h1>CMP-068 <span data-i18n="cmp068_name">壓縮檔加密設定</span></h1>
        <p data-i18n="cmp068_desc">為壓縮檔設定密碼保護</p>
      </div>
      <div class="lang-switcher">
        <button onclick="setLanguage('zh-TW')" class="lang-btn">繁中</button>
        <button onclick="setLanguage('en')" class="lang-btn">EN</button>
      </div>
    </header>

    <main class="tool-content">
      <div id="statusMessage" class="status-message"></div>

      <div id="uploadArea" class="upload-area">
        <div class="icon">🔐</div>
        <h3 data-i18n="upload_title">拖放檔案到此處</h3>
        <p data-i18n="upload_subtitle">或點擊選擇要加密的檔案</p>
        <p class="upload-formats">支援任何類型的檔案</p>
        <input type="file" id="fileInput" class="file-input" multiple>
      </div>

      <div id="fileList" class="file-info" style="display: none;">
        <h3>已選檔案</h3>
        <div id="fileItems"></div>
        <p id="totalSize">總大小: -</p>
      </div>

      <div class="settings-panel">
        <h3 data-i18n="settings">加密設定</h3>
        <div class="setting-row">
          <label>密碼</label>
          <input type="password" id="password" placeholder="輸入密碼">
        </div>
        <div class="setting-row">
          <label>確認密碼</label>
          <input type="password" id="confirmPassword" placeholder="再次輸入密碼">
        </div>
        <div class="setting-row">
          <label>加密演算法</label>
          <select id="encryptionMethod">
            <option value="aes-256">AES-256-GCM (推薦)</option>
            <option value="aes-128">AES-128-GCM</option>
          </select>
        </div>
        <div class="setting-row">
          <label>壓縮等級</label>
          <select id="compressionLevel">
            <option value="0">0 - 僅打包</option>
            <option value="5">5 - 平衡</option>
            <option value="6" selected>6 - 標準</option>
            <option value="9">9 - 最佳壓縮</option>
          </select>
        </div>
        <div class="setting-row">
          <label>輸出檔名</label>
          <input type="text" id="outputFilename" placeholder="encrypted" value="encrypted">
        </div>
      </div>

      <div id="passwordStrength" class="settings-panel" style="display: none;">
        <h3>🔒 密碼強度</h3>
        <div class="progress-bar">
          <div id="strengthBar" class="progress-fill"></div>
        </div>
        <p id="strengthText">-</p>
        <ul id="strengthTips" class="recommendation-list"></ul>
      </div>

      <div id="progressContainer" class="progress-container">
        <div class="progress-bar">
          <div id="progressFill" class="progress-fill"></div>
        </div>
        <p id="progressText" class="progress-text">準備中...</p>
      </div>

      <div class="action-buttons">
        <button id="encryptBtn" class="btn btn-primary" disabled>
          <span>🔐</span>
          <span>加密並壓縮</span>
        </button>
        <button id="downloadBtn" class="btn btn-success" style="display: none;">
          <span>⬇️</span>
          <span data-i18n="download">下載</span>
        </button>
        <button id="resetBtn" class="btn btn-secondary" style="display: none;">
          <span>🗑️</span>
          <span data-i18n="reset">重置</span>
        </button>
      </div>

      <div id="resultInfo" class="settings-panel" style="display: none;">
        <h3>📊 加密結果</h3>
        <div class="setting-row">
          <label>處理時間</label>
          <span id="processTime">-</span>
        </div>
        <div class="setting-row">
          <label>原始大小</label>
          <span id="originalSize">-</span>
        </div>
        <div class="setting-row">
          <label>加密後大小</label>
          <span id="encryptedSize">-</span>
        </div>
      </div>
    </main>

    <footer class="footer">
      <p data-i18n="footer_privacy">所有檔案處理均在本地完成，不會上傳到伺服器</p>
    </footer>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script type="module" src="/src/i18n/i18n.js"></script>
  <script type="module" src="./archive-encrypt.js"></script>
</body>
</html>
