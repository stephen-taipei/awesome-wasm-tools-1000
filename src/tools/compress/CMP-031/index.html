<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CMP-031 壓縮檔預覽 - Awesome WASM Tools 1000</title>
  <meta name="description" content="預覽壓縮檔案的內容結構，完全在本地處理">
  <link rel="stylesheet" href="/src/styles/global.css">
</head>
<body>
  <div class="tool-page">
    <header class="tool-header">
      <a href="/index.html" class="back-btn">
        <span>←</span>
        <span data-i18n="back">返回</span>
      </a>
      <div class="tool-title">
        <h1>CMP-031 <span data-i18n="cmp031_name">壓縮檔預覽</span></h1>
        <p data-i18n="cmp031_desc">預覽壓縮檔案的內容結構</p>
      </div>
      <div class="lang-switcher">
        <button onclick="setLanguage('zh-TW')" class="lang-btn">繁中</button>
        <button onclick="setLanguage('en')" class="lang-btn">EN</button>
      </div>
    </header>

    <main class="tool-content">
      <div id="statusMessage" class="status-message"></div>

      <div id="uploadArea" class="upload-area">
        <div class="icon">👁️</div>
        <h3 data-i18n="upload_title">拖放壓縮檔到此處</h3>
        <p data-i18n="upload_subtitle">或點擊選擇檔案</p>
        <p class="upload-formats" data-i18n="upload_formats">支援格式：ZIP</p>
        <input type="file" id="fileInput" class="file-input" accept=".zip">
      </div>

      <div id="previewPanel" class="settings-panel" style="display: none;">
        <h3>📁 壓縮檔內容</h3>
        <div id="archiveInfo" class="archive-info"></div>
        <div id="fileTree" class="file-tree"></div>
      </div>

      <div id="statsPanel" class="settings-panel" style="display: none;">
        <h3>📊 統計資訊</h3>
        <div class="setting-row">
          <label>檔案數量</label>
          <span id="totalFiles">-</span>
        </div>
        <div class="setting-row">
          <label>資料夾數量</label>
          <span id="totalFolders">-</span>
        </div>
        <div class="setting-row">
          <label>壓縮後大小</label>
          <span id="compressedTotal">-</span>
        </div>
        <div class="setting-row">
          <label>原始大小</label>
          <span id="uncompressedTotal">-</span>
        </div>
        <div class="setting-row">
          <label>壓縮比</label>
          <span id="compressionRatio">-</span>
        </div>
      </div>

      <div class="action-buttons">
        <button id="previewBtn" class="btn btn-primary" disabled>
          <span>👁️</span>
          <span data-i18n="preview">預覽內容</span>
        </button>
        <button id="resetBtn" class="btn btn-secondary" style="display: none;">
          <span>🗑️</span>
          <span data-i18n="reset">重置</span>
        </button>
      </div>
    </main>

    <footer class="footer">
      <p data-i18n="footer_privacy">所有檔案處理均在本地完成，不會上傳到伺服器</p>
    </footer>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script type="module" src="/src/i18n/i18n.js"></script>
  <script type="module" src="./preview.js"></script>
</body>
</html>
