<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CMP-048 壓縮進度監控 - Awesome WASM Tools 1000</title>
  <meta name="description" content="監控壓縮進度與詳細統計資訊">
  <link rel="stylesheet" href="/src/styles/global.css">
</head>
<body>
  <div class="tool-page">
    <header class="tool-header">
      <a href="/index.html" class="back-btn">
        <span>←</span>
        <span data-i18n="back">返回</span>
      </a>
      <div class="tool-title">
        <h1>CMP-048 <span data-i18n="cmp048_name">壓縮進度監控</span></h1>
        <p data-i18n="cmp048_desc">監控壓縮進度與詳細統計資訊</p>
      </div>
      <div class="lang-switcher">
        <button onclick="setLanguage('zh-TW')" class="lang-btn">繁中</button>
        <button onclick="setLanguage('en')" class="lang-btn">EN</button>
      </div>
    </header>

    <main class="tool-content">
      <div id="statusMessage" class="status-message"></div>

      <div id="uploadArea" class="upload-area">
        <div class="icon">📊</div>
        <h3 data-i18n="upload_title">拖放檔案到此處</h3>
        <p data-i18n="upload_subtitle">或點擊選擇要壓縮的檔案</p>
        <p class="upload-formats" data-i18n="upload_formats">支援任何類型的檔案</p>
        <input type="file" id="fileInput" class="file-input" multiple>
      </div>

      <div id="fileList" class="file-list" style="display: none;">
        <h3>已選擇的檔案</h3>
        <ul id="selectedFiles"></ul>
        <p id="totalSize" class="total-size"></p>
      </div>

      <div id="progressMonitor" class="settings-panel">
        <h3>📊 即時進度監控</h3>
        <div class="monitor-grid">
          <div class="monitor-item">
            <label>整體進度</label>
            <div class="progress-bar">
              <div id="overallProgressFill" class="progress-fill"></div>
            </div>
            <span id="overallProgress">0%</span>
          </div>
          <div class="monitor-item">
            <label>目前檔案</label>
            <span id="currentFile">-</span>
          </div>
          <div class="monitor-item">
            <label>已處理檔案</label>
            <span id="filesProcessed">0 / 0</span>
          </div>
          <div class="monitor-item">
            <label>已處理大小</label>
            <span id="bytesProcessed">0 Bytes</span>
          </div>
          <div class="monitor-item">
            <label>壓縮後大小</label>
            <span id="compressedBytes">0 Bytes</span>
          </div>
          <div class="monitor-item">
            <label>目前壓縮比</label>
            <span id="currentRatio">0%</span>
          </div>
          <div class="monitor-item">
            <label>處理速度</label>
            <span id="processingSpeed">- MB/s</span>
          </div>
          <div class="monitor-item">
            <label>預估剩餘時間</label>
            <span id="estimatedTime">-</span>
          </div>
        </div>
      </div>

      <div id="progressContainer" class="progress-container">
        <div class="progress-bar">
          <div id="progressFill" class="progress-fill"></div>
        </div>
        <p id="progressText" class="progress-text">準備中...</p>
      </div>

      <div id="fileProgressList" class="settings-panel" style="display: none;">
        <h3>📁 檔案處理狀態</h3>
        <div id="fileProgressItems"></div>
      </div>

      <div class="action-buttons">
        <button id="compressBtn" class="btn btn-primary" disabled>
          <span>📦</span>
          <span data-i18n="compress">開始壓縮</span>
        </button>
        <button id="pauseBtn" class="btn btn-warning" style="display: none;">
          <span>⏸️</span>
          <span>暫停</span>
        </button>
        <button id="downloadBtn" class="btn btn-success" style="display: none;">
          <span>⬇️</span>
          <span data-i18n="download">下載 ZIP</span>
        </button>
        <button id="resetBtn" class="btn btn-secondary" style="display: none;">
          <span>🗑️</span>
          <span data-i18n="reset">重置</span>
        </button>
      </div>

      <div id="performanceInfo" class="settings-panel" style="display: none;">
        <h3>📈 最終統計</h3>
        <div class="setting-row">
          <label>總處理時間</label>
          <span id="totalTime">-</span>
        </div>
        <div class="setting-row">
          <label>處理檔案數</label>
          <span id="totalFiles">-</span>
        </div>
        <div class="setting-row">
          <label>原始總大小</label>
          <span id="originalTotalSize">-</span>
        </div>
        <div class="setting-row">
          <label>壓縮後總大小</label>
          <span id="compressedTotalSize">-</span>
        </div>
        <div class="setting-row">
          <label>最終壓縮比</label>
          <span id="finalRatio">-</span>
        </div>
        <div class="setting-row">
          <label>平均速度</label>
          <span id="avgSpeed">-</span>
        </div>
      </div>
    </main>

    <footer class="footer">
      <p data-i18n="footer_privacy">所有檔案處理均在本地完成，不會上傳到伺服器</p>
    </footer>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script type="module" src="/src/i18n/i18n.js"></script>
  <script type="module" src="./progress-monitor.js"></script>
</body>
</html>
