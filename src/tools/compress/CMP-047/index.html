<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CMP-047 解壓縮串流處理 - Awesome WASM Tools 1000</title>
  <meta name="description" content="使用串流方式處理大型檔案解壓縮，減少記憶體使用">
  <link rel="stylesheet" href="/src/styles/global.css">
</head>
<body>
  <div class="tool-page">
    <header class="tool-header">
      <a href="/index.html" class="back-btn">
        <span>←</span>
        <span data-i18n="back">返回</span>
      </a>
      <div class="tool-title">
        <h1>CMP-047 <span data-i18n="cmp047_name">解壓縮串流處理</span></h1>
        <p data-i18n="cmp047_desc">使用串流方式處理大型檔案解壓縮</p>
      </div>
      <div class="lang-switcher">
        <button onclick="setLanguage('zh-TW')" class="lang-btn">繁中</button>
        <button onclick="setLanguage('en')" class="lang-btn">EN</button>
      </div>
    </header>

    <main class="tool-content">
      <div id="statusMessage" class="status-message"></div>

      <div id="uploadArea" class="upload-area">
        <div class="icon">🌊</div>
        <h3 data-i18n="upload_title">拖放壓縮檔到此處</h3>
        <p data-i18n="upload_subtitle">或點擊選擇壓縮檔</p>
        <p class="upload-formats" data-i18n="upload_formats">支援 .gz, .deflate, .strm 格式</p>
        <input type="file" id="fileInput" class="file-input" accept=".gz,.gzip,.deflate,.strm">
      </div>

      <div id="fileInfo" class="file-info" style="display: none;">
        <h3>檔案資訊</h3>
        <p id="fileName">檔名: -</p>
        <p id="fileSize">大小: -</p>
      </div>

      <div class="settings-panel">
        <h3 data-i18n="settings">串流設定</h3>
        <div class="setting-row">
          <label data-i18n="decompression_format">解壓縮格式</label>
          <select id="decompressionFormat">
            <option value="gzip" selected>GZIP</option>
            <option value="deflate">DEFLATE</option>
            <option value="deflate-raw">DEFLATE (Raw)</option>
          </select>
        </div>
        <div class="setting-row">
          <label data-i18n="output_filename">輸出檔名</label>
          <input type="text" id="outputFilename" placeholder="輸入檔名">
        </div>
      </div>

      <div id="streamInfo" class="settings-panel">
        <h3>🌊 串流狀態</h3>
        <div class="setting-row">
          <label>已處理區塊</label>
          <span id="chunksProcessed">0</span>
        </div>
        <div class="setting-row">
          <label>已讀取大小</label>
          <span id="bytesRead">0 Bytes</span>
        </div>
        <div class="setting-row">
          <label>已解壓大小</label>
          <span id="bytesDecompressed">0 Bytes</span>
        </div>
        <div class="setting-row">
          <label>處理速度</label>
          <span id="processingSpeed">- MB/s</span>
        </div>
      </div>

      <div id="progressContainer" class="progress-container">
        <div class="progress-bar">
          <div id="progressFill" class="progress-fill"></div>
        </div>
        <p id="progressText" class="progress-text" data-i18n="decompressing">串流解壓縮中...</p>
      </div>

      <div class="action-buttons">
        <button id="decompressBtn" class="btn btn-primary" disabled>
          <span>🌊</span>
          <span data-i18n="decompress">開始串流解壓縮</span>
        </button>
        <button id="downloadBtn" class="btn btn-success" style="display: none;">
          <span>⬇️</span>
          <span data-i18n="download">下載檔案</span>
        </button>
        <button id="resetBtn" class="btn btn-secondary" style="display: none;">
          <span>🗑️</span>
          <span data-i18n="reset">重置</span>
        </button>
      </div>

      <div id="performanceInfo" class="settings-panel" style="display: none;">
        <h3>📊 解壓縮資訊</h3>
        <div class="setting-row">
          <label>處理時間</label>
          <span id="processTime">-</span>
        </div>
        <div class="setting-row">
          <label>壓縮大小</label>
          <span id="compressedSize">-</span>
        </div>
        <div class="setting-row">
          <label>解壓後大小</label>
          <span id="decompressedSize">-</span>
        </div>
        <div class="setting-row">
          <label>擴展比</label>
          <span id="expansionRatio">-</span>
        </div>
        <div class="setting-row">
          <label>平均速度</label>
          <span id="averageSpeed">-</span>
        </div>
      </div>
    </main>

    <footer class="footer">
      <p data-i18n="footer_privacy">所有檔案處理均在本地完成，不會上傳到伺服器</p>
    </footer>
  </div>

  <script type="module" src="/src/i18n/i18n.js"></script>
  <script type="module" src="./stream-decompress.js"></script>
</body>
</html>
