<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CMP-067 解壓縮時間估算 - Awesome WASM Tools 1000</title>
  <meta name="description" content="估算壓縮檔解壓縮所需時間">
  <link rel="stylesheet" href="/src/styles/global.css">
</head>
<body>
  <div class="tool-page">
    <header class="tool-header">
      <a href="/index.html" class="back-btn">
        <span>←</span>
        <span data-i18n="back">返回</span>
      </a>
      <div class="tool-title">
        <h1>CMP-067 <span data-i18n="cmp067_name">解壓縮時間估算</span></h1>
        <p data-i18n="cmp067_desc">估算壓縮檔解壓縮所需時間</p>
      </div>
      <div class="lang-switcher">
        <button onclick="setLanguage('zh-TW')" class="lang-btn">繁中</button>
        <button onclick="setLanguage('en')" class="lang-btn">EN</button>
      </div>
    </header>

    <main class="tool-content">
      <div id="statusMessage" class="status-message"></div>

      <div id="uploadArea" class="upload-area">
        <div class="icon">⏱️</div>
        <h3 data-i18n="upload_title">拖放壓縮檔到此處</h3>
        <p data-i18n="upload_subtitle">或點擊選擇壓縮檔</p>
        <p class="upload-formats">支援 .zip, .gz 格式</p>
        <input type="file" id="fileInput" class="file-input" accept=".zip,.gz,.gzip">
      </div>

      <div id="fileInfo" class="file-info" style="display: none;">
        <h3>壓縮檔資訊</h3>
        <p id="fileName">檔名: -</p>
        <p id="fileSize">壓縮大小: -</p>
        <p id="fileFormat">格式: -</p>
      </div>

      <div class="settings-panel">
        <h3 data-i18n="settings">估算設定</h3>
        <div class="setting-row">
          <label>樣本大小</label>
          <select id="sampleSize">
            <option value="64">64 KB</option>
            <option value="256" selected>256 KB</option>
            <option value="1024">1 MB</option>
          </select>
        </div>
      </div>

      <div id="progressContainer" class="progress-container">
        <div class="progress-bar">
          <div id="progressFill" class="progress-fill"></div>
        </div>
        <p id="progressText" class="progress-text">準備中...</p>
      </div>

      <div id="estimationResults" class="settings-panel" style="display: none;">
        <h3>⏱️ 解壓縮時間估算</h3>
        <div class="setting-row">
          <label>預估解壓縮時間</label>
          <span id="estimatedTime">-</span>
        </div>
        <div class="setting-row">
          <label>解壓縮速度</label>
          <span id="decompressionSpeed">-</span>
        </div>
        <div class="setting-row">
          <label>壓縮比</label>
          <span id="compressionRatio">-</span>
        </div>
        <div class="setting-row">
          <label>預估解壓後大小</label>
          <span id="estimatedSize">-</span>
        </div>
      </div>

      <div id="archiveInfo" class="settings-panel" style="display: none;">
        <h3>📦 壓縮檔內容</h3>
        <div class="setting-row">
          <label>檔案數量</label>
          <span id="fileCount">-</span>
        </div>
        <div class="setting-row">
          <label>目錄數量</label>
          <span id="dirCount">-</span>
        </div>
        <div id="fileList" class="file-list"></div>
      </div>

      <div class="action-buttons">
        <button id="estimateBtn" class="btn btn-primary" disabled>
          <span>⏱️</span>
          <span>開始估算</span>
        </button>
        <button id="resetBtn" class="btn btn-secondary" style="display: none;">
          <span>🗑️</span>
          <span data-i18n="reset">重置</span>
        </button>
      </div>
    </main>

    <footer class="footer">
      <p data-i18n="footer_privacy">所有檔案處理均在本地完成，不會上傳到伺服器</p>
    </footer>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js"></script>
  <script type="module" src="/src/i18n/i18n.js"></script>
  <script type="module" src="./decompression-time-estimate.js"></script>
</body>
</html>
