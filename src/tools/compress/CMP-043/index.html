<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CMP-043 PPMd 壓縮 - Awesome WASM Tools 1000</title>
  <meta name="description" content="使用 PPMd 演算法壓縮檔案，完全在本地處理">
  <link rel="stylesheet" href="/src/styles/global.css">
</head>
<body>
  <div class="tool-page">
    <header class="tool-header">
      <a href="/index.html" class="back-btn">
        <span>←</span>
        <span data-i18n="back">返回</span>
      </a>
      <div class="tool-title">
        <h1>CMP-043 <span data-i18n="cmp043_name">PPMd 壓縮</span></h1>
        <p data-i18n="cmp043_desc">使用 PPMd 演算法壓縮檔案</p>
      </div>
      <div class="lang-switcher">
        <button onclick="setLanguage('zh-TW')" class="lang-btn">繁中</button>
        <button onclick="setLanguage('en')" class="lang-btn">EN</button>
      </div>
    </header>

    <main class="tool-content">
      <div id="statusMessage" class="status-message"></div>

      <div id="uploadArea" class="upload-area">
        <div class="icon">📦</div>
        <h3 data-i18n="upload_title">拖放檔案到此處</h3>
        <p data-i18n="upload_subtitle">或點擊選擇檔案</p>
        <p class="upload-formats" data-i18n="upload_formats">支援任何類型的檔案，特別適合文字檔案</p>
        <input type="file" id="fileInput" class="file-input">
      </div>

      <div id="fileInfo" class="file-info" style="display: none;">
        <h3>檔案資訊</h3>
        <p id="fileName">檔名: -</p>
        <p id="fileSize">大小: -</p>
      </div>

      <div class="settings-panel">
        <h3 data-i18n="settings">PPMd 壓縮設定</h3>
        <div class="setting-row">
          <label data-i18n="model_order">模型階數</label>
          <select id="modelOrder">
            <option value="2">2 - 快速</option>
            <option value="4">4 - 標準</option>
            <option value="6" selected>6 - 平衡</option>
            <option value="8">8 - 較佳</option>
            <option value="16">16 - 最佳</option>
          </select>
        </div>
        <div class="setting-row">
          <label data-i18n="memory_size">記憶體大小</label>
          <select id="memorySize">
            <option value="1">1 MB</option>
            <option value="4">4 MB</option>
            <option value="16" selected>16 MB</option>
            <option value="64">64 MB</option>
            <option value="128">128 MB</option>
          </select>
        </div>
        <div class="setting-row">
          <label data-i18n="output_filename">輸出檔名</label>
          <input type="text" id="outputFilename" placeholder="輸入檔名">
        </div>
      </div>

      <div id="progressContainer" class="progress-container">
        <div class="progress-bar">
          <div id="progressFill" class="progress-fill"></div>
        </div>
        <p id="progressText" class="progress-text" data-i18n="compressing">壓縮中...</p>
      </div>

      <div class="action-buttons">
        <button id="compressBtn" class="btn btn-primary" disabled>
          <span>📦</span>
          <span data-i18n="compress">開始壓縮</span>
        </button>
        <button id="downloadBtn" class="btn btn-success" style="display: none;">
          <span>⬇️</span>
          <span data-i18n="download">下載檔案</span>
        </button>
        <button id="resetBtn" class="btn btn-secondary" style="display: none;">
          <span>🗑️</span>
          <span data-i18n="reset">重置</span>
        </button>
      </div>

      <div id="performanceInfo" class="settings-panel" style="display: none;">
        <h3>📊 壓縮資訊</h3>
        <div class="setting-row">
          <label>處理時間</label>
          <span id="processTime">-</span>
        </div>
        <div class="setting-row">
          <label>原始大小</label>
          <span id="originalSize">-</span>
        </div>
        <div class="setting-row">
          <label>壓縮後大小</label>
          <span id="compressedSize">-</span>
        </div>
        <div class="setting-row">
          <label>壓縮比</label>
          <span id="compressionRatio">-</span>
        </div>
      </div>
    </main>

    <footer class="footer">
      <p data-i18n="footer_privacy">所有檔案處理均在本地完成，不會上傳到伺服器</p>
    </footer>
  </div>

  <script type="module" src="/src/i18n/i18n.js"></script>
  <script type="module" src="./ppmd-compress.js"></script>
</body>
</html>
