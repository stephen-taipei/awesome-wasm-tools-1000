<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CMP-063 壓縮檔合併 - Awesome WASM Tools 1000</title>
  <meta name="description" content="合併多個壓縮檔為一個">
  <link rel="stylesheet" href="/src/styles/global.css">
</head>
<body>
  <div class="tool-page">
    <header class="tool-header">
      <a href="/index.html" class="back-btn">
        <span>←</span>
        <span data-i18n="back">返回</span>
      </a>
      <div class="tool-title">
        <h1>CMP-063 <span data-i18n="cmp063_name">壓縮檔合併</span></h1>
        <p data-i18n="cmp063_desc">合併多個壓縮檔為一個</p>
      </div>
      <div class="lang-switcher">
        <button onclick="setLanguage('zh-TW')" class="lang-btn">繁中</button>
        <button onclick="setLanguage('en')" class="lang-btn">EN</button>
      </div>
    </header>

    <main class="tool-content">
      <div id="statusMessage" class="status-message"></div>

      <div id="uploadArea" class="upload-area">
        <div class="icon">📦</div>
        <h3 data-i18n="upload_title">拖放 ZIP 檔案到此處</h3>
        <p data-i18n="upload_subtitle">或點擊選擇多個 ZIP 壓縮檔</p>
        <p class="upload-formats">支援 .zip 格式（可多選）</p>
        <input type="file" id="fileInput" class="file-input" accept=".zip" multiple>
      </div>

      <div id="archiveList" class="settings-panel" style="display: none;">
        <h3>📦 已選擇的壓縮檔</h3>
        <div id="archiveItems"></div>
        <p id="totalInfo" class="total-size"></p>
      </div>

      <div class="settings-panel">
        <h3 data-i18n="settings">合併設定</h3>
        <div class="setting-row">
          <label>重複檔案處理</label>
          <select id="duplicateHandling">
            <option value="keep-first">保留第一個</option>
            <option value="keep-last">保留最後一個</option>
            <option value="rename">重新命名</option>
          </select>
        </div>
        <div class="setting-row">
          <label>建立子資料夾</label>
          <select id="createFolders">
            <option value="no">否</option>
            <option value="yes">是 (以壓縮檔名稱)</option>
          </select>
        </div>
        <div class="setting-row">
          <label>輸出檔名</label>
          <input type="text" id="outputFilename" value="merged" placeholder="輸入檔名">
        </div>
      </div>

      <div id="progressContainer" class="progress-container">
        <div class="progress-bar">
          <div id="progressFill" class="progress-fill"></div>
        </div>
        <p id="progressText" class="progress-text">準備中...</p>
      </div>

      <div class="action-buttons">
        <button id="mergeBtn" class="btn btn-primary" disabled>
          <span>🔗</span>
          <span>合併壓縮檔</span>
        </button>
        <button id="downloadBtn" class="btn btn-success" style="display: none;">
          <span>⬇️</span>
          <span data-i18n="download">下載</span>
        </button>
        <button id="resetBtn" class="btn btn-secondary" style="display: none;">
          <span>🗑️</span>
          <span data-i18n="reset">重置</span>
        </button>
      </div>

      <div id="performanceInfo" class="settings-panel" style="display: none;">
        <h3>📊 合併結果</h3>
        <div class="setting-row">
          <label>處理時間</label>
          <span id="processTime">-</span>
        </div>
        <div class="setting-row">
          <label>合併檔案數</label>
          <span id="mergedFiles">-</span>
        </div>
        <div class="setting-row">
          <label>最終大小</label>
          <span id="finalSize">-</span>
        </div>
      </div>
    </main>

    <footer class="footer">
      <p data-i18n="footer_privacy">所有檔案處理均在本地完成，不會上傳到伺服器</p>
    </footer>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script type="module" src="/src/i18n/i18n.js"></script>
  <script type="module" src="./archive-merge.js"></script>
</body>
</html>
