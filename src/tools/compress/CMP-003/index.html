<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CMP-003 ZIP 密碼保護 - Awesome WASM Tools 1000</title>
  <meta name="description" content="建立有密碼保護的 ZIP 檔案，完全在本地處理">
  <link rel="stylesheet" href="/src/styles/global.css">
</head>
<body>
  <div class="tool-page">
    <header class="tool-header">
      <a href="/index.html" class="back-btn">
        <span>←</span>
        <span data-i18n="back">返回</span>
      </a>
      <div class="tool-title">
        <h1>CMP-003 <span data-i18n="cmp003_name">ZIP 密碼保護</span></h1>
        <p data-i18n="cmp003_desc">建立有密碼保護的 ZIP 壓縮檔</p>
      </div>
      <div class="lang-switcher">
        <button onclick="setLanguage('zh-TW')" class="lang-btn">繁中</button>
        <button onclick="setLanguage('en')" class="lang-btn">EN</button>
      </div>
    </header>

    <main class="tool-content">
      <div id="statusMessage" class="status-message"></div>

      <div id="uploadArea" class="upload-area">
        <div class="icon">🔐</div>
        <h3 data-i18n="upload_title">拖放檔案到此處</h3>
        <p data-i18n="upload_subtitle">或點擊選擇檔案（可多選）</p>
        <p class="upload-formats" data-i18n="upload_formats">支援任何類型的檔案</p>
        <input type="file" id="fileInput" class="file-input" multiple>
      </div>

      <div id="fileList" class="file-list" style="display: none;">
        <h3>已選擇的檔案</h3>
        <ul id="selectedFiles"></ul>
        <p id="totalSize" class="total-size"></p>
      </div>

      <div class="settings-panel">
        <h3 data-i18n="settings">加密設定</h3>
        <div class="setting-row">
          <label data-i18n="password">密碼</label>
          <input type="password" id="password" placeholder="輸入密碼">
        </div>
        <div class="setting-row">
          <label data-i18n="confirm_password">確認密碼</label>
          <input type="password" id="confirmPassword" placeholder="再次輸入密碼">
        </div>
        <div class="setting-row">
          <label data-i18n="encryption">加密方式</label>
          <select id="encryptionMethod">
            <option value="AES-256">AES-256 (推薦)</option>
            <option value="AES-128">AES-128</option>
            <option value="ZipCrypto">ZipCrypto (相容性較好)</option>
          </select>
        </div>
        <div class="setting-row">
          <label data-i18n="output_filename">輸出檔名</label>
          <input type="text" id="outputFilename" value="encrypted" placeholder="輸入檔名">
        </div>
      </div>

      <div id="progressContainer" class="progress-container">
        <div class="progress-bar">
          <div id="progressFill" class="progress-fill"></div>
        </div>
        <p id="progressText" class="progress-text" data-i18n="encrypting">加密中...</p>
      </div>

      <div class="action-buttons">
        <button id="encryptBtn" class="btn btn-primary" disabled>
          <span>🔒</span>
          <span data-i18n="encrypt">加密壓縮</span>
        </button>
        <button id="downloadBtn" class="btn btn-success" style="display: none;">
          <span>⬇️</span>
          <span data-i18n="download">下載加密 ZIP</span>
        </button>
        <button id="resetBtn" class="btn btn-secondary" style="display: none;">
          <span>🗑️</span>
          <span data-i18n="reset">重置</span>
        </button>
      </div>

      <div id="performanceInfo" class="settings-panel" style="display: none;">
        <h3>📊 加密資訊</h3>
        <div class="setting-row">
          <label>處理時間</label>
          <span id="processTime">-</span>
        </div>
        <div class="setting-row">
          <label>加密方式</label>
          <span id="usedEncryption">-</span>
        </div>
        <div class="setting-row">
          <label>檔案大小</label>
          <span id="encryptedSize">-</span>
        </div>
      </div>
    </main>

    <footer class="footer">
      <p data-i18n="footer_privacy">所有檔案處理均在本地完成，不會上傳到伺服器</p>
    </footer>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
  <script type="module" src="/src/i18n/i18n.js"></script>
  <script type="module" src="./encrypt.js"></script>
</body>
</html>
