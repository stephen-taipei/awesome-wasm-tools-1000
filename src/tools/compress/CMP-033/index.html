<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CMP-033 批量解壓縮 - Awesome WASM Tools 1000</title>
  <meta name="description" content="批量解壓縮多個壓縮檔，完全在本地處理">
  <link rel="stylesheet" href="/src/styles/global.css">
</head>
<body>
  <div class="tool-page">
    <header class="tool-header">
      <a href="/index.html" class="back-btn">
        <span>←</span>
        <span data-i18n="back">返回</span>
      </a>
      <div class="tool-title">
        <h1>CMP-033 <span data-i18n="cmp033_name">批量解壓縮</span></h1>
        <p data-i18n="cmp033_desc">批量解壓縮多個壓縮檔</p>
      </div>
      <div class="lang-switcher">
        <button onclick="setLanguage('zh-TW')" class="lang-btn">繁中</button>
        <button onclick="setLanguage('en')" class="lang-btn">EN</button>
      </div>
    </header>

    <main class="tool-content">
      <div id="statusMessage" class="status-message"></div>

      <div id="uploadArea" class="upload-area">
        <div class="icon">📂</div>
        <h3 data-i18n="upload_title">拖放多個壓縮檔到此處</h3>
        <p data-i18n="upload_subtitle">或點擊選擇檔案</p>
        <p class="upload-formats" data-i18n="upload_formats">支援格式：ZIP, GZIP</p>
        <input type="file" id="fileInput" class="file-input" multiple accept=".zip,.gz,.gzip">
      </div>

      <div id="fileList" class="settings-panel" style="display: none;">
        <h3>📁 待解壓縮檔案</h3>
        <div id="fileListContent" class="file-list"></div>
        <div class="setting-row">
          <label>已選擇壓縮檔</label>
          <span id="fileCount">0 個</span>
        </div>
      </div>

      <div id="progressContainer" class="progress-container">
        <div class="progress-bar">
          <div id="progressFill" class="progress-fill"></div>
        </div>
        <p id="progressText" class="progress-text">準備中...</p>
      </div>

      <div class="action-buttons">
        <button id="decompressBtn" class="btn btn-primary" disabled>
          <span>📂</span>
          <span data-i18n="decompress">開始解壓縮</span>
        </button>
        <button id="downloadAllBtn" class="btn btn-success" style="display: none;">
          <span>💾</span>
          <span data-i18n="download_all">下載全部</span>
        </button>
        <button id="resetBtn" class="btn btn-secondary" style="display: none;">
          <span>🗑️</span>
          <span data-i18n="reset">重置</span>
        </button>
      </div>

      <div id="resultPanel" class="settings-panel" style="display: none;">
        <h3>✅ 解壓縮結果</h3>
        <div id="resultList" class="result-list"></div>
      </div>
    </main>

    <footer class="footer">
      <p data-i18n="footer_privacy">所有檔案處理均在本地完成，不會上傳到伺服器</p>
    </footer>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js"></script>
  <script type="module" src="/src/i18n/i18n.js"></script>
  <script type="module" src="./batchDecompress.js"></script>
</body>
</html>
