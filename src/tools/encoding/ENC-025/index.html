<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ENC-025 進位轉換器 - Awesome WASM Tools 1000</title>
  <meta name="description" content="在二進位、八進位、十進位、十六進位之間轉換">
  <link rel="stylesheet" href="/src/styles/global.css">
</head>
<body>
  <div class="tool-page">
    <header class="tool-header">
      <a href="/index.html" class="back-btn"><span>←</span><span data-i18n="back">返回</span></a>
      <div class="tool-title">
        <h1>ENC-025 <span data-i18n="enc025_name">進位轉換器</span></h1>
        <p data-i18n="enc025_desc">在二進位、八進位、十進位、十六進位之間轉換</p>
      </div>
      <div class="lang-switcher">
        <button onclick="setLanguage('zh-TW')" class="lang-btn">繁中</button>
        <button onclick="setLanguage('en')" class="lang-btn">EN</button>
      </div>
    </header>
    <main class="tool-content">
      <div id="statusMessage" class="status-message"></div>
      <div class="input-section">
        <h3>二進位 (Binary)</h3>
        <input type="text" id="binary" class="text-input" placeholder="如: 1010">
      </div>
      <div class="input-section">
        <h3>八進位 (Octal)</h3>
        <input type="text" id="octal" class="text-input" placeholder="如: 12">
      </div>
      <div class="input-section">
        <h3>十進位 (Decimal)</h3>
        <input type="text" id="decimal" class="text-input" placeholder="如: 10">
      </div>
      <div class="input-section">
        <h3>十六進位 (Hexadecimal)</h3>
        <input type="text" id="hex" class="text-input" placeholder="如: A">
      </div>
      <div class="action-buttons">
        <button id="clearBtn" class="btn btn-secondary"><span>🗑️</span><span data-i18n="clear">清除</span></button>
      </div>
    </main>
    <footer class="footer"><p data-i18n="footer_privacy">所有檔案處理均在本地完成，不會上傳到伺服器</p></footer>
  </div>
  <script type="module" src="/src/i18n/i18n.js"></script>
  <script type="module" src="./converter.js"></script>
</body>
</html>
