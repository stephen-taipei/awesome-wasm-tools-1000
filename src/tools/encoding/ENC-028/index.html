<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ENC-028 JWT 解碼器 - Awesome WASM Tools 1000</title>
  <meta name="description" content="解碼和分析 JSON Web Token (JWT)">
  <link rel="stylesheet" href="/src/styles/global.css">
</head>
<body>
  <div class="tool-page">
    <header class="tool-header">
      <a href="/index.html" class="back-btn"><span>←</span><span data-i18n="back">返回</span></a>
      <div class="tool-title">
        <h1>ENC-028 <span data-i18n="enc028_name">JWT 解碼器</span></h1>
        <p data-i18n="enc028_desc">解碼和分析 JSON Web Token (JWT)</p>
      </div>
      <div class="lang-switcher">
        <button onclick="setLanguage('zh-TW')" class="lang-btn">繁中</button>
        <button onclick="setLanguage('en')" class="lang-btn">EN</button>
      </div>
    </header>
    <main class="tool-content">
      <div id="statusMessage" class="status-message"></div>
      <div class="input-section">
        <h3 data-i18n="input_jwt">輸入 JWT</h3>
        <textarea id="inputText" class="text-input" rows="4" placeholder="貼上 JWT token..."></textarea>
      </div>
      <div class="action-buttons">
        <button id="decodeBtn" class="btn btn-primary"><span>🔓</span><span data-i18n="decode">解碼</span></button>
        <button id="clearBtn" class="btn btn-secondary"><span>🗑️</span><span data-i18n="clear">清除</span></button>
      </div>
      <div id="resultArea" class="result-area" style="display: none;">
        <h3>Header</h3>
        <pre id="headerOutput" class="code-block"></pre>
        <h3>Payload</h3>
        <pre id="payloadOutput" class="code-block"></pre>
        <h3>Signature</h3>
        <pre id="signatureOutput" class="code-block"></pre>
        <div id="expiryInfo" class="info-box"></div>
      </div>
    </main>
    <footer class="footer"><p data-i18n="footer_privacy">所有檔案處理均在本地完成，不會上傳到伺服器</p></footer>
  </div>
  <script type="module" src="/src/i18n/i18n.js"></script>
  <script type="module" src="./decoder.js"></script>
</body>
</html>
