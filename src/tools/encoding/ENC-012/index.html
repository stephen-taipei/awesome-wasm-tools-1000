<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ENC-012 URL 解碼 - Awesome WASM Tools 1000</title>
  <meta name="description" content="解碼 URL 百分號編碼文字">
  <link rel="stylesheet" href="/src/styles/global.css">
</head>
<body>
  <div class="tool-page">
    <header class="tool-header">
      <a href="/index.html" class="back-btn">
        <span>←</span>
        <span data-i18n="back">返回</span>
      </a>
      <div class="tool-title">
        <h1>ENC-012 <span data-i18n="enc012_name">URL 解碼</span></h1>
        <p data-i18n="enc012_desc">解碼 URL 百分號編碼文字</p>
      </div>
      <div class="lang-switcher">
        <button onclick="setLanguage('zh-TW')" class="lang-btn">繁中</button>
        <button onclick="setLanguage('en')" class="lang-btn">EN</button>
      </div>
    </header>

    <main class="tool-content">
      <div id="statusMessage" class="status-message"></div>

      <div class="options-section">
        <h3 data-i18n="decoding_options">解碼選項</h3>
        <div class="option-group">
          <label class="checkbox-label">
            <input type="checkbox" id="multiDecode">
            <span data-i18n="multi_decode">多次解碼 (處理雙重編碼)</span>
          </label>
          <label class="checkbox-label">
            <input type="checkbox" id="plusToSpace" checked>
            <span data-i18n="plus_to_space">將 + 轉為空格</span>
          </label>
        </div>
      </div>

      <div class="input-section">
        <h3 data-i18n="input_url_encoded">輸入 URL 編碼文字</h3>
        <textarea id="inputText" class="text-input" rows="6" placeholder="在此輸入 URL 編碼文字..."></textarea>
      </div>

      <div class="action-buttons">
        <button id="decodeBtn" class="btn btn-primary">
          <span>🔓</span>
          <span data-i18n="decode">解碼</span>
        </button>
        <button id="clearBtn" class="btn btn-secondary">
          <span>🗑️</span>
          <span data-i18n="clear">清除</span>
        </button>
      </div>

      <div id="resultArea" class="result-area" style="display: none;">
        <h3 data-i18n="result">解碼結果</h3>
        <textarea id="outputText" class="text-input" rows="6" readonly></textarea>
        <div class="result-actions">
          <button id="copyBtn" class="btn btn-secondary">
            <span>📋</span>
            <span data-i18n="copy">複製</span>
          </button>
        </div>
      </div>
    </main>

    <footer class="footer">
      <p data-i18n="footer_privacy">所有檔案處理均在本地完成，不會上傳到伺服器</p>
    </footer>
  </div>

  <script type="module" src="/src/i18n/i18n.js"></script>
  <script type="module" src="./decoder.js"></script>
</body>
</html>
