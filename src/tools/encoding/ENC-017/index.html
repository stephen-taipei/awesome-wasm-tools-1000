<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ENC-017 Punycode 編碼 - Awesome WASM Tools 1000</title>
  <meta name="description" content="將國際化域名編碼為 Punycode 格式">
  <link rel="stylesheet" href="/src/styles/global.css">
</head>
<body>
  <div class="tool-page">
    <header class="tool-header">
      <a href="/index.html" class="back-btn">
        <span>←</span>
        <span data-i18n="back">返回</span>
      </a>
      <div class="tool-title">
        <h1>ENC-017 <span data-i18n="enc017_name">Punycode 編碼</span></h1>
        <p data-i18n="enc017_desc">將國際化域名編碼為 Punycode 格式</p>
      </div>
      <div class="lang-switcher">
        <button onclick="setLanguage('zh-TW')" class="lang-btn">繁中</button>
        <button onclick="setLanguage('en')" class="lang-btn">EN</button>
      </div>
    </header>

    <main class="tool-content">
      <div id="statusMessage" class="status-message"></div>

      <div class="input-section">
        <h3 data-i18n="input_domain">輸入國際化域名</h3>
        <textarea id="inputText" class="text-input" rows="4" placeholder="在此輸入國際化域名 (如 中文.com)..."></textarea>
        <p class="hint" data-i18n="punycode_hint">支援多個域名，每行一個</p>
      </div>

      <div class="action-buttons">
        <button id="encodeBtn" class="btn btn-primary">
          <span>🔐</span>
          <span data-i18n="encode">編碼</span>
        </button>
        <button id="clearBtn" class="btn btn-secondary">
          <span>🗑️</span>
          <span data-i18n="clear">清除</span>
        </button>
      </div>

      <div id="resultArea" class="result-area" style="display: none;">
        <h3 data-i18n="result">編碼結果</h3>
        <textarea id="outputText" class="text-input" rows="4" readonly></textarea>
        <div class="result-actions">
          <button id="copyBtn" class="btn btn-secondary">
            <span>📋</span>
            <span data-i18n="copy">複製</span>
          </button>
        </div>
      </div>
    </main>

    <footer class="footer">
      <p data-i18n="footer_privacy">所有檔案處理均在本地完成，不會上傳到伺服器</p>
    </footer>
  </div>

  <script type="module" src="/src/i18n/i18n.js"></script>
  <script type="module" src="./encoder.js"></script>
</body>
</html>
