<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CAL-046 複數加法 - Awesome WASM Tools 1000</title>
  <meta name="description" content="計算複數相加">
  <link rel="stylesheet" href="/src/styles/global.css">
</head>
<body>
  <div class="tool-page">
    <header class="tool-header">
      <a href="/index.html" class="back-btn"><span>←</span><span data-i18n="back">返回</span></a>
      <div class="tool-title">
        <h1>CAL-046 <span data-i18n="cal046_name">複數加法</span></h1>
        <p data-i18n="cal046_desc">計算複數相加</p>
      </div>
      <div class="lang-switcher">
        <button onclick="setLanguage('zh-TW')" class="lang-btn">繁中</button>
        <button onclick="setLanguage('en')" class="lang-btn">EN</button>
      </div>
    </header>
    <main class="tool-content">
      <div id="statusMessage" class="status-message"></div>
      <div class="input-section">
        <h3>輸入數值</h3>
        <input type="text" id="inputValue" class="text-input" placeholder="輸入數值...">
      </div>
      <div class="action-buttons">
        <button id="calculateBtn" class="btn btn-primary"><span>🔢</span><span>計算</span></button>
        <button id="clearBtn" class="btn btn-secondary"><span>🗑️</span><span data-i18n="clear">清除</span></button>
      </div>
      <div id="resultArea" class="result-area" style="display: none;">
        <h3 data-i18n="result">計算結果</h3>
        <div id="resultContent" class="result-content"></div>
        <div class="result-actions">
          <button id="copyBtn" class="btn btn-secondary"><span>📋</span><span data-i18n="copy">複製</span></button>
        </div>
      </div>
    </main>
    <footer class="footer"><p data-i18n="footer_privacy">所有計算均在本地完成</p></footer>
  </div>
  <script type="module" src="/src/i18n/i18n.js"></script>
  <script type="module" src="./calculator.js"></script>
</body>
</html>
