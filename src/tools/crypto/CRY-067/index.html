<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CRY-067 SSH 指紋計算 - Awesome WASM Tools 1000</title>
  <meta name="description" content="計算 SSH 金鑰的指紋，完全在本地處理">
  <link rel="stylesheet" href="/src/styles/global.css">
</head>
<body>
  <div class="tool-page">
    <header class="tool-header">
      <a href="/index.html" class="back-btn">
        <span>&larr;</span>
        <span data-i18n="back">返回</span>
      </a>
      <div class="tool-title">
        <h1>CRY-067 <span data-i18n="cry067_name">SSH 指紋計算</span></h1>
        <p data-i18n="cry067_desc">計算 SSH 金鑰的指紋</p>
      </div>
      <div class="lang-switcher">
        <button onclick="setLanguage('zh-TW')" class="lang-btn">繁中</button>
        <button onclick="setLanguage('en')" class="lang-btn">EN</button>
      </div>
    </header>

    <main class="tool-content">
      <div id="statusMessage" class="status-message"></div>

      <div class="input-group">
        <label for="publicKey">SSH 公鑰</label>
        <textarea id="publicKey" rows="6" class="mono" placeholder="貼上 SSH 公鑰...
例如：ssh-rsa AAAAB3NzaC1... user@host"></textarea>
        <input type="file" id="keyFile" accept=".pub,.pem" style="margin-top: 0.5rem;">
      </div>

      <div class="action-buttons">
        <button id="calculateBtn" class="btn btn-primary">
          <span>🔍</span>
          <span>計算指紋</span>
        </button>
        <button id="clearBtn" class="btn btn-secondary">
          <span>🗑️</span>
          <span>清除</span>
        </button>
      </div>

      <div id="fingerprintResult" class="settings-panel" style="display: none;">
        <h3>金鑰指紋</h3>

        <div class="setting-row">
          <label>金鑰類型</label>
          <span id="keyType" class="mono">-</span>
        </div>

        <div class="setting-row">
          <label>SHA-256 指紋</label>
          <div style="display: flex; align-items: center; gap: 0.5rem;">
            <span id="sha256Fingerprint" class="mono" style="word-break: break-all;">-</span>
            <button id="copySha256" class="btn btn-small">複製</button>
          </div>
        </div>

        <div class="setting-row">
          <label>MD5 指紋（傳統格式）</label>
          <div style="display: flex; align-items: center; gap: 0.5rem;">
            <span id="md5Fingerprint" class="mono" style="word-break: break-all;">-</span>
            <button id="copyMd5" class="btn btn-small">複製</button>
          </div>
        </div>

        <div class="setting-row">
          <label>金鑰長度</label>
          <span id="keySize">-</span>
        </div>

        <div class="setting-row">
          <label>註解</label>
          <span id="keyComment">-</span>
        </div>

        <div id="randomArt" style="margin-top: 1rem;">
          <h4>Random Art</h4>
          <pre id="randomArtDisplay" class="mono" style="background: #1e293b; color: #e2e8f0; padding: 1rem; border-radius: 0.5rem; text-align: center;"></pre>
        </div>
      </div>
    </main>

    <footer class="footer">
      <p data-i18n="footer_privacy">所有檔案處理均在本地完成，不會上傳到伺服器</p>
    </footer>
  </div>

  <script type="module" src="/src/i18n/i18n.js"></script>
  <script type="module" src="./ssh-fingerprint.js"></script>
</body>
</html>
