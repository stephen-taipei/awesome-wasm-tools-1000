<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CRY-019 3DES 加密 - Awesome WASM Tools 1000</title>
  <meta name="description" content="使用 Triple DES (3DES) 演算法加密資料，完全在本地處理">
  <link rel="stylesheet" href="/src/styles/global.css">
</head>
<body>
  <div class="tool-page">
    <header class="tool-header">
      <a href="/index.html" class="back-btn">
        <span>&larr;</span>
        <span data-i18n="back">返回</span>
      </a>
      <div class="tool-title">
        <h1>CRY-019 <span data-i18n="cry019_name">3DES 加密</span></h1>
        <p data-i18n="cry019_desc">使用 Triple DES (3DES) 演算法加密資料</p>
      </div>
      <div class="lang-switcher">
        <button onclick="setLanguage('zh-TW')" class="lang-btn">繁中</button>
        <button onclick="setLanguage('en')" class="lang-btn">EN</button>
      </div>
    </header>

    <main class="tool-content">
      <div id="statusMessage" class="status-message"></div>

      <div class="settings-panel">
        <h3>加密設定</h3>
        <div class="setting-row">
          <label for="mode">加密模式</label>
          <select id="mode">
            <option value="CBC" selected>CBC</option>
            <option value="ECB">ECB (不推薦)</option>
          </select>
        </div>
        <div class="setting-row">
          <label for="outputFormat">輸出格式</label>
          <select id="outputFormat">
            <option value="base64" selected>Base64</option>
            <option value="hex">十六進位</option>
          </select>
        </div>
      </div>

      <div class="input-group">
        <label for="plaintext">明文</label>
        <textarea id="plaintext" rows="5" placeholder="輸入要加密的文字..."></textarea>
      </div>

      <div class="input-group">
        <label for="password">密碼</label>
        <div class="password-input">
          <input type="password" id="password" placeholder="輸入加密密碼">
          <button type="button" id="togglePassword" class="btn btn-small">顯示</button>
        </div>
      </div>

      <div class="action-buttons">
        <button id="encryptBtn" class="btn btn-primary">
          <span>🔐</span>
          <span>加密</span>
        </button>
        <button id="clearBtn" class="btn btn-secondary">
          <span>🗑️</span>
          <span>清除</span>
        </button>
      </div>

      <div class="input-group">
        <label for="ciphertext">加密結果</label>
        <textarea id="ciphertext" rows="5" readonly placeholder="加密結果將顯示在此..."></textarea>
        <button id="copyBtn" class="btn btn-small btn-success" style="margin-top: 0.5rem;">複製結果</button>
      </div>

      <div id="encryptionInfo" class="settings-panel" style="display: none;">
        <h3>加密資訊</h3>
        <div class="setting-row">
          <label>IV (初始向量)</label>
          <span id="ivValue" class="mono">-</span>
        </div>
        <div class="setting-row">
          <label>處理時間</label>
          <span id="processTime">-</span>
        </div>
      </div>

      <div class="settings-panel" style="margin-top: 1rem; background: #fff3cd;">
        <p><strong>注意：</strong>3DES 是較舊的加密演算法，已不建議用於新系統。建議使用 AES 等現代演算法。</p>
      </div>
    </main>

    <footer class="footer">
      <p data-i18n="footer_privacy">所有檔案處理均在本地完成，不會上傳到伺服器</p>
    </footer>
  </div>

  <script type="module" src="/src/i18n/i18n.js"></script>
  <script type="module" src="./3des-encrypt.js"></script>
</body>
</html>
