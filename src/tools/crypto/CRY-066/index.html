<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CRY-066 SSH 金鑰轉換 - Awesome WASM Tools 1000</title>
  <meta name="description" content="在不同 SSH 金鑰格式之間轉換，完全在本地處理">
  <link rel="stylesheet" href="/src/styles/global.css">
</head>
<body>
  <div class="tool-page">
    <header class="tool-header">
      <a href="/index.html" class="back-btn">
        <span>&larr;</span>
        <span data-i18n="back">返回</span>
      </a>
      <div class="tool-title">
        <h1>CRY-066 <span data-i18n="cry066_name">SSH 金鑰轉換</span></h1>
        <p data-i18n="cry066_desc">在不同 SSH 金鑰格式之間轉換</p>
      </div>
      <div class="lang-switcher">
        <button onclick="setLanguage('zh-TW')" class="lang-btn">繁中</button>
        <button onclick="setLanguage('en')" class="lang-btn">EN</button>
      </div>
    </header>

    <main class="tool-content">
      <div id="statusMessage" class="status-message"></div>

      <div class="settings-panel">
        <h3>轉換設定</h3>
        <div class="setting-row">
          <label for="conversionType">轉換類型</label>
          <select id="conversionType">
            <option value="pem-to-ssh">PEM → SSH 公鑰格式</option>
            <option value="ssh-to-pem">SSH 公鑰格式 → PEM</option>
          </select>
        </div>
      </div>

      <div class="input-group">
        <label for="inputKey">輸入金鑰</label>
        <textarea id="inputKey" rows="10" class="mono" placeholder="貼上金鑰..."></textarea>
        <input type="file" id="keyFile" accept=".pem,.pub,.key" style="margin-top: 0.5rem;">
      </div>

      <div class="input-group" id="commentGroup">
        <label for="comment">註解（SSH 格式用）</label>
        <input type="text" id="comment" placeholder="例如：user@hostname">
      </div>

      <div class="action-buttons">
        <button id="convertBtn" class="btn btn-primary">
          <span>🔄</span>
          <span>轉換</span>
        </button>
        <button id="clearBtn" class="btn btn-secondary">
          <span>🗑️</span>
          <span>清除</span>
        </button>
      </div>

      <div class="input-group">
        <label for="outputKey">輸出結果</label>
        <textarea id="outputKey" rows="10" readonly class="mono" placeholder="轉換結果將顯示在此..."></textarea>
        <div style="margin-top: 0.5rem;">
          <button id="copyBtn" class="btn btn-small btn-success">複製</button>
          <button id="downloadBtn" class="btn btn-small btn-secondary">下載</button>
        </div>
      </div>
    </main>

    <footer class="footer">
      <p data-i18n="footer_privacy">所有檔案處理均在本地完成，不會上傳到伺服器</p>
    </footer>
  </div>

  <script type="module" src="/src/i18n/i18n.js"></script>
  <script type="module" src="./ssh-convert.js"></script>
</body>
</html>
