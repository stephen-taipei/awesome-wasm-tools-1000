<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CRY-044 PGP 加密 - Awesome WASM Tools 1000</title>
  <meta name="description" content="使用 PGP 公鑰加密訊息，完全在本地處理">
  <link rel="stylesheet" href="/src/styles/global.css">
</head>
<body>
  <div class="tool-page">
    <header class="tool-header">
      <a href="/index.html" class="back-btn">
        <span>&larr;</span>
        <span data-i18n="back">返回</span>
      </a>
      <div class="tool-title">
        <h1>CRY-044 <span data-i18n="cry044_name">PGP 加密</span></h1>
        <p data-i18n="cry044_desc">使用 PGP 公鑰加密訊息</p>
      </div>
      <div class="lang-switcher">
        <button onclick="setLanguage('zh-TW')" class="lang-btn">繁中</button>
        <button onclick="setLanguage('en')" class="lang-btn">EN</button>
      </div>
    </header>

    <main class="tool-content">
      <div id="statusMessage" class="status-message"></div>

      <div class="input-group">
        <label for="publicKey">收件人公鑰</label>
        <textarea id="publicKey" rows="6" placeholder="貼上 PGP 公鑰..."></textarea>
        <input type="file" id="publicKeyFile" accept=".asc,.pem,.pub" style="margin-top: 0.5rem;">
      </div>

      <div class="input-group">
        <label for="plaintext">明文訊息</label>
        <textarea id="plaintext" rows="6" placeholder="輸入要加密的訊息..."></textarea>
      </div>

      <div class="action-buttons">
        <button id="encryptBtn" class="btn btn-primary">
          <span>🔐</span>
          <span>加密</span>
        </button>
        <button id="clearBtn" class="btn btn-secondary">
          <span>🗑️</span>
          <span>清除</span>
        </button>
      </div>

      <div class="input-group">
        <label for="ciphertext">加密結果</label>
        <textarea id="ciphertext" rows="8" readonly placeholder="加密結果將顯示在此..."></textarea>
        <div style="margin-top: 0.5rem;">
          <button id="copyBtn" class="btn btn-small btn-success">複製</button>
          <button id="downloadBtn" class="btn btn-small btn-secondary">下載</button>
        </div>
      </div>
    </main>

    <footer class="footer">
      <p data-i18n="footer_privacy">所有檔案處理均在本地完成，不會上傳到伺服器</p>
    </footer>
  </div>

  <script type="module" src="/src/i18n/i18n.js"></script>
  <script type="module" src="./pgp-encrypt.js"></script>
</body>
</html>
