<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CRY-046 PGP 簽章 - Awesome WASM Tools 1000</title>
  <meta name="description" content="使用 PGP 私鑰對訊息進行數位簽章，完全在本地處理">
  <link rel="stylesheet" href="/src/styles/global.css">
</head>
<body>
  <div class="tool-page">
    <header class="tool-header">
      <a href="/index.html" class="back-btn">
        <span>&larr;</span>
        <span data-i18n="back">返回</span>
      </a>
      <div class="tool-title">
        <h1>CRY-046 <span data-i18n="cry046_name">PGP 簽章</span></h1>
        <p data-i18n="cry046_desc">使用 PGP 私鑰對訊息進行數位簽章</p>
      </div>
      <div class="lang-switcher">
        <button onclick="setLanguage('zh-TW')" class="lang-btn">繁中</button>
        <button onclick="setLanguage('en')" class="lang-btn">EN</button>
      </div>
    </header>

    <main class="tool-content">
      <div id="statusMessage" class="status-message"></div>

      <div class="settings-panel">
        <h3>簽章設定</h3>
        <div class="setting-row">
          <label for="signatureType">簽章類型</label>
          <select id="signatureType">
            <option value="cleartext" selected>明文簽章 (Clearsign)</option>
            <option value="detached">分離簽章 (Detached)</option>
          </select>
        </div>
        <div class="setting-row">
          <label for="hashAlgorithm">雜湊演算法</label>
          <select id="hashAlgorithm">
            <option value="SHA-256" selected>SHA-256</option>
            <option value="SHA-384">SHA-384</option>
            <option value="SHA-512">SHA-512</option>
          </select>
        </div>
      </div>

      <div class="input-group">
        <label for="privateKey">私鑰</label>
        <textarea id="privateKey" rows="5" placeholder="貼上 PGP 私鑰..."></textarea>
        <input type="file" id="privateKeyFile" accept=".asc,.pem,.key" style="margin-top: 0.5rem;">
      </div>

      <div class="input-group">
        <label for="passphrase">密碼短語</label>
        <div class="password-input">
          <input type="password" id="passphrase" placeholder="輸入私鑰密碼短語">
          <button type="button" id="togglePassphrase" class="btn btn-small">顯示</button>
        </div>
      </div>

      <div class="input-group">
        <label for="message">訊息</label>
        <textarea id="message" rows="5" placeholder="輸入要簽章的訊息..."></textarea>
      </div>

      <div class="action-buttons">
        <button id="signBtn" class="btn btn-primary">
          <span>✍️</span>
          <span>簽章</span>
        </button>
        <button id="clearBtn" class="btn btn-secondary">
          <span>🗑️</span>
          <span>清除</span>
        </button>
      </div>

      <div class="input-group">
        <label for="signedMessage">簽章結果</label>
        <textarea id="signedMessage" rows="10" readonly placeholder="簽章結果將顯示在此..."></textarea>
        <div style="margin-top: 0.5rem;">
          <button id="copyBtn" class="btn btn-small btn-success">複製</button>
          <button id="downloadBtn" class="btn btn-small btn-secondary">下載</button>
        </div>
      </div>
    </main>

    <footer class="footer">
      <p data-i18n="footer_privacy">所有檔案處理均在本地完成，不會上傳到伺服器</p>
    </footer>
  </div>

  <script type="module" src="/src/i18n/i18n.js"></script>
  <script type="module" src="./pgp-sign.js"></script>
</body>
</html>
