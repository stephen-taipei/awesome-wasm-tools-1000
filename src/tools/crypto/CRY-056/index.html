<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CRY-056 JWE 加密 - Awesome WASM Tools 1000</title>
  <meta name="description" content="使用 JWE (JSON Web Encryption) 加密資料，完全在本地處理">
  <link rel="stylesheet" href="/src/styles/global.css">
</head>
<body>
  <div class="tool-page">
    <header class="tool-header">
      <a href="/index.html" class="back-btn">
        <span>&larr;</span>
        <span data-i18n="back">返回</span>
      </a>
      <div class="tool-title">
        <h1>CRY-056 <span data-i18n="cry056_name">JWE 加密</span></h1>
        <p data-i18n="cry056_desc">使用 JWE (JSON Web Encryption) 加密資料</p>
      </div>
      <div class="lang-switcher">
        <button onclick="setLanguage('zh-TW')" class="lang-btn">繁中</button>
        <button onclick="setLanguage('en')" class="lang-btn">EN</button>
      </div>
    </header>

    <main class="tool-content">
      <div id="statusMessage" class="status-message"></div>

      <div class="settings-panel">
        <h3>加密設定</h3>
        <div class="setting-row">
          <label for="algorithm">金鑰加密演算法</label>
          <select id="algorithm">
            <option value="dir" selected>dir (直接加密)</option>
            <option value="A128KW">A128KW</option>
            <option value="A256KW">A256KW</option>
          </select>
        </div>
        <div class="setting-row">
          <label for="encryption">內容加密演算法</label>
          <select id="encryption">
            <option value="A128GCM">A128GCM</option>
            <option value="A256GCM" selected>A256GCM</option>
          </select>
        </div>
      </div>

      <div class="input-group">
        <label for="key">加密金鑰</label>
        <div class="password-input">
          <input type="password" id="key" placeholder="輸入加密金鑰（16或32字元）">
          <button type="button" id="toggleKey" class="btn btn-small">顯示</button>
          <button type="button" id="generateKey" class="btn btn-small btn-secondary">生成</button>
        </div>
      </div>

      <div class="input-group">
        <label for="plaintext">明文</label>
        <textarea id="plaintext" rows="6" placeholder="輸入要加密的資料..."></textarea>
      </div>

      <div class="action-buttons">
        <button id="encryptBtn" class="btn btn-primary">
          <span>🔐</span>
          <span>加密</span>
        </button>
        <button id="clearBtn" class="btn btn-secondary">
          <span>🗑️</span>
          <span>清除</span>
        </button>
      </div>

      <div class="input-group">
        <label for="jweOutput">JWE</label>
        <textarea id="jweOutput" rows="6" readonly class="mono" placeholder="加密結果將顯示在此..."></textarea>
        <button id="copyBtn" class="btn btn-small btn-success" style="margin-top: 0.5rem;">複製</button>
      </div>

      <div id="jweInfo" class="settings-panel" style="display: none;">
        <h3>JWE 結構</h3>
        <div class="setting-row">
          <label>Protected Header</label>
          <code id="headerDisplay" class="mono"></code>
        </div>
      </div>
    </main>

    <footer class="footer">
      <p data-i18n="footer_privacy">所有檔案處理均在本地完成，不會上傳到伺服器</p>
    </footer>
  </div>

  <script type="module" src="/src/i18n/i18n.js"></script>
  <script type="module" src="./jwe-encrypt.js"></script>
</body>
</html>
