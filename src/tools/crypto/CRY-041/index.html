<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CRY-041 檔案加密（AES-GCM）- Awesome WASM Tools 1000</title>
  <meta name="description" content="使用 AES-GCM 演算法加密檔案，完全在本地處理">
  <link rel="stylesheet" href="/src/styles/global.css">
</head>
<body>
  <div class="tool-page">
    <header class="tool-header">
      <a href="/index.html" class="back-btn">
        <span>&larr;</span>
        <span data-i18n="back">返回</span>
      </a>
      <div class="tool-title">
        <h1>CRY-041 <span data-i18n="cry041_name">檔案加密（AES-GCM）</span></h1>
        <p data-i18n="cry041_desc">使用 AES-GCM 演算法加密檔案，支援大型檔案</p>
      </div>
      <div class="lang-switcher">
        <button onclick="setLanguage('zh-TW')" class="lang-btn">繁中</button>
        <button onclick="setLanguage('en')" class="lang-btn">EN</button>
      </div>
    </header>

    <main class="tool-content">
      <div id="statusMessage" class="status-message"></div>

      <div class="settings-panel">
        <h3>加密設定</h3>
        <div class="setting-row">
          <label for="keySize">金鑰長度</label>
          <select id="keySize">
            <option value="128">AES-128 (128 位元)</option>
            <option value="192">AES-192 (192 位元)</option>
            <option value="256" selected>AES-256 (256 位元)</option>
          </select>
        </div>
      </div>

      <div class="input-group">
        <label for="fileInput">選擇檔案</label>
        <input type="file" id="fileInput" class="file-input">
        <div id="fileInfo" class="file-info" style="display: none;"></div>
      </div>

      <div class="input-group">
        <label for="password">加密密碼</label>
        <div class="password-input">
          <input type="password" id="password" placeholder="輸入加密密碼">
          <button type="button" id="togglePassword" class="btn btn-small">顯示</button>
          <button type="button" id="generateKey" class="btn btn-small btn-secondary">生成金鑰</button>
        </div>
      </div>

      <div class="input-group">
        <label for="confirmPassword">確認密碼</label>
        <input type="password" id="confirmPassword" placeholder="再次輸入密碼">
      </div>

      <div class="action-buttons">
        <button id="encryptBtn" class="btn btn-primary">
          <span>🔐</span>
          <span>加密檔案</span>
        </button>
        <button id="clearBtn" class="btn btn-secondary">
          <span>🗑️</span>
          <span>清除</span>
        </button>
      </div>

      <div id="progressContainer" class="progress-container" style="display: none;">
        <div class="progress-bar">
          <div id="progressBar" class="progress-fill"></div>
        </div>
        <span id="progressText">0%</span>
      </div>

      <div id="encryptionInfo" class="settings-panel" style="display: none;">
        <h3>加密資訊</h3>
        <div class="setting-row">
          <label>原始檔案大小</label>
          <span id="originalSize">-</span>
        </div>
        <div class="setting-row">
          <label>加密後大小</label>
          <span id="encryptedSize">-</span>
        </div>
        <div class="setting-row">
          <label>處理時間</label>
          <span id="processTime">-</span>
        </div>
        <button id="downloadBtn" class="btn btn-success" style="margin-top: 1rem;">下載加密檔案</button>
      </div>
    </main>

    <footer class="footer">
      <p data-i18n="footer_privacy">所有檔案處理均在本地完成，不會上傳到伺服器</p>
    </footer>
  </div>

  <script type="module" src="/src/i18n/i18n.js"></script>
  <script type="module" src="./file-encrypt.js"></script>
</body>
</html>
