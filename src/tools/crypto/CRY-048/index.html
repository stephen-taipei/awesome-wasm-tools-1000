<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CRY-048 X.509 憑證檢視 - Awesome WASM Tools 1000</title>
  <meta name="description" content="檢視和解析 X.509 憑證內容，完全在本地處理">
  <link rel="stylesheet" href="/src/styles/global.css">
</head>
<body>
  <div class="tool-page">
    <header class="tool-header">
      <a href="/index.html" class="back-btn">
        <span>&larr;</span>
        <span data-i18n="back">返回</span>
      </a>
      <div class="tool-title">
        <h1>CRY-048 <span data-i18n="cry048_name">X.509 憑證檢視</span></h1>
        <p data-i18n="cry048_desc">檢視和解析 X.509 憑證內容</p>
      </div>
      <div class="lang-switcher">
        <button onclick="setLanguage('zh-TW')" class="lang-btn">繁中</button>
        <button onclick="setLanguage('en')" class="lang-btn">EN</button>
      </div>
    </header>

    <main class="tool-content">
      <div id="statusMessage" class="status-message"></div>

      <div class="input-group">
        <label for="certificate">憑證（PEM 格式）</label>
        <textarea id="certificate" rows="10" placeholder="貼上 X.509 憑證（PEM 格式）..."></textarea>
        <input type="file" id="certificateFile" accept=".pem,.crt,.cer" style="margin-top: 0.5rem;">
      </div>

      <div class="action-buttons">
        <button id="parseBtn" class="btn btn-primary">
          <span>🔍</span>
          <span>解析憑證</span>
        </button>
        <button id="clearBtn" class="btn btn-secondary">
          <span>🗑️</span>
          <span>清除</span>
        </button>
      </div>

      <div id="certificateInfo" class="settings-panel" style="display: none;">
        <h3>憑證資訊</h3>

        <div class="setting-row">
          <label>版本</label>
          <span id="version">-</span>
        </div>

        <div class="setting-row">
          <label>序號</label>
          <span id="serialNumber" class="mono">-</span>
        </div>

        <h4 style="margin-top: 1rem;">主體 (Subject)</h4>
        <div id="subjectInfo"></div>

        <h4 style="margin-top: 1rem;">發行者 (Issuer)</h4>
        <div id="issuerInfo"></div>

        <h4 style="margin-top: 1rem;">有效期間</h4>
        <div class="setting-row">
          <label>生效日期</label>
          <span id="notBefore">-</span>
        </div>
        <div class="setting-row">
          <label>到期日期</label>
          <span id="notAfter">-</span>
        </div>
        <div class="setting-row">
          <label>狀態</label>
          <span id="validityStatus">-</span>
        </div>

        <h4 style="margin-top: 1rem;">公鑰資訊</h4>
        <div class="setting-row">
          <label>演算法</label>
          <span id="publicKeyAlgorithm">-</span>
        </div>
        <div class="setting-row">
          <label>金鑰長度</label>
          <span id="keySize">-</span>
        </div>

        <h4 style="margin-top: 1rem;">簽章資訊</h4>
        <div class="setting-row">
          <label>簽章演算法</label>
          <span id="signatureAlgorithm">-</span>
        </div>

        <h4 style="margin-top: 1rem;">指紋</h4>
        <div class="setting-row">
          <label>SHA-256</label>
          <span id="sha256Fingerprint" class="mono" style="word-break: break-all;">-</span>
        </div>
        <div class="setting-row">
          <label>SHA-1</label>
          <span id="sha1Fingerprint" class="mono" style="word-break: break-all;">-</span>
        </div>

        <div id="extensionsSection" style="margin-top: 1rem;">
          <h4>擴展 (Extensions)</h4>
          <div id="extensions"></div>
        </div>
      </div>
    </main>

    <footer class="footer">
      <p data-i18n="footer_privacy">所有檔案處理均在本地完成，不會上傳到伺服器</p>
    </footer>
  </div>

  <script type="module" src="/src/i18n/i18n.js"></script>
  <script type="module" src="./x509-viewer.js"></script>
</body>
</html>
