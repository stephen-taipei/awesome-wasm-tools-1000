<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CRY-033 bcrypt 密碼雜湊 - Awesome WASM Tools 1000</title>
  <meta name="description" content="使用 bcrypt 密碼雜湊演算法，完全在本地處理">
  <link rel="stylesheet" href="/src/styles/global.css">
</head>
<body>
  <div class="tool-page">
    <header class="tool-header">
      <a href="/index.html" class="back-btn"><span>&larr;</span><span data-i18n="back">返回</span></a>
      <div class="tool-title">
        <h1>CRY-033 <span data-i18n="cry033_name">bcrypt 密碼雜湊</span></h1>
        <p data-i18n="cry033_desc">使用 bcrypt 演算法雜湊密碼</p>
      </div>
      <div class="lang-switcher">
        <button onclick="setLanguage('zh-TW')" class="lang-btn">繁中</button>
        <button onclick="setLanguage('en')" class="lang-btn">EN</button>
      </div>
    </header>
    <main class="tool-content">
      <div id="statusMessage" class="status-message"></div>
      <div class="settings-panel">
        <h3>bcrypt 設定</h3>
        <div class="setting-row"><label for="costFactor">成本因子 (工作因子)</label><select id="costFactor"><option value="10">10 (快速)</option><option value="12" selected>12 (推薦)</option><option value="14">14 (安全)</option><option value="16">16 (高安全)</option></select></div>
      </div>
      <div class="input-group"><label for="password">密碼</label><div class="password-input"><input type="password" id="password" placeholder="輸入密碼 (最多 72 bytes)" maxlength="72"><button type="button" id="togglePassword" class="btn btn-small">顯示</button></div><small class="help-text">bcrypt 密碼長度限制為 72 bytes</small></div>
      <div class="action-buttons"><button id="hashBtn" class="btn btn-primary"><span>🔑</span><span>雜湊密碼</span></button><button id="verifyBtn" class="btn btn-secondary"><span>✅</span><span>驗證密碼</span></button><button id="clearBtn" class="btn btn-secondary"><span>🗑️</span><span>清除</span></button></div>
      <div id="progressContainer" class="progress-container"><div class="progress-bar"><div id="progressFill" class="progress-fill"></div></div><p id="progressText" class="progress-text">處理中...</p></div>
      <div class="input-group"><label for="hashResult">bcrypt 雜湊</label><textarea id="hashResult" rows="2" placeholder="雜湊值將顯示在此 (可貼上雜湊以驗證)..." class="mono"></textarea><button id="copyBtn" class="btn btn-small btn-success" style="margin-top: 0.5rem;">複製結果</button></div>
      <div id="verifyResult" class="result-box" style="display: none;"><div id="resultIcon" class="result-icon"></div><div id="resultText" class="result-text"></div></div>
      <div id="hashInfo" class="settings-panel" style="display: none;"><h3>雜湊資訊</h3><div class="setting-row"><label>處理時間</label><span id="processTime">-</span></div></div>
    </main>
    <footer class="footer"><p data-i18n="footer_privacy">所有檔案處理均在本地完成，不會上傳到伺服器</p></footer>
  </div>
  <script type="module" src="/src/i18n/i18n.js"></script>
  <script type="module" src="./bcrypt.js"></script>
</body>
</html>
