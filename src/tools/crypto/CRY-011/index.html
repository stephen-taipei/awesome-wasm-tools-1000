<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CRY-011 Ed25519 簽章 - Awesome WASM Tools 1000</title>
  <meta name="description" content="使用 Ed25519 演算法建立數位簽章，高效能橢圓曲線簽章，完全在本地處理">
  <link rel="stylesheet" href="/src/styles/global.css">
</head>
<body>
  <div class="tool-page">
    <header class="tool-header">
      <a href="/index.html" class="back-btn">
        <span>&larr;</span>
        <span data-i18n="back">返回</span>
      </a>
      <div class="tool-title">
        <h1>CRY-011 <span data-i18n="cry011_name">Ed25519 簽章</span></h1>
        <p data-i18n="cry011_desc">使用 Ed25519 演算法建立高效能數位簽章</p>
      </div>
      <div class="lang-switcher">
        <button onclick="setLanguage('zh-TW')" class="lang-btn">繁中</button>
        <button onclick="setLanguage('en')" class="lang-btn">EN</button>
      </div>
    </header>

    <main class="tool-content">
      <div id="statusMessage" class="status-message"></div>

      <div class="settings-panel">
        <h3>簽章設定</h3>
        <div class="setting-row">
          <label for="outputFormat">輸出格式</label>
          <select id="outputFormat">
            <option value="base64" selected>Base64</option>
            <option value="hex">十六進位</option>
          </select>
        </div>
      </div>

      <div class="input-group">
        <label for="privateKey">私鑰 (32 bytes, Hex 或 Base64)</label>
        <div class="password-input">
          <textarea id="privateKey" rows="2" placeholder="輸入 Ed25519 私鑰..."></textarea>
          <button type="button" id="generateKeyBtn" class="btn btn-small btn-secondary">生成金鑰對</button>
        </div>
      </div>

      <div class="input-group">
        <label for="publicKey">公鑰 (自動生成)</label>
        <textarea id="publicKey" rows="2" readonly placeholder="公鑰將自動從私鑰生成..."></textarea>
        <button id="copyPublicBtn" class="btn btn-small btn-success" style="margin-top: 0.5rem;">複製公鑰</button>
      </div>

      <div class="input-group">
        <label for="message">訊息</label>
        <textarea id="message" rows="4" placeholder="輸入要簽章的訊息..."></textarea>
      </div>

      <div class="action-buttons">
        <button id="signBtn" class="btn btn-primary">
          <span>✍️</span>
          <span>建立簽章</span>
        </button>
        <button id="clearBtn" class="btn btn-secondary">
          <span>🗑️</span>
          <span>清除</span>
        </button>
      </div>

      <div class="input-group">
        <label for="signature">數位簽章 (64 bytes)</label>
        <textarea id="signature" rows="3" readonly placeholder="簽章將顯示在此..."></textarea>
        <button id="copyBtn" class="btn btn-small btn-success" style="margin-top: 0.5rem;">複製簽章</button>
      </div>

      <div id="signInfo" class="settings-panel" style="display: none;">
        <h3>簽章資訊</h3>
        <div class="setting-row">
          <label>處理時間</label>
          <span id="processTime">-</span>
        </div>
        <div class="setting-row">
          <label>簽章長度</label>
          <span id="signatureLength">64 bytes</span>
        </div>
      </div>
    </main>

    <footer class="footer">
      <p data-i18n="footer_privacy">所有檔案處理均在本地完成，不會上傳到伺服器</p>
    </footer>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@noble/ed25519@2.0.0/lib/esm/index.min.js" type="module"></script>
  <script type="module" src="/src/i18n/i18n.js"></script>
  <script type="module" src="./ed25519-sign.js"></script>
</body>
</html>
