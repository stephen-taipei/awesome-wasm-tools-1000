<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CRY-065 SSH 金鑰生成 - Awesome WASM Tools 1000</title>
  <meta name="description" content="生成 SSH 金鑰對，完全在本地處理">
  <link rel="stylesheet" href="/src/styles/global.css">
</head>
<body>
  <div class="tool-page">
    <header class="tool-header">
      <a href="/index.html" class="back-btn">
        <span>&larr;</span>
        <span data-i18n="back">返回</span>
      </a>
      <div class="tool-title">
        <h1>CRY-065 <span data-i18n="cry065_name">SSH 金鑰生成</span></h1>
        <p data-i18n="cry065_desc">生成 SSH 金鑰對</p>
      </div>
      <div class="lang-switcher">
        <button onclick="setLanguage('zh-TW')" class="lang-btn">繁中</button>
        <button onclick="setLanguage('en')" class="lang-btn">EN</button>
      </div>
    </header>

    <main class="tool-content">
      <div id="statusMessage" class="status-message"></div>

      <div class="settings-panel">
        <h3>金鑰設定</h3>
        <div class="setting-row">
          <label for="keyType">金鑰類型</label>
          <select id="keyType">
            <option value="rsa">RSA</option>
            <option value="ecdsa" selected>ECDSA</option>
          </select>
        </div>
        <div class="setting-row" id="rsaOptions" style="display: none;">
          <label for="rsaSize">RSA 金鑰長度</label>
          <select id="rsaSize">
            <option value="2048">2048 位元</option>
            <option value="4096" selected>4096 位元</option>
          </select>
        </div>
        <div class="setting-row" id="ecdsaOptions">
          <label for="ecdsaCurve">ECDSA 曲線</label>
          <select id="ecdsaCurve">
            <option value="P-256" selected>nistp256</option>
            <option value="P-384">nistp384</option>
            <option value="P-521">nistp521</option>
          </select>
        </div>
      </div>

      <div class="input-group">
        <label for="comment">註解（可選）</label>
        <input type="text" id="comment" placeholder="例如：user@hostname">
      </div>

      <div class="action-buttons">
        <button id="generateBtn" class="btn btn-primary">
          <span>🔑</span>
          <span>生成金鑰對</span>
        </button>
        <button id="clearBtn" class="btn btn-secondary">
          <span>🗑️</span>
          <span>清除</span>
        </button>
      </div>

      <div id="keyResult" class="settings-panel" style="display: none;">
        <h3>公鑰</h3>
        <textarea id="publicKey" rows="4" readonly class="mono"></textarea>
        <div style="margin-top: 0.5rem;">
          <button id="copyPublic" class="btn btn-small btn-success">複製</button>
          <button id="downloadPublic" class="btn btn-small btn-secondary">下載 (id_xxx.pub)</button>
        </div>

        <h3 style="margin-top: 1rem;">私鑰</h3>
        <textarea id="privateKey" rows="10" readonly class="mono"></textarea>
        <div style="margin-top: 0.5rem;">
          <button id="copyPrivate" class="btn btn-small btn-success">複製</button>
          <button id="downloadPrivate" class="btn btn-small btn-secondary">下載 (id_xxx)</button>
        </div>
        <p style="color: #ef4444; margin-top: 0.5rem; font-size: 0.875rem;">⚠️ 私鑰請妥善保存，不要分享給任何人！</p>

        <div class="setting-row" style="margin-top: 1rem;">
          <label>金鑰指紋</label>
          <span id="fingerprint" class="mono" style="word-break: break-all;">-</span>
        </div>
      </div>
    </main>

    <footer class="footer">
      <p data-i18n="footer_privacy">所有檔案處理均在本地完成，不會上傳到伺服器</p>
    </footer>
  </div>

  <script type="module" src="/src/i18n/i18n.js"></script>
  <script type="module" src="./ssh-keygen.js"></script>
</body>
</html>
