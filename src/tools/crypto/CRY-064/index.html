<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CRY-064 二維碼 OTP 生成 - Awesome WASM Tools 1000</title>
  <meta name="description" content="生成 OTP 配置二維碼，完全在本地處理">
  <link rel="stylesheet" href="/src/styles/global.css">
</head>
<body>
  <div class="tool-page">
    <header class="tool-header">
      <a href="/index.html" class="back-btn">
        <span>&larr;</span>
        <span data-i18n="back">返回</span>
      </a>
      <div class="tool-title">
        <h1>CRY-064 <span data-i18n="cry064_name">二維碼 OTP 生成</span></h1>
        <p data-i18n="cry064_desc">生成可掃描的 OTP 配置二維碼</p>
      </div>
      <div class="lang-switcher">
        <button onclick="setLanguage('zh-TW')" class="lang-btn">繁中</button>
        <button onclick="setLanguage('en')" class="lang-btn">EN</button>
      </div>
    </header>

    <main class="tool-content">
      <div id="statusMessage" class="status-message"></div>

      <div class="settings-panel">
        <h3>OTP 設定</h3>
        <div class="setting-row">
          <label for="otpType">類型</label>
          <select id="otpType">
            <option value="totp" selected>TOTP (基於時間)</option>
            <option value="hotp">HOTP (基於計數器)</option>
          </select>
        </div>
      </div>

      <div class="input-group">
        <label for="issuer">發行者</label>
        <input type="text" id="issuer" placeholder="例如：MyApp">
      </div>

      <div class="input-group">
        <label for="accountName">帳戶名稱</label>
        <input type="text" id="accountName" placeholder="例如：user@example.com">
      </div>

      <div class="input-group">
        <label for="secret">密鑰（Base32）</label>
        <div class="password-input">
          <input type="text" id="secret" placeholder="輸入或生成密鑰" class="mono">
          <button type="button" id="generateSecret" class="btn btn-small btn-secondary">生成</button>
        </div>
      </div>

      <div class="settings-panel">
        <h3>進階設定</h3>
        <div class="setting-row">
          <label for="digits">位數</label>
          <select id="digits">
            <option value="6" selected>6 位數</option>
            <option value="8">8 位數</option>
          </select>
        </div>
        <div class="setting-row" id="periodRow">
          <label for="period">時間週期（秒）</label>
          <select id="period">
            <option value="30" selected>30</option>
            <option value="60">60</option>
          </select>
        </div>
        <div class="setting-row" id="counterRow" style="display: none;">
          <label for="counter">初始計數器</label>
          <input type="number" id="counter" value="0" min="0">
        </div>
        <div class="setting-row">
          <label for="algorithm">演算法</label>
          <select id="algorithm">
            <option value="SHA1" selected>SHA1</option>
            <option value="SHA256">SHA256</option>
            <option value="SHA512">SHA512</option>
          </select>
        </div>
      </div>

      <div class="action-buttons">
        <button id="generateBtn" class="btn btn-primary">
          <span>📱</span>
          <span>生成二維碼</span>
        </button>
        <button id="clearBtn" class="btn btn-secondary">
          <span>🗑️</span>
          <span>清除</span>
        </button>
      </div>

      <div id="qrResult" class="settings-panel" style="display: none;">
        <h3>OTP 二維碼</h3>
        <div id="qrCode" style="text-align: center; padding: 1rem; background: white; border-radius: 0.5rem;"></div>
        <div style="margin-top: 1rem;">
          <label>OTP URI</label>
          <textarea id="otpUri" rows="3" readonly class="mono" style="width: 100%; margin-top: 0.5rem;"></textarea>
          <button id="copyUri" class="btn btn-small btn-success" style="margin-top: 0.5rem;">複製 URI</button>
        </div>
      </div>
    </main>

    <footer class="footer">
      <p data-i18n="footer_privacy">所有檔案處理均在本地完成，不會上傳到伺服器</p>
    </footer>
  </div>

  <script type="module" src="/src/i18n/i18n.js"></script>
  <script type="module" src="./qr-otp.js"></script>
</body>
</html>
