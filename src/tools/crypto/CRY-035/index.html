<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CRY-035 密碼強度檢測 - Awesome WASM Tools 1000</title>
  <meta name="description" content="檢測密碼強度，完全在本地處理">
  <link rel="stylesheet" href="/src/styles/global.css">
</head>
<body>
  <div class="tool-page">
    <header class="tool-header">
      <a href="/index.html" class="back-btn"><span>&larr;</span><span data-i18n="back">返回</span></a>
      <div class="tool-title">
        <h1>CRY-035 <span data-i18n="cry035_name">密碼強度檢測</span></h1>
        <p data-i18n="cry035_desc">檢測密碼強度和安全性</p>
      </div>
      <div class="lang-switcher">
        <button onclick="setLanguage('zh-TW')" class="lang-btn">繁中</button>
        <button onclick="setLanguage('en')" class="lang-btn">EN</button>
      </div>
    </header>
    <main class="tool-content">
      <div id="statusMessage" class="status-message"></div>
      <div class="input-group"><label for="password">密碼</label><div class="password-input"><input type="password" id="password" placeholder="輸入要檢測的密碼"><button type="button" id="togglePassword" class="btn btn-small">顯示</button></div></div>
      <div class="action-buttons"><button id="checkBtn" class="btn btn-primary"><span>🔍</span><span>檢測強度</span></button><button id="clearBtn" class="btn btn-secondary"><span>🗑️</span><span>清除</span></button></div>
      <div id="resultPanel" class="settings-panel" style="display: none;">
        <h3>檢測結果</h3>
        <div class="strength-meter"><div id="strengthBar" class="strength-bar"></div></div>
        <div id="strengthLabel" class="strength-label"></div>
        <div class="setting-row"><label>密碼長度</label><span id="pwdLength">-</span></div>
        <div class="setting-row"><label>熵值 (bits)</label><span id="entropyBits">-</span></div>
        <div class="setting-row"><label>破解時間估計</label><span id="crackTime">-</span></div>
        <h4 style="margin-top: 1rem;">字元組成</h4>
        <div class="setting-row"><label>小寫字母</label><span id="hasLower">-</span></div>
        <div class="setting-row"><label>大寫字母</label><span id="hasUpper">-</span></div>
        <div class="setting-row"><label>數字</label><span id="hasDigit">-</span></div>
        <div class="setting-row"><label>特殊符號</label><span id="hasSpecial">-</span></div>
        <h4 style="margin-top: 1rem;">安全建議</h4>
        <ul id="suggestions" class="suggestions-list"></ul>
      </div>
    </main>
    <footer class="footer"><p data-i18n="footer_privacy">所有檔案處理均在本地完成，不會上傳到伺服器</p></footer>
  </div>
  <script type="module" src="/src/i18n/i18n.js"></script>
  <script type="module" src="./strength.js"></script>
</body>
</html>
