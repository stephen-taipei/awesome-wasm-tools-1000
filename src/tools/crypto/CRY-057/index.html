<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CRY-057 JWE 解密 - Awesome WASM Tools 1000</title>
  <meta name="description" content="解密 JWE (JSON Web Encryption) 資料，完全在本地處理">
  <link rel="stylesheet" href="/src/styles/global.css">
</head>
<body>
  <div class="tool-page">
    <header class="tool-header">
      <a href="/index.html" class="back-btn">
        <span>&larr;</span>
        <span data-i18n="back">返回</span>
      </a>
      <div class="tool-title">
        <h1>CRY-057 <span data-i18n="cry057_name">JWE 解密</span></h1>
        <p data-i18n="cry057_desc">解密 JWE (JSON Web Encryption) 資料</p>
      </div>
      <div class="lang-switcher">
        <button onclick="setLanguage('zh-TW')" class="lang-btn">繁中</button>
        <button onclick="setLanguage('en')" class="lang-btn">EN</button>
      </div>
    </header>

    <main class="tool-content">
      <div id="statusMessage" class="status-message"></div>

      <div class="input-group">
        <label for="jwe">JWE</label>
        <textarea id="jwe" rows="5" class="mono" placeholder="貼上 JWE 進行解密..."></textarea>
      </div>

      <div class="input-group">
        <label for="key">解密金鑰</label>
        <div class="password-input">
          <input type="password" id="key" placeholder="輸入解密金鑰">
          <button type="button" id="toggleKey" class="btn btn-small">顯示</button>
        </div>
      </div>

      <div class="action-buttons">
        <button id="decryptBtn" class="btn btn-primary">
          <span>🔓</span>
          <span>解密</span>
        </button>
        <button id="clearBtn" class="btn btn-secondary">
          <span>🗑️</span>
          <span>清除</span>
        </button>
      </div>

      <div class="input-group">
        <label for="plaintextOutput">解密結果</label>
        <textarea id="plaintextOutput" rows="6" readonly placeholder="解密結果將顯示在此..."></textarea>
        <button id="copyBtn" class="btn btn-small btn-success" style="margin-top: 0.5rem;">複製</button>
      </div>

      <div id="jweInfo" class="settings-panel" style="display: none;">
        <h3>JWE 資訊</h3>
        <div class="setting-row">
          <label>金鑰演算法 (alg)</label>
          <span id="algValue">-</span>
        </div>
        <div class="setting-row">
          <label>內容加密 (enc)</label>
          <span id="encValue">-</span>
        </div>
      </div>
    </main>

    <footer class="footer">
      <p data-i18n="footer_privacy">所有檔案處理均在本地完成，不會上傳到伺服器</p>
    </footer>
  </div>

  <script type="module" src="/src/i18n/i18n.js"></script>
  <script type="module" src="./jwe-decrypt.js"></script>
</body>
</html>
