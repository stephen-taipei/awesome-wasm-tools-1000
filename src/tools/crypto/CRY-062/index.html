<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CRY-062 HOTP 生成 - Awesome WASM Tools 1000</title>
  <meta name="description" content="生成基於計數器的一次性密碼 (HOTP)，完全在本地處理">
  <link rel="stylesheet" href="/src/styles/global.css">
</head>
<body>
  <div class="tool-page">
    <header class="tool-header">
      <a href="/index.html" class="back-btn">
        <span>&larr;</span>
        <span data-i18n="back">返回</span>
      </a>
      <div class="tool-title">
        <h1>CRY-062 <span data-i18n="cry062_name">HOTP 生成</span></h1>
        <p data-i18n="cry062_desc">生成基於計數器的一次性密碼 (HOTP)</p>
      </div>
      <div class="lang-switcher">
        <button onclick="setLanguage('zh-TW')" class="lang-btn">繁中</button>
        <button onclick="setLanguage('en')" class="lang-btn">EN</button>
      </div>
    </header>

    <main class="tool-content">
      <div id="statusMessage" class="status-message"></div>

      <div class="input-group">
        <label for="secret">密鑰（Base32 編碼）</label>
        <div class="password-input">
          <input type="text" id="secret" placeholder="輸入 Base32 密鑰" class="mono">
          <button type="button" id="generateSecret" class="btn btn-small btn-secondary">生成</button>
        </div>
      </div>

      <div class="input-group">
        <label for="counter">計數器值</label>
        <div class="password-input">
          <input type="number" id="counter" value="0" min="0" class="mono">
          <button type="button" id="incrementCounter" class="btn btn-small">+1</button>
        </div>
      </div>

      <div class="settings-panel">
        <h3>HOTP 設定</h3>
        <div class="setting-row">
          <label for="digits">位數</label>
          <select id="digits">
            <option value="6" selected>6 位數</option>
            <option value="8">8 位數</option>
          </select>
        </div>
      </div>

      <div class="action-buttons">
        <button id="generateBtn" class="btn btn-primary">
          <span>🔢</span>
          <span>生成 HOTP</span>
        </button>
        <button id="clearBtn" class="btn btn-secondary">
          <span>🗑️</span>
          <span>清除</span>
        </button>
      </div>

      <div id="hotpResult" class="settings-panel" style="display: none;">
        <h3>HOTP 驗證碼</h3>
        <div id="hotpDisplay" style="text-align: center; font-size: 3rem; font-weight: bold; font-family: monospace; letter-spacing: 0.5rem; padding: 1rem; color: #22c55e;"></div>
        <div style="text-align: center; margin-top: 1rem;">
          <button id="copyHotp" class="btn btn-success">複製驗證碼</button>
        </div>
        <div class="setting-row" style="margin-top: 1rem;">
          <label>使用的計數器值</label>
          <span id="usedCounter" class="mono">-</span>
        </div>
      </div>

      <div id="hotpHistory" class="settings-panel" style="display: none;">
        <h3>歷史記錄</h3>
        <table style="width: 100%;">
          <thead>
            <tr>
              <th>計數器</th>
              <th>驗證碼</th>
            </tr>
          </thead>
          <tbody id="historyTable"></tbody>
        </table>
      </div>
    </main>

    <footer class="footer">
      <p data-i18n="footer_privacy">所有檔案處理均在本地完成，不會上傳到伺服器</p>
    </footer>
  </div>

  <script type="module" src="/src/i18n/i18n.js"></script>
  <script type="module" src="./hotp-generate.js"></script>
</body>
</html>
