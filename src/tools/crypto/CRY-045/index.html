<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CRY-045 PGP 解密 - Awesome WASM Tools 1000</title>
  <meta name="description" content="使用 PGP 私鑰解密訊息，完全在本地處理">
  <link rel="stylesheet" href="/src/styles/global.css">
</head>
<body>
  <div class="tool-page">
    <header class="tool-header">
      <a href="/index.html" class="back-btn">
        <span>&larr;</span>
        <span data-i18n="back">返回</span>
      </a>
      <div class="tool-title">
        <h1>CRY-045 <span data-i18n="cry045_name">PGP 解密</span></h1>
        <p data-i18n="cry045_desc">使用 PGP 私鑰解密訊息</p>
      </div>
      <div class="lang-switcher">
        <button onclick="setLanguage('zh-TW')" class="lang-btn">繁中</button>
        <button onclick="setLanguage('en')" class="lang-btn">EN</button>
      </div>
    </header>

    <main class="tool-content">
      <div id="statusMessage" class="status-message"></div>

      <div class="input-group">
        <label for="privateKey">私鑰</label>
        <textarea id="privateKey" rows="6" placeholder="貼上 PGP 私鑰..."></textarea>
        <input type="file" id="privateKeyFile" accept=".asc,.pem,.key" style="margin-top: 0.5rem;">
      </div>

      <div class="input-group">
        <label for="passphrase">密碼短語</label>
        <div class="password-input">
          <input type="password" id="passphrase" placeholder="輸入私鑰密碼短語">
          <button type="button" id="togglePassphrase" class="btn btn-small">顯示</button>
        </div>
      </div>

      <div class="input-group">
        <label for="ciphertext">加密訊息</label>
        <textarea id="ciphertext" rows="6" placeholder="貼上 PGP 加密訊息..."></textarea>
        <input type="file" id="ciphertextFile" accept=".asc,.gpg" style="margin-top: 0.5rem;">
      </div>

      <div class="action-buttons">
        <button id="decryptBtn" class="btn btn-primary">
          <span>🔓</span>
          <span>解密</span>
        </button>
        <button id="clearBtn" class="btn btn-secondary">
          <span>🗑️</span>
          <span>清除</span>
        </button>
      </div>

      <div class="input-group">
        <label for="plaintext">解密結果</label>
        <textarea id="plaintext" rows="6" readonly placeholder="解密結果將顯示在此..."></textarea>
        <button id="copyBtn" class="btn btn-small btn-success" style="margin-top: 0.5rem;">複製</button>
      </div>
    </main>

    <footer class="footer">
      <p data-i18n="footer_privacy">所有檔案處理均在本地完成，不會上傳到伺服器</p>
    </footer>
  </div>

  <script type="module" src="/src/i18n/i18n.js"></script>
  <script type="module" src="./pgp-decrypt.js"></script>
</body>
</html>
