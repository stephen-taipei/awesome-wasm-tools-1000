<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CRY-029 HMAC 生成 - Awesome WASM Tools 1000</title>
  <meta name="description" content="生成 HMAC 訊息驗證碼，完全在本地處理">
  <link rel="stylesheet" href="/src/styles/global.css">
</head>
<body>
  <div class="tool-page">
    <header class="tool-header">
      <a href="/index.html" class="back-btn"><span>&larr;</span><span data-i18n="back">返回</span></a>
      <div class="tool-title">
        <h1>CRY-029 <span data-i18n="cry029_name">HMAC 生成</span></h1>
        <p data-i18n="cry029_desc">生成 HMAC (雜湊訊息驗證碼)</p>
      </div>
      <div class="lang-switcher">
        <button onclick="setLanguage('zh-TW')" class="lang-btn">繁中</button>
        <button onclick="setLanguage('en')" class="lang-btn">EN</button>
      </div>
    </header>
    <main class="tool-content">
      <div id="statusMessage" class="status-message"></div>
      <div class="settings-panel">
        <h3>HMAC 設定</h3>
        <div class="setting-row"><label for="algorithm">雜湊演算法</label><select id="algorithm"><option value="SHA-256" selected>HMAC-SHA256</option><option value="SHA-384">HMAC-SHA384</option><option value="SHA-512">HMAC-SHA512</option></select></div>
        <div class="setting-row"><label for="outputFormat">輸出格式</label><select id="outputFormat"><option value="hex" selected>十六進位 (小寫)</option><option value="HEX">十六進位 (大寫)</option><option value="base64">Base64</option></select></div>
      </div>
      <div class="input-group"><label for="secretKey">密鑰 (Secret Key)</label>
        <div class="password-input"><input type="password" id="secretKey" placeholder="輸入 HMAC 密鑰"><button type="button" id="toggleKey" class="btn btn-small">顯示</button><button type="button" id="generateKey" class="btn btn-small btn-secondary">生成密鑰</button></div>
      </div>
      <div class="input-group"><label for="message">訊息</label><textarea id="message" rows="5" placeholder="輸入要計算 HMAC 的訊息..."></textarea></div>
      <div class="action-buttons"><button id="generateBtn" class="btn btn-primary"><span>🔑</span><span>生成 HMAC</span></button><button id="clearBtn" class="btn btn-secondary"><span>🗑️</span><span>清除</span></button></div>
      <div class="input-group"><label for="hmacResult">HMAC 值</label><textarea id="hmacResult" rows="2" readonly placeholder="HMAC 將顯示在此..." class="mono"></textarea><button id="copyBtn" class="btn btn-small btn-success" style="margin-top: 0.5rem;">複製結果</button></div>
      <div id="hmacInfo" class="settings-panel" style="display: none;"><h3>HMAC 資訊</h3><div class="setting-row"><label>處理時間</label><span id="processTime">-</span></div></div>
    </main>
    <footer class="footer"><p data-i18n="footer_privacy">所有檔案處理均在本地完成，不會上傳到伺服器</p></footer>
  </div>
  <script type="module" src="/src/i18n/i18n.js"></script>
  <script type="module" src="./hmac-generate.js"></script>
</body>
</html>
