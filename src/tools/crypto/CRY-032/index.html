<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CRY-032 Argon2 密碼雜湊 - Awesome WASM Tools 1000</title>
  <meta name="description" content="使用 Argon2 密碼雜湊演算法，完全在本地處理">
  <link rel="stylesheet" href="/src/styles/global.css">
</head>
<body>
  <div class="tool-page">
    <header class="tool-header">
      <a href="/index.html" class="back-btn"><span>&larr;</span><span data-i18n="back">返回</span></a>
      <div class="tool-title">
        <h1>CRY-032 <span data-i18n="cry032_name">Argon2 密碼雜湊</span></h1>
        <p data-i18n="cry032_desc">使用 Argon2 (密碼雜湊比賽冠軍) 雜湊密碼</p>
      </div>
      <div class="lang-switcher">
        <button onclick="setLanguage('zh-TW')" class="lang-btn">繁中</button>
        <button onclick="setLanguage('en')" class="lang-btn">EN</button>
      </div>
    </header>
    <main class="tool-content">
      <div id="statusMessage" class="status-message"></div>
      <div class="settings-panel">
        <h3>Argon2 設定</h3>
        <div class="setting-row"><label for="variant">Argon2 變體</label><select id="variant"><option value="argon2id" selected>Argon2id (推薦)</option><option value="argon2i">Argon2i</option><option value="argon2d">Argon2d</option></select></div>
        <div class="setting-row"><label for="memory">記憶體成本 (KB)</label><select id="memory"><option value="16384">16 MB</option><option value="65536" selected>64 MB (推薦)</option><option value="131072">128 MB</option></select></div>
        <div class="setting-row"><label for="iterations">時間成本 (迭代)</label><select id="iterations"><option value="1">1</option><option value="2">2</option><option value="3" selected>3 (推薦)</option><option value="4">4</option></select></div>
        <div class="setting-row"><label for="parallelism">並行度</label><select id="parallelism"><option value="1" selected>1</option><option value="2">2</option><option value="4">4</option></select></div>
        <div class="setting-row"><label for="hashLength">輸出長度</label><select id="hashLength"><option value="32" selected>32 bytes</option><option value="64">64 bytes</option></select></div>
      </div>
      <div class="input-group"><label for="password">密碼</label><div class="password-input"><input type="password" id="password" placeholder="輸入密碼"><button type="button" id="togglePassword" class="btn btn-small">顯示</button></div></div>
      <div class="input-group"><label for="salt">鹽值 (Salt)</label><div class="password-input"><input type="text" id="salt" placeholder="輸入鹽值 (十六進位)" class="mono"><button type="button" id="generateSalt" class="btn btn-small btn-secondary">生成鹽值</button></div></div>
      <div class="action-buttons"><button id="hashBtn" class="btn btn-primary"><span>🔑</span><span>雜湊密碼</span></button><button id="clearBtn" class="btn btn-secondary"><span>🗑️</span><span>清除</span></button></div>
      <div id="progressContainer" class="progress-container"><div class="progress-bar"><div id="progressFill" class="progress-fill"></div></div><p id="progressText" class="progress-text">處理中...</p></div>
      <div class="input-group"><label for="hashResult">Argon2 雜湊</label><textarea id="hashResult" rows="2" readonly placeholder="雜湊值將顯示在此..." class="mono"></textarea><button id="copyBtn" class="btn btn-small btn-success" style="margin-top: 0.5rem;">複製結果</button></div>
      <div id="hashInfo" class="settings-panel" style="display: none;"><h3>雜湊資訊</h3><div class="setting-row"><label>處理時間</label><span id="processTime">-</span></div></div>
    </main>
    <footer class="footer"><p data-i18n="footer_privacy">所有檔案處理均在本地完成，不會上傳到伺服器</p></footer>
  </div>
  <script type="module" src="/src/i18n/i18n.js"></script>
  <script type="module" src="./argon2.js"></script>
</body>
</html>
