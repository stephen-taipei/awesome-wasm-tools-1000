<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PDF-022 PDF 解密 - Awesome WASM Tools 1000</title>
  <meta name="description" content="解鎖受密碼保護的 PDF 文件">
  <link rel="stylesheet" href="/src/styles/global.css">
</head>
<body>
  <div class="tool-page">
    <header class="tool-header">
      <a href="/index.html" class="back-btn"><span>←</span><span data-i18n="back">返回</span></a>
      <div class="tool-title">
        <h1>PDF-022 <span data-i18n="pdf022_name">PDF 解密</span></h1>
        <p data-i18n="pdf022_desc">解鎖受密碼保護的 PDF 文件</p>
      </div>
      <div class="lang-switcher">
        <button onclick="setLanguage('zh-TW')" class="lang-btn">繁中</button>
        <button onclick="setLanguage('en')" class="lang-btn">EN</button>
      </div>
    </header>
    <main class="tool-content">
      <div id="statusMessage" class="status-message"></div>
      <div id="uploadArea" class="upload-area">
        <div class="icon">🔒</div>
        <h3 data-i18n="upload_title">拖放加密的 PDF 文件到此處</h3>
        <p data-i18n="upload_subtitle">或點擊選擇檔案</p>
        <input type="file" id="fileInput" class="file-input" accept="application/pdf">
      </div>
      <div id="settingsPanel" class="settings-panel" style="display: none;">
        <h3 data-i18n="settings">解密設定</h3>
        <div class="setting-row">
          <label>輸入密碼</label>
          <input type="password" id="password" placeholder="輸入 PDF 密碼">
        </div>
        <div class="setting-row">
          <label>文件資訊</label>
          <span id="fileInfo">-</span>
        </div>
      </div>
      <div id="progressContainer" class="progress-container">
        <div class="progress-bar"><div id="progressFill" class="progress-fill"></div></div>
        <p id="progressText" class="progress-text">處理中...</p>
      </div>
      <div class="action-buttons">
        <button id="processBtn" class="btn btn-primary" disabled><span>🔓</span><span data-i18n="decrypt">解密 PDF</span></button>
        <button id="downloadBtn" class="btn btn-success" style="display: none;"><span>⬇️</span><span data-i18n="download">下載解密 PDF</span></button>
        <button id="resetBtn" class="btn btn-secondary" style="display: none;"><span>🗑️</span><span data-i18n="reset">重置</span></button>
      </div>
      <div id="performanceInfo" class="settings-panel" style="display: none;">
        <h3>📊 處理資訊</h3>
        <div class="setting-row"><label>處理時間</label><span id="processTime">-</span></div>
      </div>
    </main>
    <footer class="footer"><p data-i18n="footer_privacy">所有檔案處理均在本地完成，不會上傳到伺服器</p></footer>
  </div>
  <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
  <script type="module" src="/src/i18n/i18n.js"></script>
  <script type="module" src="./decrypt.js"></script>
</body>
</html>
