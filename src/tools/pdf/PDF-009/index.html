<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PDF-009 圖片轉 PDF - Awesome WASM Tools 1000</title>
  <meta name="description" content="將多張圖片合併轉換為 PDF 文件">
  <link rel="stylesheet" href="/src/styles/global.css">
</head>
<body>
  <div class="tool-page">
    <header class="tool-header">
      <a href="/index.html" class="back-btn">
        <span>←</span>
        <span data-i18n="back">返回</span>
      </a>
      <div class="tool-title">
        <h1>PDF-009 <span data-i18n="pdf009_name">圖片轉 PDF</span></h1>
        <p data-i18n="pdf009_desc">將多張圖片合併轉換為 PDF 文件</p>
      </div>
      <div class="lang-switcher">
        <button onclick="setLanguage('zh-TW')" class="lang-btn">繁中</button>
        <button onclick="setLanguage('en')" class="lang-btn">EN</button>
      </div>
    </header>

    <main class="tool-content">
      <div id="statusMessage" class="status-message"></div>

      <div id="uploadArea" class="upload-area">
        <div class="icon">🖼️</div>
        <h3 data-i18n="upload_title">拖放圖片到此處</h3>
        <p data-i18n="upload_subtitle">或點擊選擇檔案（可選擇多個）</p>
        <p class="upload-formats">支援格式：JPG, PNG, GIF, WebP</p>
        <input type="file" id="fileInput" class="file-input" accept="image/*" multiple>
      </div>

      <div id="imageListContainer" class="settings-panel" style="display: none;">
        <h3>圖片列表（拖拽排序）</h3>
        <div id="imageList" class="file-list"></div>
        <button id="addMoreBtn" class="btn btn-secondary">
          <span>+</span>
          <span>添加更多圖片</span>
        </button>
      </div>

      <div id="settingsPanel" class="settings-panel" style="display: none;">
        <h3 data-i18n="settings">PDF 設定</h3>
        <div class="setting-row">
          <label>頁面大小</label>
          <select id="pageSize">
            <option value="a4">A4</option>
            <option value="letter">Letter</option>
            <option value="fit">適應圖片大小</option>
          </select>
        </div>
        <div class="setting-row">
          <label>頁面方向</label>
          <select id="orientation">
            <option value="portrait">直向</option>
            <option value="landscape">橫向</option>
            <option value="auto">自動（依圖片方向）</option>
          </select>
        </div>
        <div class="setting-row">
          <label>圖片適配</label>
          <select id="imageFit">
            <option value="contain">完整顯示（保持比例）</option>
            <option value="cover">填滿頁面（可能裁切）</option>
            <option value="stretch">拉伸填滿</option>
          </select>
        </div>
      </div>

      <div id="progressContainer" class="progress-container">
        <div class="progress-bar">
          <div id="progressFill" class="progress-fill"></div>
        </div>
        <p id="progressText" class="progress-text">處理中...</p>
      </div>

      <div class="action-buttons">
        <button id="processBtn" class="btn btn-primary" disabled>
          <span>📄</span>
          <span data-i18n="convert">轉換為 PDF</span>
        </button>
        <button id="downloadBtn" class="btn btn-success" style="display: none;">
          <span>⬇️</span>
          <span data-i18n="download">下載 PDF</span>
        </button>
        <button id="resetBtn" class="btn btn-secondary" style="display: none;">
          <span>🗑️</span>
          <span data-i18n="reset">重置</span>
        </button>
      </div>

      <div id="performanceInfo" class="settings-panel" style="display: none;">
        <h3>📊 處理資訊</h3>
        <div class="setting-row">
          <label>處理時間</label>
          <span id="processTime">-</span>
        </div>
        <div class="setting-row">
          <label>總頁數</label>
          <span id="pageCount">-</span>
        </div>
      </div>
    </main>

    <footer class="footer">
      <p data-i18n="footer_privacy">所有檔案處理均在本地完成，不會上傳到伺服器</p>
    </footer>
  </div>

  <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
  <script type="module" src="/src/i18n/i18n.js"></script>
  <script type="module" src="./imageToPdf.js"></script>
</body>
</html>
