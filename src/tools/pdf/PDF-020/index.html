<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PDF-020 PDF OCR - Awesome WASM Tools 1000</title>
  <meta name="description" content="使用 OCR 識別 PDF 中的文字內容">
  <link rel="stylesheet" href="/src/styles/global.css">
</head>
<body>
  <div class="tool-page">
    <header class="tool-header">
      <a href="/index.html" class="back-btn">
        <span>←</span>
        <span data-i18n="back">返回</span>
      </a>
      <div class="tool-title">
        <h1>PDF-020 <span data-i18n="pdf020_name">PDF OCR</span></h1>
        <p data-i18n="pdf020_desc">使用 OCR 識別 PDF 中的文字內容</p>
      </div>
      <div class="lang-switcher">
        <button onclick="setLanguage('zh-TW')" class="lang-btn">繁中</button>
        <button onclick="setLanguage('en')" class="lang-btn">EN</button>
      </div>
    </header>

    <main class="tool-content">
      <div id="statusMessage" class="status-message"></div>

      <div id="uploadArea" class="upload-area">
        <div class="icon">📄</div>
        <h3 data-i18n="upload_title">拖放 PDF 文件到此處</h3>
        <p data-i18n="upload_subtitle">或點擊選擇檔案</p>
        <input type="file" id="fileInput" class="file-input" accept="application/pdf">
      </div>

      <div id="settingsPanel" class="settings-panel" style="display: none;">
        <h3 data-i18n="settings">OCR 設定</h3>
        <div class="setting-row">
          <label>識別語言</label>
          <select id="ocrLanguage">
            <option value="chi_tra">繁體中文</option>
            <option value="chi_sim">簡體中文</option>
            <option value="eng">英文</option>
            <option value="jpn">日文</option>
            <option value="kor">韓文</option>
          </select>
        </div>
        <div class="setting-row">
          <label>處理頁面</label>
          <select id="pageRange">
            <option value="all">所有頁面</option>
            <option value="first">僅第一頁</option>
            <option value="custom">自訂範圍</option>
          </select>
        </div>
        <div id="customRangeRow" class="setting-row" style="display: none;">
          <label>頁面範圍（如：1,3,5-8）</label>
          <input type="text" id="customRange" placeholder="1,3,5-8">
        </div>
        <div class="setting-row">
          <label>文件資訊</label>
          <span id="fileInfo">-</span>
        </div>
      </div>

      <div id="progressContainer" class="progress-container">
        <div class="progress-bar">
          <div id="progressFill" class="progress-fill"></div>
        </div>
        <p id="progressText" class="progress-text">處理中...</p>
      </div>

      <div id="resultArea" class="settings-panel" style="display: none;">
        <h3>識別結果</h3>
        <textarea id="ocrResult" rows="10" readonly></textarea>
        <button id="copyBtn" class="btn btn-secondary" style="margin-top: 10px;">
          <span>📋</span>
          <span>複製到剪貼簿</span>
        </button>
      </div>

      <div class="action-buttons">
        <button id="processBtn" class="btn btn-primary" disabled>
          <span>🔍</span>
          <span data-i18n="ocr">開始 OCR 識別</span>
        </button>
        <button id="downloadBtn" class="btn btn-success" style="display: none;">
          <span>⬇️</span>
          <span data-i18n="download">下載文字檔</span>
        </button>
        <button id="resetBtn" class="btn btn-secondary" style="display: none;">
          <span>🗑️</span>
          <span data-i18n="reset">重置</span>
        </button>
      </div>

      <div id="performanceInfo" class="settings-panel" style="display: none;">
        <h3>📊 處理資訊</h3>
        <div class="setting-row">
          <label>處理時間</label>
          <span id="processTime">-</span>
        </div>
        <div class="setting-row">
          <label>識別字元數</label>
          <span id="charCount">-</span>
        </div>
      </div>
    </main>

    <footer class="footer">
      <p data-i18n="footer_privacy">所有檔案處理均在本地完成，不會上傳到伺服器</p>
    </footer>
  </div>

  <script src="https://unpkg.com/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
  <script src="https://unpkg.com/tesseract.js@4.1.1/dist/tesseract.min.js"></script>
  <script type="module" src="/src/i18n/i18n.js"></script>
  <script type="module" src="./ocr.js"></script>
</body>
</html>
