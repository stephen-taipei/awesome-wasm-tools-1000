<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PDF-007 PDF 壓縮 - Awesome WASM Tools 1000</title>
  <meta name="description" content="壓縮 PDF 文件大小，優化圖片品質">
  <link rel="stylesheet" href="/src/styles/global.css">
</head>
<body>
  <div class="tool-page">
    <header class="tool-header">
      <a href="/index.html" class="back-btn">
        <span>←</span>
        <span data-i18n="back">返回</span>
      </a>
      <div class="tool-title">
        <h1>PDF-007 <span data-i18n="pdf007_name">PDF 壓縮</span></h1>
        <p data-i18n="pdf007_desc">壓縮 PDF 文件大小，優化圖片品質</p>
      </div>
      <div class="lang-switcher">
        <button onclick="setLanguage('zh-TW')" class="lang-btn">繁中</button>
        <button onclick="setLanguage('en')" class="lang-btn">EN</button>
      </div>
    </header>

    <main class="tool-content">
      <div id="statusMessage" class="status-message"></div>

      <div id="uploadArea" class="upload-area">
        <div class="icon">📄</div>
        <h3 data-i18n="upload_title">拖放 PDF 文件到此處</h3>
        <p data-i18n="upload_subtitle">或點擊選擇檔案</p>
        <input type="file" id="fileInput" class="file-input" accept="application/pdf">
      </div>

      <div id="settingsPanel" class="settings-panel" style="display: none;">
        <h3 data-i18n="settings">壓縮設定</h3>
        <div class="setting-row">
          <label>壓縮品質</label>
          <select id="compressionLevel">
            <option value="low">低壓縮（高品質）</option>
            <option value="medium" selected>中等壓縮（平衡）</option>
            <option value="high">高壓縮（小檔案）</option>
          </select>
        </div>
        <div class="setting-row">
          <label>原始大小</label>
          <span id="originalSize">-</span>
        </div>
      </div>

      <div id="progressContainer" class="progress-container">
        <div class="progress-bar">
          <div id="progressFill" class="progress-fill"></div>
        </div>
        <p id="progressText" class="progress-text">處理中...</p>
      </div>

      <div class="action-buttons">
        <button id="processBtn" class="btn btn-primary" disabled>
          <span>🗜️</span>
          <span data-i18n="compress">壓縮 PDF</span>
        </button>
        <button id="downloadBtn" class="btn btn-success" style="display: none;">
          <span>⬇️</span>
          <span data-i18n="download">下載 PDF</span>
        </button>
        <button id="resetBtn" class="btn btn-secondary" style="display: none;">
          <span>🗑️</span>
          <span data-i18n="reset">重置</span>
        </button>
      </div>

      <div id="performanceInfo" class="settings-panel" style="display: none;">
        <h3>📊 壓縮結果</h3>
        <div class="setting-row">
          <label>處理時間</label>
          <span id="processTime">-</span>
        </div>
        <div class="setting-row">
          <label>壓縮後大小</label>
          <span id="compressedSize">-</span>
        </div>
        <div class="setting-row">
          <label>節省空間</label>
          <span id="savedSpace">-</span>
        </div>
      </div>
    </main>

    <footer class="footer">
      <p data-i18n="footer_privacy">所有檔案處理均在本地完成，不會上傳到伺服器</p>
    </footer>
  </div>

  <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
  <script type="module" src="/src/i18n/i18n.js"></script>
  <script type="module" src="./compress.js"></script>
</body>
</html>
