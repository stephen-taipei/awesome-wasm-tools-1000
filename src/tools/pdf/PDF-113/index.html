<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PDF-113 PDF 圖片分析 - Awesome WASM Tools 1000</title>
  <meta name="description" content="分析 PDF 中的圖片">
  <link rel="stylesheet" href="/src/styles/global.css">
</head>
<body>
  <div class="tool-page">
    <header class="tool-header">
      <a href="/index.html" class="back-btn"><span>←</span><span data-i18n="back">返回</span></a>
      <div class="tool-title">
        <h1>PDF-113 <span data-i18n="pdf113_name">PDF 圖片分析</span></h1>
        <p data-i18n="pdf113_desc">分析 PDF 中的圖片</p>
      </div>
      <div class="lang-switcher">
        <button onclick="setLanguage('zh-TW')" class="lang-btn">繁中</button>
        <button onclick="setLanguage('en')" class="lang-btn">EN</button>
      </div>
    </header>
    <main class="tool-content">
      <div id="statusMessage" class="status-message"></div>
      <div id="dropZone" class="drop-zone">
        <div class="drop-zone-content">
          <span class="drop-icon">📄</span>
          <p>拖放 PDF 檔案到此處</p>
          <p class="drop-hint">或點擊選擇檔案</p>
        </div>
        <input type="file" id="fileInput" accept=".pdf" hidden>
      </div>
      <div id="fileInfo" class="file-info" style="display: none;">
        <span id="fileName"></span>
        <span id="fileSize"></span>
      </div>
      <div class="action-buttons">
        <button id="processBtn" class="btn btn-primary" disabled><span>⚡</span><span>處理</span></button>
        <button id="clearBtn" class="btn btn-secondary"><span>🗑️</span><span data-i18n="clear">清除</span></button>
      </div>
      <div id="resultArea" class="result-area" style="display: none;">
        <h3 data-i18n="result">處理結果</h3>
        <div id="resultContent" class="result-content"></div>
        <div class="result-actions">
          <button id="downloadBtn" class="btn btn-secondary"><span>💾</span><span>下載</span></button>
        </div>
      </div>
    </main>
    <footer class="footer"><p data-i18n="footer_privacy">所有檔案處理均在本地完成，不會上傳到伺服器</p></footer>
  </div>
  <script type="module" src="/src/i18n/i18n.js"></script>
  <script type="module" src="./tool.js"></script>
</body>
</html>
