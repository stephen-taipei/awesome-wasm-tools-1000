<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PDF-008 PDF 轉圖片 - Awesome WASM Tools 1000</title>
  <meta name="description" content="將 PDF 頁面轉換為圖片格式">
  <link rel="stylesheet" href="/src/styles/global.css">
</head>
<body>
  <div class="tool-page">
    <header class="tool-header">
      <a href="/index.html" class="back-btn">
        <span>←</span>
        <span data-i18n="back">返回</span>
      </a>
      <div class="tool-title">
        <h1>PDF-008 <span data-i18n="pdf008_name">PDF 轉圖片</span></h1>
        <p data-i18n="pdf008_desc">將 PDF 頁面轉換為圖片格式</p>
      </div>
      <div class="lang-switcher">
        <button onclick="setLanguage('zh-TW')" class="lang-btn">繁中</button>
        <button onclick="setLanguage('en')" class="lang-btn">EN</button>
      </div>
    </header>

    <main class="tool-content">
      <div id="statusMessage" class="status-message"></div>

      <div id="uploadArea" class="upload-area">
        <div class="icon">📄</div>
        <h3 data-i18n="upload_title">拖放 PDF 文件到此處</h3>
        <p data-i18n="upload_subtitle">或點擊選擇檔案</p>
        <input type="file" id="fileInput" class="file-input" accept="application/pdf">
      </div>

      <div id="settingsPanel" class="settings-panel" style="display: none;">
        <h3 data-i18n="settings">輸出設定</h3>
        <div class="setting-row">
          <label>輸出格式</label>
          <select id="outputFormat">
            <option value="png">PNG</option>
            <option value="jpeg">JPEG</option>
          </select>
        </div>
        <div class="setting-row">
          <label>縮放比例</label>
          <select id="scale">
            <option value="1">1x（原始大小）</option>
            <option value="1.5">1.5x</option>
            <option value="2" selected>2x（高清）</option>
            <option value="3">3x（超高清）</option>
          </select>
        </div>
        <div class="setting-row">
          <label>轉換頁面</label>
          <select id="pageRange">
            <option value="all">所有頁面</option>
            <option value="first">僅第一頁</option>
            <option value="custom">自訂範圍</option>
          </select>
        </div>
        <div id="customRangeRow" class="setting-row" style="display: none;">
          <label>頁面範圍（如：1,3,5-8）</label>
          <input type="text" id="customRange" placeholder="1,3,5-8">
        </div>
        <div class="setting-row">
          <label>總頁數</label>
          <span id="totalPages">-</span>
        </div>
      </div>

      <div id="progressContainer" class="progress-container">
        <div class="progress-bar">
          <div id="progressFill" class="progress-fill"></div>
        </div>
        <p id="progressText" class="progress-text">處理中...</p>
      </div>

      <div id="previewArea" class="preview-grid" style="display: none;"></div>

      <div class="action-buttons">
        <button id="processBtn" class="btn btn-primary" disabled>
          <span>🖼️</span>
          <span data-i18n="convert">轉換為圖片</span>
        </button>
        <button id="downloadBtn" class="btn btn-success" style="display: none;">
          <span>⬇️</span>
          <span data-i18n="download">下載所有圖片 (ZIP)</span>
        </button>
        <button id="resetBtn" class="btn btn-secondary" style="display: none;">
          <span>🗑️</span>
          <span data-i18n="reset">重置</span>
        </button>
      </div>

      <div id="performanceInfo" class="settings-panel" style="display: none;">
        <h3>📊 處理資訊</h3>
        <div class="setting-row">
          <label>處理時間</label>
          <span id="processTime">-</span>
        </div>
        <div class="setting-row">
          <label>生成圖片數</label>
          <span id="imageCount">-</span>
        </div>
      </div>
    </main>

    <footer class="footer">
      <p data-i18n="footer_privacy">所有檔案處理均在本地完成，不會上傳到伺服器</p>
    </footer>
  </div>

  <script src="https://unpkg.com/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
  <script src="https://unpkg.com/jszip@3.10.1/dist/jszip.min.js"></script>
  <script type="module" src="/src/i18n/i18n.js"></script>
  <script type="module" src="./toImage.js"></script>
</body>
</html>
