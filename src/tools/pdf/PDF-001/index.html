<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PDF-001 PDF 合併 - Awesome WASM Tools 1000</title>
  <meta name="description" content="合併多個 PDF 文件為一個文件，支援拖拽排序，完全在本地處理">
  <link rel="stylesheet" href="/src/styles/global.css">
</head>
<body>
  <div class="tool-page">
    <header class="tool-header">
      <a href="/index.html" class="back-btn">
        <span>←</span>
        <span data-i18n="back">返回</span>
      </a>
      <div class="tool-title">
        <h1>PDF-001 <span data-i18n="pdf001_name">PDF 合併</span></h1>
        <p data-i18n="pdf001_desc">合併多個 PDF 文件為一個文件，支援拖拽排序</p>
      </div>
      <div class="lang-switcher">
        <button onclick="setLanguage('zh-TW')" class="lang-btn">繁中</button>
        <button onclick="setLanguage('en')" class="lang-btn">EN</button>
      </div>
    </header>

    <main class="tool-content">
      <!-- Status Messages -->
      <div id="statusMessage" class="status-message"></div>

      <!-- Upload Area -->
      <div id="uploadArea" class="upload-area">
        <div class="icon">📄</div>
        <h3 data-i18n="upload_title">拖放 PDF 文件到此處</h3>
        <p data-i18n="upload_subtitle">或點擊選擇檔案（可選擇多個）</p>
        <p class="upload-formats" data-i18n="upload_formats">支援格式：PDF</p>
        <input type="file" id="fileInput" class="file-input" accept="application/pdf" multiple>
      </div>

      <!-- File List -->
      <div id="fileListContainer" class="settings-panel" style="display: none;">
        <h3 data-i18n="file_list">文件列表（拖拽排序）</h3>
        <div id="fileList" class="file-list"></div>
        <button id="addMoreBtn" class="btn btn-secondary">
          <span>+</span>
          <span data-i18n="add_more">添加更多文件</span>
        </button>
      </div>

      <!-- Progress Bar -->
      <div id="progressContainer" class="progress-container">
        <div class="progress-bar">
          <div id="progressFill" class="progress-fill"></div>
        </div>
        <p id="progressText" class="progress-text" data-i18n="processing">處理中...</p>
      </div>

      <!-- Action Buttons -->
      <div class="action-buttons">
        <button id="processBtn" class="btn btn-primary" disabled>
          <span>🔗</span>
          <span data-i18n="merge">合併 PDF</span>
        </button>
        <button id="downloadBtn" class="btn btn-success" style="display: none;">
          <span>⬇️</span>
          <span data-i18n="download">下載合併後的 PDF</span>
        </button>
        <button id="resetBtn" class="btn btn-secondary" style="display: none;">
          <span>🗑️</span>
          <span data-i18n="reset">重置</span>
        </button>
      </div>

      <!-- Performance Info -->
      <div id="performanceInfo" class="settings-panel" style="display: none;">
        <h3>📊 處理資訊</h3>
        <div class="setting-row">
          <label>處理時間</label>
          <span id="processTime">-</span>
        </div>
        <div class="setting-row">
          <label>總頁數</label>
          <span id="totalPages">-</span>
        </div>
        <div class="setting-row">
          <label>輸出大小</label>
          <span id="outputSize">-</span>
        </div>
      </div>
    </main>

    <footer class="footer">
      <p data-i18n="footer_privacy">所有檔案處理均在本地完成，不會上傳到伺服器</p>
    </footer>
  </div>

  <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
  <script type="module" src="/src/i18n/i18n.js"></script>
  <script type="module" src="./merger.js"></script>
</body>
</html>
