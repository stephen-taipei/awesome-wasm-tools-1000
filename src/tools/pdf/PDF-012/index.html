<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PDF-012 PDF 轉 Excel - Awesome WASM Tools 1000</title>
  <meta name="description" content="將 PDF 文件中的表格轉換為 Excel 格式">
  <link rel="stylesheet" href="/src/styles/global.css">
</head>
<body>
  <div class="tool-page">
    <header class="tool-header">
      <a href="/index.html" class="back-btn">
        <span>←</span>
        <span data-i18n="back">返回</span>
      </a>
      <div class="tool-title">
        <h1>PDF-012 <span data-i18n="pdf012_name">PDF 轉 Excel</span></h1>
        <p data-i18n="pdf012_desc">將 PDF 文件中的表格轉換為 Excel 格式</p>
      </div>
      <div class="lang-switcher">
        <button onclick="setLanguage('zh-TW')" class="lang-btn">繁中</button>
        <button onclick="setLanguage('en')" class="lang-btn">EN</button>
      </div>
    </header>

    <main class="tool-content">
      <div id="statusMessage" class="status-message"></div>

      <div id="uploadArea" class="upload-area">
        <div class="icon">📄</div>
        <h3 data-i18n="upload_title">拖放 PDF 文件到此處</h3>
        <p data-i18n="upload_subtitle">或點擊選擇檔案</p>
        <input type="file" id="fileInput" class="file-input" accept="application/pdf">
      </div>

      <div id="settingsPanel" class="settings-panel" style="display: none;">
        <h3 data-i18n="settings">轉換設定</h3>
        <div class="setting-row">
          <label>輸出格式</label>
          <select id="outputFormat">
            <option value="xlsx">XLSX (Excel 2007+)</option>
            <option value="csv">CSV (逗號分隔)</option>
          </select>
        </div>
        <div class="setting-row">
          <label>文件資訊</label>
          <span id="fileInfo">-</span>
        </div>
      </div>

      <div id="progressContainer" class="progress-container">
        <div class="progress-bar">
          <div id="progressFill" class="progress-fill"></div>
        </div>
        <p id="progressText" class="progress-text">處理中...</p>
      </div>

      <div class="action-buttons">
        <button id="processBtn" class="btn btn-primary" disabled>
          <span>📊</span>
          <span data-i18n="convert">轉換為 Excel</span>
        </button>
        <button id="downloadBtn" class="btn btn-success" style="display: none;">
          <span>⬇️</span>
          <span data-i18n="download">下載文件</span>
        </button>
        <button id="resetBtn" class="btn btn-secondary" style="display: none;">
          <span>🗑️</span>
          <span data-i18n="reset">重置</span>
        </button>
      </div>

      <div id="performanceInfo" class="settings-panel" style="display: none;">
        <h3>📊 處理資訊</h3>
        <div class="setting-row">
          <label>處理時間</label>
          <span id="processTime">-</span>
        </div>
        <div class="setting-row">
          <label>提取資料</label>
          <span id="dataInfo">-</span>
        </div>
      </div>
    </main>

    <footer class="footer">
      <p data-i18n="footer_privacy">所有檔案處理均在本地完成，不會上傳到伺服器</p>
    </footer>
  </div>

  <script src="https://unpkg.com/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
  <script src="https://unpkg.com/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script type="module" src="/src/i18n/i18n.js"></script>
  <script type="module" src="./toExcel.js"></script>
</body>
</html>
