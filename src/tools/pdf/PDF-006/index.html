<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PDF-006 PDF 旋轉 - Awesome WASM Tools 1000</title>
  <meta name="description" content="旋轉 PDF 文件的頁面角度">
  <link rel="stylesheet" href="/src/styles/global.css">
</head>
<body>
  <div class="tool-page">
    <header class="tool-header">
      <a href="/index.html" class="back-btn">
        <span>←</span>
        <span data-i18n="back">返回</span>
      </a>
      <div class="tool-title">
        <h1>PDF-006 <span data-i18n="pdf006_name">PDF 旋轉</span></h1>
        <p data-i18n="pdf006_desc">旋轉 PDF 文件的頁面角度</p>
      </div>
      <div class="lang-switcher">
        <button onclick="setLanguage('zh-TW')" class="lang-btn">繁中</button>
        <button onclick="setLanguage('en')" class="lang-btn">EN</button>
      </div>
    </header>

    <main class="tool-content">
      <div id="statusMessage" class="status-message"></div>

      <div id="uploadArea" class="upload-area">
        <div class="icon">📄</div>
        <h3 data-i18n="upload_title">拖放 PDF 文件到此處</h3>
        <p data-i18n="upload_subtitle">或點擊選擇檔案</p>
        <input type="file" id="fileInput" class="file-input" accept="application/pdf">
      </div>

      <div id="settingsPanel" class="settings-panel" style="display: none;">
        <h3 data-i18n="settings">旋轉設定</h3>
        <div class="setting-row">
          <label>旋轉角度</label>
          <select id="rotationAngle">
            <option value="90">順時針 90°</option>
            <option value="180">180°</option>
            <option value="270">逆時針 90°</option>
          </select>
        </div>
        <div class="setting-row">
          <label>適用範圍</label>
          <select id="applyTo">
            <option value="all">所有頁面</option>
            <option value="selected">指定頁面</option>
            <option value="odd">僅奇數頁</option>
            <option value="even">僅偶數頁</option>
          </select>
        </div>
        <div id="pageSelectionRow" class="setting-row" style="display: none;">
          <label>頁面選擇（如：1,3,5-8）</label>
          <input type="text" id="pageSelection" placeholder="1,3,5-8">
        </div>
        <div class="setting-row">
          <label>總頁數</label>
          <span id="totalPages">-</span>
        </div>
      </div>

      <div id="progressContainer" class="progress-container">
        <div class="progress-bar">
          <div id="progressFill" class="progress-fill"></div>
        </div>
        <p id="progressText" class="progress-text">處理中...</p>
      </div>

      <div class="action-buttons">
        <button id="processBtn" class="btn btn-primary" disabled>
          <span>🔄</span>
          <span data-i18n="rotate">旋轉 PDF</span>
        </button>
        <button id="downloadBtn" class="btn btn-success" style="display: none;">
          <span>⬇️</span>
          <span data-i18n="download">下載 PDF</span>
        </button>
        <button id="resetBtn" class="btn btn-secondary" style="display: none;">
          <span>🗑️</span>
          <span data-i18n="reset">重置</span>
        </button>
      </div>

      <div id="performanceInfo" class="settings-panel" style="display: none;">
        <h3>📊 處理資訊</h3>
        <div class="setting-row">
          <label>處理時間</label>
          <span id="processTime">-</span>
        </div>
        <div class="setting-row">
          <label>旋轉頁數</label>
          <span id="rotatedPages">-</span>
        </div>
      </div>
    </main>

    <footer class="footer">
      <p data-i18n="footer_privacy">所有檔案處理均在本地完成，不會上傳到伺服器</p>
    </footer>
  </div>

  <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
  <script type="module" src="/src/i18n/i18n.js"></script>
  <script type="module" src="./rotate.js"></script>
</body>
</html>
